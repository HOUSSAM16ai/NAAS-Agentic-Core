# ======================================================================================
# Dependabot — D-270 L6 (سلسلة التوريد تُبرَّد وتَصِف الموجود)
# ======================================================================================
# هذا الملفّ يصف **ما هو موجود في المستودع فعلاً**، وتحرسه
# `scripts/fitness/check_supply_chain.py`:
#
#   1. كل `directory`/`directories` يجب أن يوجد على القرص.
#   2. كل نمطٍ في `groups` يجب أن يطابق حزمةً حقيقية واحدة على الأقل
#      (من `requirements*.txt` لـpip، ومن `frontend/package.json` لـnpm).
#   3. كل ecosystem يجب أن يحمل `cooldown` — التبريد يمنع دمج نسخةٍ رُفعت للتوّ،
#      وهو الحاجز العملي الوحيد أمام هجمات سلسلة التوريد على حزمةٍ مُختطَفة.
#
# لماذا أُعيدت كتابته (مقيس 2026-08-19): النسخة السابقة كانت تستهدف `/ai_service`
# — مجلّد **غير موجود** — وتجمع `flask*` و`chromadb*` و`werkzeug` و`jinja2` تحت
# مجموعات، ولا حزمة من الأولى ولا الثانية في أيّ `requirements*.txt`. وكانت
# **لا تغطّي `frontend/` إطلاقاً** رغم وجود `package.json` حقيقي فيه. أي أنّ الملفّ
# كان يَعِد بتغطيةٍ لا يقدّمها ويصف نظاماً ليس هذا النظام.
#
# ⛔ `reviewers`/`assignees` مُهمَلان في Dependabot ويُتجاهَلان بصمت؛ المراجعة تأتي من
# `.github/CODEOWNERS` (`* @HOUSSAM16ai`) — فذكرُهما هنا كان زخرفاً لا أثر له.
# ======================================================================================

version: 2

updates:
  # ────────────────────────────────────────────────────────────────────────────────
  # Python — requirements*.txt في الجذر
  # ────────────────────────────────────────────────────────────────────────────────
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    versioning-strategy: increase
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
      include: "scope"
    labels:
      - "dependencies"
      - "python"
    groups:
      # fastapi + uvicorn + pydantic تتحرّك معاً؛ ترقية واحدة منها منفردةً تكسر الباقي.
      web-stack:
        patterns:
          - "fastapi"
          - "uvicorn"
          - "uvloop"
          - "httptools"
          - "watchfiles"
          - "pydantic"
          - "pydantic-settings"
          - "python-multipart"
          - "websockets"
      database-stack:
        patterns:
          - "SQLAlchemy"
          - "sqlmodel"
          - "alembic"
          - "asyncpg"
          - "aiosqlite"
          - "psycopg-binary"
          - "psycopg2-binary"
          - "greenlet"
          - "vecs"
      # سلسلة النماذج والاسترجاع. ⚠️ ترقيتها لا تُغيّر أبداً حرفيات السلسلة
      # المحروسة أمنياً (D-174 · ISS-079/ISS-107) — تلك تُبدَّل بدليلٍ حيّ لا بترقية.
      llm-stack:
        patterns:
          - "openai"
          - "litellm"
          - "langchain*"
          - "langgraph*"
          - "llama-index*"
          - "dspy"
          - "huggingface-hub"
          - "sentence-transformers"
          - "tavily-python"
          - "firecrawl-py"
          - "duckduckgo-search"
      observability-stack:
        patterns:
          - "prometheus-client"
          - "opentelemetry-*"
          - "python-json-logger"
      # ruff وmypy مُثبَّتان في `ci.yml` عمداً (D-184: أداةٌ تتغيّر تحت المستودع ليست
      # بوّابة بل رمية عملة). ترقيتهما هنا تتطلّب تحديث التثبيت في الـworkflow معاً.
      testing-and-lint:
        patterns:
          - "pytest*"
          - "coverage"
          - "hypothesis"
          - "factory-boy"
          - "Faker"
          - "ruff"
          - "mypy"
          - "mypy_extensions"
          - "types-*"
          - "bandit"
          - "safety*"
          - "black"
      security-stack:
        patterns:
          - "cryptography"
          - "PyJWT"
          - "pyjwt"
          - "Authlib"
          - "passlib"
          - "bcrypt"
          - "argon2-cffi"
          - "argon2-cffi-bindings"

  # ────────────────────────────────────────────────────────────────────────────────
  # npm — الواجهة (frontend/package.json). لم تكن مُغطّاة إطلاقاً قبل D-270.
  # ────────────────────────────────────────────────────────────────────────────────
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    versioning-strategy: increase
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "dependencies"
      - "frontend"
    groups:
      next-react:
        patterns:
          - "next"
          - "react"
          - "react-dom"
          - "eslint-config-next"
          - "eslint"
      markdown-math:
        patterns:
          - "react-markdown"
          - "rehype-katex"
          - "remark-math"
          - "katex"

  # ────────────────────────────────────────────────────────────────────────────────
  # Docker — الصور المبنيّة فعلاً (D-205: كل الصور مبنيّة ومُثبَتة الاستيراد).
  # ────────────────────────────────────────────────────────────────────────────────
  - package-ecosystem: "docker"
    directories:
      - "/"
      - "/frontend"
      - "/microservices/*"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "06:00"
      timezone: "UTC"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "dependencies"
      - "docker"

  # ────────────────────────────────────────────────────────────────────────────────
  # GitHub Actions — D-141 يشترط بقاء كل إجراء على node24 بلا تحذيرات.
  # ────────────────────────────────────────────────────────────────────────────────
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "wednesday"
      time: "06:00"
      timezone: "UTC"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
      include: "scope"
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      actions:
        patterns:
          - "*"
