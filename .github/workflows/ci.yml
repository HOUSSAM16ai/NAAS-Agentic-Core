name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  PYTHON_VERSION: "3.12"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: "sqlite+aiosqlite:///:memory:"
      SECRET_KEY: test-secret-key-for-ci-pipeline-secure-length
      ENVIRONMENT: testing
      LLM_MOCK_MODE: "1"
      SUPABASE_URL: https://dummy.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: dummy-key-for-ci
      RECOVERY_ADMIN_PASSWORD: dummy-pass-for-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: ./.github/actions/setup
      - name: Install lint dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          # Keep lint setup resilient when an exact pinned Ruff build is unavailable
          pip install "ruff>=0.6,<1"
      - name: Ruff lint
        shell: bash
        run: |
          set -euo pipefail
          ruff check .
      - name: Ruff format check
        shell: bash
        run: |
          set -euo pipefail
          ruff format --check .

  contracts:
    name: contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: "sqlite+aiosqlite:///:memory:"
      SECRET_KEY: test-secret-key-for-ci-pipeline-secure-length
      ENVIRONMENT: testing
      LLM_MOCK_MODE: "1"
      SUPABASE_URL: https://dummy.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: dummy-key-for-ci
      RECOVERY_ADMIN_PASSWORD: dummy-pass-for-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: ./.github/actions/setup
      - name: Install contract dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install "pytest==7.4.4" SQLAlchemy pydantic PyJWT passlib bcrypt
      - name: Validate contracts and provider parity
        shell: bash
        run: |
          set -euo pipefail
          python scripts/fitness/check_gateway_provider_contracts.py
          python -m pytest -q tests/contracts/test_gateway_provider_contracts.py

  guardrails:
    name: guardrails
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: "sqlite+aiosqlite:///:memory:"
      SECRET_KEY: test-secret-key-for-ci-pipeline-secure-length
      ENVIRONMENT: testing
      LLM_MOCK_MODE: "1"
      SUPABASE_URL: https://dummy.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: dummy-key-for-ci
      RECOVERY_ADMIN_PASSWORD: dummy-pass-for-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - uses: ./.github/actions/setup
      - name: Install guardrail dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt
      - name: Run architectural guardrails
        shell: bash
        run: |
          set -euo pipefail
          python scripts/ci_guardrails.py
          python scripts/fitness/check_no_app_imports_in_microservices.py --strict
          python scripts/fitness/check_route_registry_parity.py
          python scripts/fitness/check_tracing_gate.py

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: "sqlite+aiosqlite:///:memory:"
      SECRET_KEY: test-secret-key-for-ci-pipeline-secure-length
      ENVIRONMENT: testing
      LLM_MOCK_MODE: "1"
      SUPABASE_URL: https://dummy.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: dummy-key-for-ci
      RECOVERY_ADMIN_PASSWORD: dummy-pass-for-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - uses: ./.github/actions/setup
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt
      - name: Run tests
        shell: bash
        run: |
          set -euo pipefail
          run_pytest() {
            set +e
            "$@"
            pytest_exit_code=$?
            set -e

            if [ "$pytest_exit_code" -eq 5 ]; then
              echo "::warning::pytest collected no tests; treating as a non-blocking skip."
              return 0
            fi

            return "$pytest_exit_code"
          }

          if python -m pytest --help | grep -q -- "--cov"; then
            run_pytest python -m pytest -v \
              --cov=app \
              --cov-report=xml:coverage.xml \
              --cov-report=term-missing \
              --durations=10 \
              --tb=short
          else
            echo "::warning::pytest-cov plugin is unavailable; running test suite without coverage."
            run_pytest python -m pytest -v --durations=10 --tb=short
          fi
      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 7

  # ── Microservices Skills Structural Check ─────────────────────────────────
  skills-structural:
    name: skills-structural
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify Skills Architecture structural invariants
        shell: bash
        run: |
          set -euo pipefail

          echo "=== 1. Every Skill has prom_metrics.py ==="
          SKILLS=(orchestrator_service user_service planning_agent conversation_service research_agent reasoning_agent content_retrieval_skill)
          FAILED=0
          for skill in "${SKILLS[@]}"; do
            if ! find "microservices/${skill}" -name "prom_metrics.py" -q 2>/dev/null; then
              echo "FAIL: microservices/${skill} missing prom_metrics.py"
              FAILED=1
            else
              echo "PASS: ${skill} has prom_metrics.py"
            fi
          done

          echo "=== 2. Every Skill has /health in main.py ==="
          for skill in "${SKILLS[@]}"; do
            main=$(find "microservices/${skill}" -name "main.py" 2>/dev/null | head -1)
            if [ -z "$main" ]; then
              echo "FAIL: microservices/${skill} missing main.py"
              FAILED=1
            elif ! grep -q "health" "$main"; then
              echo "FAIL: ${skill}/main.py missing /health endpoint"
              FAILED=1
            else
              echo "PASS: ${skill} has /health"
            fi
          done

          echo "=== 3. Prometheus config has ≥ 12 scrape jobs ==="
          count=$(grep -c "job_name:" observability/native/prometheus.yml || echo 0)
          if [ "$count" -lt 12 ]; then
            echo "FAIL: Only ${count} Prometheus scrape jobs (need ≥ 12)"
            FAILED=1
          else
            echo "PASS: ${count} Prometheus scrape jobs"
          fi

          echo "=== 4. Grafana dashboards ≥ 16 ==="
          dash_count=$(find observability/grafana/dashboards -name "*.json" 2>/dev/null | wc -l)
          if [ "$dash_count" -lt 16 ]; then
            echo "FAIL: Only ${dash_count} Grafana dashboards (need ≥ 16)"
            FAILED=1
          else
            echo "PASS: ${dash_count} Grafana dashboards"
          fi

          exit $FAILED

  required-ci:
    name: required-ci
    runs-on: ubuntu-latest
    needs: [lint, contracts, guardrails, test, skills-structural]
    if: always() && !cancelled()
    steps:
      - name: Evaluate required checks
        shell: bash
        run: |
          set -euo pipefail
          echo "lint=${{ needs.lint.result }}"
          echo "contracts=${{ needs.contracts.result }}"
          echo "guardrails=${{ needs.guardrails.result }}"
          echo "test=${{ needs.test.result }}"
          echo "skills-structural=${{ needs.skills-structural.result }}"

          # Allow skipped as a valid success state alongside success
          isValid() {
            [ "$1" = "success" ] || [ "$1" = "skipped" ]
          }

          if ! isValid "${{ needs.lint.result }}" || \
             ! isValid "${{ needs.contracts.result }}" || \
             ! isValid "${{ needs.guardrails.result }}" || \
             ! isValid "${{ needs.test.result }}" || \
             ! isValid "${{ needs.skills-structural.result }}"; then
            echo "❌ One or more required checks failed"
            exit 1
          fi

          echo "✅ All required checks passed"
          echo ""
          echo "Skills Architecture: ✅ Verified"
          echo "Microservices: 8 services | Prometheus: ≥12 targets | Grafana: ≥16 dashboards"
