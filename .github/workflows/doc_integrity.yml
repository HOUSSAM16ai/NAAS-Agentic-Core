name: doc-integrity

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: doc-integrity-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  doc-integrity:
    name: doc-integrity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # D-188: existence is not coherence. This gate catches the drift class that
      # went unnoticed for two months — a stale sovereign index, a decision filed
      # out of order, a constitution growing back into an encyclopedia, and a
      # runtime-truth lock older than the newest decision.
      - name: Memory coherence (D-188)
        run: python scripts/fitness/check_memory_coherence.py

      # D-192: coherence is not truth. This gate catches the class D-188 could not
      # see — a hand-typed number in prose. CLAUDE.md contradicted *itself* in two
      # places (24 vs 27 skills; API-first 13/13 vs 11/11) and both values were
      # wrong. Numbers are now derived from the source, and every constitutional
      # rule that names a symbol is tested against the code.
      - name: Constitution equals reality (D-192)
        run: python scripts/fitness/check_constitution_reality.py

      # ISS-149 (F3): truth is not reachability. DOCUMENTATION_INDEX.md calls
      # itself the complete authority map, and three of its links pointed at
      # paths that do not exist — including ADR-006 itself, filed under
      # `docs/adr/` while the map sent readers to `docs/architecture/adr/`.
      # Nothing caught it; a question about languages did. A map that lies is
      # worse than no map: it is read closely by exactly the people trying to
      # be careful.
      - name: Authority links resolve (ISS-149)
        run: python scripts/fitness/check_authority_links.py

      - name: CLAUDE.md exists and is non-empty
        run: |
          test -f CLAUDE.md || { echo "::error::CLAUDE.md is missing"; exit 1; }
          test -s CLAUDE.md || { echo "::error::CLAUDE.md is empty"; exit 1; }
          # Minimum sanity: must contain the truth-table sections + closing rule.
          required_anchors=(
            "## 6.5 Architecture Truth and Persistence Rules"
            "## 6.6 Architecture Truth and Runtime Rules"
            "import.*call chain.*runtime evidence"
          )
          for anchor in "${required_anchors[@]}"; do
            if ! grep -Eq "$anchor" CLAUDE.md; then
              echo "::error::CLAUDE.md missing required anchor: $anchor"
              exit 1
            fi
          done

      - name: .memory/ files exist and are non-empty
        run: |
          required_files=(
            ".memory/runtime_truth.md"
            ".memory/architecture.md"
            ".memory/decisions.md"
            ".memory/issues.md"
            ".memory/context.md"
            ".memory/tasks.md"
            ".memory/observability_truth.md"
          )
          missing=0
          for f in "${required_files[@]}"; do
            if [ ! -f "$f" ]; then
              echo "::error::$f is missing"
              missing=1
            elif [ ! -s "$f" ]; then
              echo "::error::$f is empty"
              missing=1
            fi
          done
          [ $missing -eq 0 ] || exit 1

      - name: No scratch artifacts in repo root
        run: |
          # These patterns are diagnostic dumps that should never be committed.
          patterns=(
            "*_errors.txt"
            "*_coverage*.txt"
            "proof_output.txt"
            "app_imports.txt"
            "commit_message.txt"
            "telemetry_evidence.txt"
            "patch_*.diff"
            "ruff_output*.txt"
            "ruff_check_verify.txt"
            "ruff_format_verify.txt"
            "err_*.txt"
            "Screenshot_*.png"
            "verification_*.png"
            "collection_errors.txt"
            "core_errors.txt"
            "services_errors*.txt"
          )
          # Only check repo root (maxdepth 1).
          fail=0
          for pat in "${patterns[@]}"; do
            matches=$(find . -maxdepth 1 -type f -name "$pat" 2>/dev/null || true)
            if [ -n "$matches" ]; then
              echo "::warning::Scratch artifact(s) in repo root match pattern '$pat':"
              echo "$matches"
              fail=1
            fi
          done
          # Cleanup PR has landed. Fail if any match.
          exit $fail

      - name: No dated diagnostic dumps outside docs/archive
        run: |
          # Phase reports, dated forensics, and ULTRA_* files belong in docs/archive,
          # not in docs/ root or docs/diagnostics/. Enforced since D-156.
          patterns=(
            "PHASE_[0-9]*_*.md"
            "ULTRA_FORENSIC_*.md"
            "ULTRA_SURGICAL_*.md"
            "*_DIAGNOSIS_2026-*.md"
            "FORENSIC_BASELINE_*.md"
          )
          fail=0
          for pat in "${patterns[@]}"; do
            matches=$(find docs -path docs/archive -prune -o -type f -name "$pat" -print 2>/dev/null || true)
            if [ -n "$matches" ]; then
              echo "::error::Dated diagnostic outside docs/archive match '$pat' (move it to docs/archive/<category>/):"
              echo "$matches"
              fail=1
            fi
          done
          # Enforced (D-156): the consolidation PR has landed. Dated diagnostics
          # MUST live in docs/archive — fail if any match escapes the archive.
          exit $fail

      - name: Truth-table coherence (no orphan rows)
        run: |
          # Quick sanity: runtime_truth.md must reference the live entrypoints.
          required_refs=(
            "app/api/routers/customer_chat.py"
            "app/api/routers/admin.py"
            "app/services/chat/local_graph.py"
            "app/infrastructure/clients/orchestrator_client.py"
            "app/kernel.py"
            "_emit_terminal_frames"
          )
          missing=0
          for ref in "${required_refs[@]}"; do
            if ! grep -q "$ref" .memory/runtime_truth.md; then
              echo "::error::.memory/runtime_truth.md missing required reference: $ref"
              missing=1
            fi
          done
          [ $missing -eq 0 ] || exit 1

      - name: Closing-rule preserved verbatim
        run: |
          # The three-part proof rule must remain in CLAUDE.md (do not weaken it).
          required_phrases=(
            "import"
            "call chain"
            "runtime evidence"
            "DORMANT"
            "ZOMBIE"
          )
          for phrase in "${required_phrases[@]}"; do
            if ! grep -qi "$phrase" CLAUDE.md; then
              echo "::error::CLAUDE.md no longer contains '$phrase' — closing rule may have been weakened"
              exit 1
            fi
          done
