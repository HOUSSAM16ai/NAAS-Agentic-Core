name: "Docker Full-Stack Gate (R0.1/R0.2 — D-172)"

# Lightweight, fast gate for the reproducible Docker full stack. Validates the
# compose topology + the D-172 artifacts on every change. It does NOT run a full
# `up` (too heavy for CI); the runtime proof is scripts/verify_full_stack_docker.py
# (run live), and the R0.2 checkpointer import is asserted by the main
# test-microservices job (tests/microservices/.../test_r02_checkpointer_import.py).

on:
  push:
    branches: ["main"]
    paths:
      - "docker-compose.yml"
      - "observability/compose/**"
      - "scripts/compose_env_from_secrets.sh"
      - "scripts/verify_full_stack_docker.py"
      - ".env.example"
      - "shared/messaging/**"
      - "app/services/messaging/**"
      - "scripts/verify_event_stack_docker.py"
      - "requirements-messaging.txt"
      - "microservices/orchestrator_service/requirements.txt"
      - ".github/workflows/docker-fullstack-gate.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "docker-compose.yml"
      - "observability/compose/**"
      - "scripts/compose_env_from_secrets.sh"
      - "scripts/verify_full_stack_docker.py"
      - ".env.example"
      - "shared/messaging/**"
      - "app/services/messaging/**"
      - "scripts/verify_event_stack_docker.py"
      - "requirements-messaging.txt"
      - "microservices/orchestrator_service/requirements.txt"
      - ".github/workflows/docker-fullstack-gate.yml"

concurrency:
  group: docker-fullstack-gate-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  compose-validate:
    name: "Compose config + D-172 artifacts"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: "docker compose config validates"
        run: |
          docker compose -f docker-compose.yml config -q
          echo "✅ docker-compose.yml is valid"

      - name: "Network is compose-managed (not external — R0.1 auto-boot)"
        run: |
          if docker compose -f docker-compose.yml config | grep -A4 '^networks:' | grep -q 'external: true'; then
            echo "❌ cogniforge-network is still external — `up` needs a manual pre-step"
            exit 1
          fi
          echo "✅ cogniforge-network is compose-managed (self-creating)"

      - name: "Prometheus + Grafana present (observability gate)"
        run: |
          svcs=$(docker compose -f docker-compose.yml config --services)
          echo "$svcs" | grep -qx prometheus || { echo "❌ prometheus service missing"; exit 1; }
          echo "$svcs" | grep -qx grafana || { echo "❌ grafana service missing"; exit 1; }
          echo "✅ prometheus + grafana are in the stack"

      - name: "observability/compose/prometheus.yml is valid YAML"
        run: |
          python3 -c "import yaml,sys; d=yaml.safe_load(open('observability/compose/prometheus.yml')); assert d.get('scrape_configs'), 'no scrape_configs'; print('✅ prometheus.yml valid,', len(d['scrape_configs']), 'jobs')"

      - name: "R0.2: orchestrator installs the checkpointer stack"
        run: |
          req=microservices/orchestrator_service/requirements.txt
          grep -q 'langgraph-checkpoint-postgres' "$req" || { echo "❌ langgraph-checkpoint-postgres missing from orchestrator requirements (R0.2)"; exit 1; }
          grep -qE 'psycopg\[.*(pool).*\]|psycopg-pool' "$req" || { echo "❌ psycopg pool missing from orchestrator requirements (R0.2)"; exit 1; }
          echo "✅ orchestrator requirements install the real Postgres checkpointer stack"

      - name: "Secret bridge + verify script are syntactically valid"
        run: |
          bash -n scripts/compose_env_from_secrets.sh && echo "✅ compose_env_from_secrets.sh"
          python3 -m py_compile scripts/verify_full_stack_docker.py && echo "✅ verify_full_stack_docker.py"
