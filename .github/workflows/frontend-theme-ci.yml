name: Frontend Theme CI

# ISS-067 (D-059): يتحقق من صحة نظام الـ theme في كل PR يمس الـ frontend.
# 6 jobs: theme-contracts | anti-flash-gate | theme-button-gate | build-check | lint | regression

on:
  pull_request:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-theme-ci.yml"
  push:
    branches: [main]
    paths:
      - "frontend/**"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: frontend-theme-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  NODE_VERSION: "20"

jobs:
  # ─── Job 1: Theme CSS Contracts ──────────────────────────────────────────
  theme-contracts:
    name: theme-contracts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Verify html[data-theme] selectors
        shell: bash
        run: |
          set -euo pipefail
          count=$(grep -c "html\[data-theme=" frontend/app/globals.css || true)
          if [ "$count" -lt 2 ]; then
            echo "❌ Expected ≥2 html[data-theme] selectors, found $count"
            exit 1
          fi
          echo "✅ html[data-theme] selectors: $count"

      - name: Verify CSS variables in both themes
        shell: bash
        run: |
          set -euo pipefail
          # NOTE: every grep below uses `-e --` so that CSS variable names that
          # start with `--` (e.g. `--bg-color`) are NOT swallowed as GNU/ugrep
          # long-options. Without `--`, `grep -c "--bg-color" file` is parsed
          # as `grep -c --bg-color file` and fails with "unrecognized option".
          for var in "--bg-color" "--text-color" "--surface-color" "--border-color" \
                     "--primary-color" "--pre-bg" "--pre-color" "--code-bg" "--code-color"; do
            count=$(grep -c -e "$var" -- frontend/app/globals.css || true)
            count="${count:-0}"
            if [ "$count" -lt 2 ]; then
              echo "❌ $var must appear in both light and dark blocks (found $count)"
              exit 1
            fi
            echo "✅ $var: $count definitions"
          done

      - name: Verify :root has fallback code vars (ISS-067)
        shell: bash
        run: |
          set -euo pipefail
          # Extract :root block — stops at first blank line after closing brace
          # Use line numbers: :root starts at first ":root {" line, ends before next top-level selector
          root_start=$(grep -n "^:root {" frontend/app/globals.css | head -1 | cut -d: -f1)
          if [ -z "$root_start" ]; then
            echo "❌ :root block not found"
            exit 1
          fi
          # Read 60 lines from :root start (enough to cover all vars)
          root_block=$(tail -n +"$root_start" frontend/app/globals.css | head -60)
          # `grep -e --` defends against `--code-bg` being parsed as a long-option.
          for var in "--code-bg" "--pre-bg" "--code-color" "--pre-color"; do
            if ! printf '%s\n' "$root_block" | grep -q -e "$var" --; then
              echo "❌ $var missing from :root fallback — ISS-067 requires all vars in :root"
              exit 1
            fi
            echo "✅ :root has $var"
          done

      - name: Verify no hard-coded dark colors in pre/code
        shell: bash
        run: |
          set -euo pipefail
          if grep -A5 "\.markdown-content pre" frontend/app/globals.css | grep -q "#0f172a"; then
            echo "❌ .markdown-content pre uses hard-coded #0f172a — use var(--pre-bg)"
            exit 1
          fi
          echo "✅ No hard-coded dark colors in pre/code"

      - name: Verify light mode overrides section
        shell: bash
        run: |
          set -euo pipefail
          if ! grep -q "Light Mode Luxury" frontend/app/globals.css; then
            echo "❌ Light Mode Luxury overrides section missing"
            exit 1
          fi
          count=$(grep -c "html\[data-theme='light'\]" frontend/app/globals.css || true)
          echo "✅ Light mode overrides: $count rules"

  # ─── Job 2: Anti-Flash Gate ───────────────────────────────────────────────
  anti-flash-gate:
    name: anti-flash-gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Verify theme-init.js in public/
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f "frontend/public/theme-init.js" ]; then
            echo "❌ frontend/public/theme-init.js missing"
            echo "   Next.js 16: dangerouslySetInnerHTML moves to body — use /public file"
            exit 1
          fi
          for check in "localStorage.getItem" "dataset.theme" "colorScheme"; do
            if ! grep -q "$check" frontend/public/theme-init.js; then
              echo "❌ theme-init.js missing: $check"
              exit 1
            fi
          done
          echo "✅ theme-init.js present and correct"

      - name: Verify layout.jsx loads theme-init.js synchronously
        shell: bash
        run: |
          set -euo pipefail
          if ! grep -q "theme-init.js" frontend/app/layout.jsx; then
            echo "❌ layout.jsx must load /theme-init.js via <script src>"
            exit 1
          fi
          if grep -q "theme-init.js.*async" frontend/app/layout.jsx; then
            echo "❌ theme-init.js must be synchronous (no async attribute)"
            exit 1
          fi
          echo "✅ layout.jsx loads theme-init.js synchronously"

      - name: Verify lazy useState (no flash pattern)
        shell: bash
        run: |
          set -euo pipefail
          if grep -q "useState('dark')" frontend/app/components/CogniForgeApp.jsx; then
            echo "❌ useState('dark') causes flash — use lazy initializer"
            exit 1
          fi
          if ! grep -q "useState(() =>" frontend/app/components/CogniForgeApp.jsx; then
            echo "❌ Lazy useState initializer missing"
            exit 1
          fi
          echo "✅ Lazy useState initializer present"

      - name: Verify triple theme application
        shell: bash
        run: |
          set -euo pipefail
          for check in "root.dataset.theme" "document.body.dataset.theme" "colorScheme"; do
            if ! grep -q "$check" frontend/app/components/CogniForgeApp.jsx; then
              echo "❌ Missing: $check"
              exit 1
            fi
          done
          echo "✅ Triple theme application: html + body + colorScheme"

  # ─── Job 3: Theme Button Visibility Gate (ISS-067) ───────────────────────
  theme-button-gate:
    name: theme-button-gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Verify dedicated theme button exists
        shell: bash
        run: |
          set -euo pipefail
          if ! grep -q "header-theme-btn" frontend/app/components/CogniForgeApp.jsx; then
            echo "❌ header-theme-btn missing — ISS-067: theme button must be always visible"
            exit 1
          fi
          if ! grep -q "header-theme-btn" frontend/app/globals.css; then
            echo "❌ .header-theme-btn CSS missing from globals.css"
            exit 1
          fi
          echo "✅ Dedicated theme button (header-theme-btn) present"

      - name: Verify theme button is outside dropdown
        shell: bash
        run: |
          set -euo pipefail
          theme_line=$(grep -n "header-theme-btn" frontend/app/components/CogniForgeApp.jsx \
            | head -1 | cut -d: -f1)
          menu_line=$(grep -n "isMenuOpen &&" frontend/app/components/CogniForgeApp.jsx \
            | head -1 | cut -d: -f1)
          echo "header-theme-btn at line: $theme_line"
          echo "isMenuOpen && at line:    $menu_line"
          if [ -z "$theme_line" ] || [ -z "$menu_line" ]; then
            echo "❌ Could not locate theme button or menu"
            exit 1
          fi
          if [ "$theme_line" -ge "$menu_line" ]; then
            echo "❌ Theme button must appear BEFORE dropdown (line $theme_line >= $menu_line)"
            exit 1
          fi
          echo "✅ Theme button outside dropdown (line $theme_line < $menu_line)"

      - name: Verify theme button accessibility
        shell: bash
        run: |
          set -euo pipefail
          if ! grep -A5 "header-theme-btn" frontend/app/components/CogniForgeApp.jsx \
              | grep -q "aria-label"; then
            echo "❌ header-theme-btn missing aria-label"
            exit 1
          fi
          echo "✅ Theme button has aria-label"

      - name: Verify theme button CSS completeness
        shell: bash
        run: |
          set -euo pipefail
          for selector in ".header-theme-btn" ".header-theme-btn:hover" ".header-theme-btn:active"; do
            if ! grep -q "$selector" frontend/app/globals.css; then
              echo "❌ CSS missing: $selector"
              exit 1
            fi
            echo "✅ CSS present: $selector"
          done

  # ─── Job 4: Next.js Build Check ──────────────────────────────────────────
  build-check:
    name: build-check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci --prefer-offline

      - name: Next.js production build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: ""
          NODE_ENV: production
        run: npm run build
        timeout-minutes: 10

      - name: Verify compiled CSS has required tokens
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail
          css_file=$(find .next/static/chunks -name "*.css" | head -1)
          if [ -z "$css_file" ]; then
            echo "❌ No compiled CSS found"
            exit 1
          fi
          echo "Checking: $css_file ($(wc -c < "$css_file") bytes)"
          # `grep -q -e "--token" --` is mandatory: without `-e`, patterns
          # starting with `--` are eaten as long-options on Ubuntu's
          # ugrep/grep and the entire check silently fails with
          # "unrecognized option --code-bg".
          for token in "header-theme-btn" "--code-bg" "--pre-bg" "data-theme"; do
            if ! grep -q -e "$token" -- "$css_file"; then
              echo "❌ '$token' missing from compiled CSS"
              exit 1
            fi
            echo "✅ '$token' in compiled CSS"
          done

      - name: Verify theme-init.js in production HTML head
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail
          html_file=".next/server/app/index.html"
          if [ ! -f "$html_file" ]; then
            echo "⚠️  index.html not found — skipping"
            exit 0
          fi
          if ! grep -q "theme-init.js" "$html_file"; then
            echo "❌ theme-init.js not in production HTML"
            exit 1
          fi
          head_content=$(awk '/<head/,/<\/head>/' "$html_file")
          if ! echo "$head_content" | grep -q "theme-init.js"; then
            echo "❌ theme-init.js is in <body>, not <head> — FOUC will occur"
            exit 1
          fi
          echo "✅ theme-init.js in <head> of production HTML"

  # ─── Job 5: ESLint ───────────────────────────────────────────────────────
  lint-frontend:
    name: lint-frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci --prefer-offline

      - name: ESLint
        working-directory: frontend
        run: npx eslint app/ --ext .js,.jsx --max-warnings 0 || true

      - name: console.log audit
        shell: bash
        run: |
          count=$(grep -rn "console\.log" frontend/app/ --include="*.jsx" --include="*.js" \
            | grep -v "//.*console\.log" | wc -l || true)
          if [ "$count" -gt 5 ]; then
            echo "⚠️  $count console.log in frontend/app/"
            grep -rn "console\.log" frontend/app/ --include="*.jsx" --include="*.js" \
              | grep -v "//.*console\.log" | head -10
          else
            echo "✅ console.log count: $count"
          fi

  # ─── Job 6: Theme Regression ─────────────────────────────────────────────
  theme-regression:
    name: theme-regression
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: CSS variable symmetry
        shell: bash
        run: |
          set -euo pipefail
          # `grep -e -- "--var"` is the only safe form when the pattern itself
          # starts with `--` (which would otherwise be eaten as a long-option).
          for var in "--bg-color" "--text-color" "--surface-color" "--border-color" \
                     "--primary-color" "--pre-bg" "--code-bg"; do
            count=$(grep -c -e "$var" -- frontend/app/globals.css || true)
            count="${count:-0}"
            if [ "$count" -lt 2 ]; then
              echo "❌ $var not symmetric (count: $count)"
              exit 1
            fi
            echo "✅ $var: $count occurrences"
          done

      - name: Theme toggle text
        shell: bash
        run: |
          set -euo pipefail
          for text in "الوضع النهاري" "الوضع المظلم"; do
            if ! grep -q "$text" frontend/app/components/CogniForgeApp.jsx; then
              echo "❌ '$text' missing"
              exit 1
            fi
            echo "✅ '$text' present"
          done

      - name: Overflow defense
        shell: bash
        run: |
          set -euo pipefail
          for rule in "overflow-x: hidden" "min-width: 0"; do
            count=$(grep -c "$rule" frontend/app/globals.css || true)
            if [ "$count" -lt 5 ]; then
              echo "❌ '$rule': $count (expected ≥5)"
              exit 1
            fi
            echo "✅ '$rule': $count"
          done

      - name: Turbopack single-block check
        shell: bash
        run: |
          set -euo pipefail
          first_body=$(awk '/^body \{/,/^\}/' frontend/app/globals.css | head -20)
          if ! echo "$first_body" | grep -q "background"; then
            echo "❌ First body { block missing background — Turbopack may drop it"
            exit 1
          fi
          echo "✅ body { block has background property"

  # ─── Summary ──────────────────────────────────────────────────────────────
  frontend-theme-summary:
    name: frontend-theme-summary
    runs-on: ubuntu-latest
    needs:
      - theme-contracts
      - anti-flash-gate
      - theme-button-gate
      - build-check
      - lint-frontend
      - theme-regression
    if: always()
    steps:
      - name: Report
        shell: bash
        run: |
          echo "=== Frontend Theme CI — ISS-067 ==="
          echo "theme-contracts:   ${{ needs.theme-contracts.result }}"
          echo "anti-flash-gate:   ${{ needs.anti-flash-gate.result }}"
          echo "theme-button-gate: ${{ needs.theme-button-gate.result }}"
          echo "build-check:       ${{ needs.build-check.result }}"
          echo "lint-frontend:     ${{ needs.lint-frontend.result }}"
          echo "theme-regression:  ${{ needs.theme-regression.result }}"

          if [ "${{ needs.theme-contracts.result }}"   != "success" ] || \
             [ "${{ needs.anti-flash-gate.result }}"   != "success" ] || \
             [ "${{ needs.theme-button-gate.result }}" != "success" ] || \
             [ "${{ needs.build-check.result }}"       != "success" ] || \
             [ "${{ needs.theme-regression.result }}"  != "success" ]; then
            echo "❌ One or more critical jobs failed"
            exit 1
          fi
          echo "✅ All theme checks passed (ISS-067)"
