# ─────────────────────────────────────────────────────────────────────────────
# CI Gate — Generative UI Streaming Contract
#
# يتحقق من عقد بثّ مكوّنات الواجهة التوليدية (ui_component) عبر الطبقات:
#   1. backend-contract  — UIComponentPayload + detector + normalizer (pytest)
#   2. passthrough-wiring — ui_component يمرّ عبر _normalize_stream_event
#   3. frontend-wiring    — useAgentSocket + ChatInterface + Error Boundary
#   4. frontend-build     — Next.js يبني المكوّنات بلا أخطاء تصيير
# ─────────────────────────────────────────────────────────────────────────────

name: "Generative UI Streaming Gate"

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: generative-ui-gate-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  PYTHON_VERSION: "3.12"

jobs:
  # ── Job 1: backend contract + detector + normalizer ───────────────────────
  backend-contract:
    name: backend-contract
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      DATABASE_URL: "sqlite+aiosqlite:///:memory:"
      SECRET_KEY: "test-secret-key-for-ci-pipeline-secure-length"
      ENVIRONMENT: "testing"
      LLM_MOCK_MODE: "1"
      SUPABASE_URL: "https://dummy.supabase.co"
      SUPABASE_ROLE_KEY: "dummy"
      ORCHESTRATOR_SERVICE_URL: "http://orchestrator-service:8006"
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install CI dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt
          pip install pytest==7.4.4 pytest-asyncio==0.21.1
      - name: Run generative UI streaming contract tests
        run: |
          pytest tests/contracts/test_generative_ui_streaming.py -q --no-cov -p no:cacheprovider

  # ── Job 2: passthrough wiring (static guards) ─────────────────────────────
  passthrough-wiring:
    name: passthrough-wiring
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Verify ui_component survives the orchestrator_client normalizer
        run: |
          python3 <<'PY'
          import pathlib
          import sys

          # D-164/D-166: the orchestrator tutor logic is decomposed across
          # orchestrator_client.py + mixins under orchestrator/ + the brain
          # (see TUTOR_SOURCE_FILES). Glob-based so future slices are covered.
          _base = pathlib.Path("app/infrastructure/clients")
          _tutor_files = [
              _base / "orchestrator_client.py",
              pathlib.Path("app/services/skills/probability_tutor_brain.py"),
              *sorted(pathlib.Path("app/services/skills/probability_brain").glob("*.py")),
              *sorted((_base / "orchestrator").glob("*.py")),
          ]
          src = "\n".join(p.read_text() for p in _tutor_files)
          checks = {
              "ui_component in passthrough set": '"ui_component"',
              "dedicated normalizer method": "_normalize_ui_component_event",
              "detector method": "_detect_probability_tree",
              "normalizer routes ui_component": 'raw_type == "ui_component"',
              "emits ui_component event in chat_with_agent": '"component": "probability_tree"',
          }
          failed = False
          for name, pattern in checks.items():
              if pattern not in src:
                  print(f"FAIL: orchestrator tutor source missing {name}")
                  failed = True
              else:
                  print(f"PASS: {name}")
          sys.exit(1 if failed else 0)
          PY
      - name: Verify UI contract is defined and whitelisted
        run: |
          python3 <<'PY'
          import pathlib
          import sys

          src = pathlib.Path("app/contracts/streaming.py").read_text()
          checks = {
              "UI_COMPONENT message type": 'UI_COMPONENT = "ui_component"',
              "UIComponentPayload model": "class UIComponentPayload",
              "component whitelist": "KNOWN_UI_COMPONENTS",
              "probability_tree registered": "probability_tree",
          }
          failed = False
          for name, pattern in checks.items():
              if pattern not in src:
                  print(f"FAIL: streaming.py missing {name}")
                  failed = True
              else:
                  print(f"PASS: {name}")
          sys.exit(1 if failed else 0)
          PY

  # ── Job 3: frontend wiring + behavioral regression ────────────────────────
  frontend-wiring:
    name: frontend-wiring
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
      - name: Run generative UI frontend regression suite
        run: node frontend/tests/generative_ui_streaming.test.mjs

  # ── Job 4: frontend build (compile proof, no crash) ───────────────────────
  frontend-build:
    name: frontend-build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Build Next.js (compiles generative UI components)
        working-directory: frontend
        run: npm run build

  # ── Final Gate ─────────────────────────────────────────────────────────────
  generative-ui-gate-required:
    name: generative-ui-gate-required
    runs-on: ubuntu-latest
    needs:
      - backend-contract
      - passthrough-wiring
      - frontend-wiring
      - frontend-build
    if: always() && !cancelled()
    steps:
      - name: Evaluate generative UI gates
        run: |
          isValid() { [ "$1" = "success" ] || [ "$1" = "skipped" ]; }
          FAILED=0
          for result in \
            "${{ needs.backend-contract.result }}" \
            "${{ needs.passthrough-wiring.result }}" \
            "${{ needs.frontend-wiring.result }}" \
            "${{ needs.frontend-build.result }}"; do
            if ! isValid "$result"; then
              FAILED=1
            fi
          done
          if [ "$FAILED" -eq 1 ]; then
            echo "❌ Generative UI streaming gate FAILED"
            exit 1
          fi
          echo "✅ Generative UI streaming gate passed (contract + wiring + build)"
