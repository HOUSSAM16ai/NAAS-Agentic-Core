name: ISS-052 — BAC Display + Semantic Retrieval + Streaming

on:
  push:
    branches:
      - "feat/bac2016-ex4-ultra-display-streaming"
      - "main"
    paths:
      - "app/services/capabilities/exercise_retrieval.py"
      - "app/infrastructure/clients/orchestrator_client.py"
      - "frontend/app/components/ChatInterface.jsx"
      - "frontend/app/globals.css"
      - "docs/ai_skills/bac-exercise-explanation.md"
      - "knowledge_base/**"
  pull_request:
    branches: ["main"]
    paths:
      - "app/services/capabilities/exercise_retrieval.py"
      - "app/infrastructure/clients/orchestrator_client.py"
      - "frontend/app/components/ChatInterface.jsx"
      - "frontend/app/globals.css"
      - "docs/ai_skills/bac-exercise-explanation.md"
      - "knowledge_base/**"

# D-105: يلغي التشغيلات البائتة عند دفع أحدث — يوفر دقائق runners
concurrency:
  group: iss-052-bac-display-streaming-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # ─── Job 1: Semantic Retrieval — 10 طرق استدعاء ──────────────────────────
  semantic-retrieval-gate:
    name: Semantic Retrieval (10 query patterns)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install pydantic
        run: pip install "pydantic>=2.0"

      - name: Test all 10 retrieval patterns
        run: |
          python - << 'PYEOF'
          import sys, types
          sys.path.insert(0, '.')

          # Only shim `app.core.schemas` — never replace `app` or `app.core`
          # with a ModuleType, otherwise `from app.services.*` fails with
          # "'app' is not a package" because Python resolves it via the stub
          # instead of the real package on disk.
          schemas_mod = types.ModuleType('app.core.schemas')
          from pydantic import BaseModel
          schemas_mod.RobustBaseModel = BaseModel
          sys.modules['app.core.schemas'] = schemas_mod

          from app.services.capabilities.exercise_retrieval import (
              detect_exercise_retrieval, ExerciseRetrievalRequest
          )

          MUST_RETRIEVE = [
              "تمرين 2016 الدورة الأولى الموضوع الثاني التمرين الرابع",
              "اعطني تمرين الدوال العددية",
              "أعطني تمرين الدوال العددية",
              "هات تمرين دوال عددية",
              "أريد الدوال العددية",
              "دوال عددية 2016",
              "بكالوريا 2016 دورة أولى",
              "التمرين الرابع الموضوع الثاني",
              "نص التمرين الرابع",
              "g(x) f(x)",
          ]

          MUST_NOT_RETRIEVE = [
              "اشرح لي الجزء الأول",
              "كيف أحل هذا التمرين",
              "ما هو تعريف المشتقة",
              "هذا التمرين صعب",
              "الجزء أ من التمرين",
          ]

          failed = []

          for q in MUST_RETRIEVE:
              d = detect_exercise_retrieval(ExerciseRetrievalRequest(question=q))
              if not d.recognized:
                  failed.append(f"MISSED: {q!r} (reason={d.reason})")
              else:
                  print(f"✅ RETRIEVED: {q[:55]}")

          for q in MUST_NOT_RETRIEVE:
              d = detect_exercise_retrieval(ExerciseRetrievalRequest(question=q))
              if d.recognized:
                  failed.append(f"FALSE_POSITIVE: {q!r}")
              else:
                  print(f"✅ BLOCKED:    {q[:55]}")

          if failed:
              print("\n❌ FAILURES:")
              for f in failed:
                  print(f"  {f}")
              sys.exit(1)

          print(f"\n✅ All {len(MUST_RETRIEVE)} retrieval patterns work")
          print(f"✅ All {len(MUST_NOT_RETRIEVE)} blocking patterns work")
          PYEOF

  # ─── Job 2: Knowledge Index Integrity ────────────────────────────────────
  knowledge-index-integrity:
    name: Knowledge Index Integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install pydantic
        run: pip install "pydantic>=2.0"

      - name: Verify index entries and file content
        run: |
          python - << 'PYEOF'
          import sys, types
          sys.path.insert(0, '.')

          # Only shim `app.core.schemas` — never replace `app` or `app.core`
          # with a ModuleType, otherwise `from app.services.*` fails with
          # "'app' is not a package" because Python resolves it via the stub
          # instead of the real package on disk.
          schemas_mod = types.ModuleType('app.core.schemas')
          from pydantic import BaseModel
          schemas_mod.RobustBaseModel = BaseModel
          sys.modules['app.core.schemas'] = schemas_mod

          from app.services.capabilities.knowledge_index import KNOWLEDGE_INDEX, search_exercises
          from app.services.capabilities.exercise_retrieval import (
              detect_exercise_retrieval, ExerciseRetrievalRequest,
              load_exercise_content, format_exercise_for_display
          )
          from pathlib import Path

          # 1. Index has at least 3 entries
          assert len(KNOWLEDGE_INDEX) >= 3, f"Expected >= 3, got {len(KNOWLEDGE_INDEX)}"
          print(f"✅ Index has {len(KNOWLEDGE_INDEX)} entries")

          # 2. 2016 S1 Ex4 entry exists
          results = search_exercises(year=2016, session="الأولى", exercise_number=4)
          assert results, "2016 S1 Ex4 not in index"
          entry = results[0]
          print(f"✅ 2016 S1 Ex4 found: {entry.file_path}")

          # 3. File exists on disk
          project_root = Path(".")
          file_path = project_root / entry.file_path
          assert file_path.exists(), f"File not found: {file_path}"
          print(f"✅ File exists on disk")

          # 4. Content loads and formats correctly
          raw = load_exercise_content(entry)
          assert raw and len(raw) > 5000, f"Content too short: {len(raw) if raw else 0} chars"
          formatted = format_exercise_for_display(entry, raw)
          assert formatted and len(formatted) > 1000, "Formatted content too short"
          print(f"✅ Content loads: {len(raw)} chars raw, {len(formatted)} chars formatted")

          # 5. Formatted content has no YAML frontmatter
          assert not formatted.startswith("---"), "YAML frontmatter not stripped"
          print("✅ YAML frontmatter stripped")

          # 6. Formatted content has no model answer
          assert "عناصر الإجابة" not in formatted, "Model answer leaked into display"
          assert "الإجابة النموذجية" not in formatted, "Model answer leaked into display"
          print("✅ Model answer correctly hidden")

          # 7. Formatted content has LaTeX
          assert "$$" in formatted or "\\(" in formatted, "No LaTeX in formatted content"
          print("✅ LaTeX present in formatted content")

          # 8. Historical note present in entry
          assert "دورتين" in entry.historical_note or "2016" in entry.historical_note
          print("✅ 2016 historical note present")

          print("\n✅ All knowledge index integrity checks passed")
          PYEOF

  # ─── Job 3: Streaming Logic Syntax Check ─────────────────────────────────
  streaming-syntax-check:
    name: Streaming Logic Syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Verify orchestrator_client.py parses cleanly
        run: |
          python -c "
          import ast, pathlib
          with open('app/infrastructure/clients/orchestrator_client.py') as f:
              src = f.read()
          ast.parse(src)
          print('✅ orchestrator_client.py syntax OK')

          # D-164/D-166: streaming helpers moved to orchestrator/ mixins
          # (TUTOR_SOURCE_FILES). Glob-based so future slices are covered.
          _base = pathlib.Path('app/infrastructure/clients')
          _tutor = [
              _base / 'orchestrator_client.py',
              pathlib.Path('app/services/skills/probability_tutor_brain.py'),
              *sorted((_base / 'orchestrator').glob('*.py')),
          ]
          tutor_src = '\n'.join(p.read_text() for p in _tutor)
          assert '_split_preserving_latex' in tutor_src, 'Missing _split_preserving_latex'
          assert 'ISS-STREAM-002' in tutor_src, 'Missing ISS-STREAM-002 marker'
          assert 'asyncio.sleep' in tutor_src, 'Missing asyncio.sleep in streaming'
          print('✅ Streaming improvements present')
          "

      - name: Verify exercise_retrieval.py parses cleanly
        run: |
          python -c "
          import ast
          with open('app/services/capabilities/exercise_retrieval.py') as f:
              src = f.read()
          ast.parse(src)
          print('✅ exercise_retrieval.py syntax OK')

          # Verify new patterns are present
          assert 'اعطني' in src, 'Missing اعطني pattern'
          assert 'هات' in src, 'Missing هات pattern'
          assert '_FETCH_VERBS' in src, 'Missing _FETCH_VERBS'
          assert '_MATH_TOPICS_DIRECT' in src, 'Missing _MATH_TOPICS_DIRECT'
          print('✅ Semantic retrieval patterns present')
          "

  # ─── Job 4: Frontend Component Check ─────────────────────────────────────
  frontend-component-check:
    name: Frontend Component Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Verify ChatInterface.jsx has required components
        run: |
          FILE="frontend/app/components/ChatInterface.jsx"

          grep -q "ExamBadge" "$FILE" || { echo "❌ Missing ExamBadge component"; exit 1; }
          grep -q "TypingIndicator" "$FILE" || { echo "❌ Missing TypingIndicator component"; exit 1; }
          grep -q "MessageBubble" "$FILE" || { echo "❌ Missing MessageBubble component"; exit 1; }
          grep -q "preprocessMath" "$FILE" || { echo "❌ Missing preprocessMath function"; exit 1; }
          grep -q "rehypeKatex" "$FILE" || { echo "❌ Missing rehypeKatex"; exit 1; }
          grep -q "remarkMath" "$FILE" || { echo "❌ Missing remarkMath"; exit 1; }
          grep -q "streaming-cursor" "$FILE" || { echo "❌ Missing streaming cursor"; exit 1; }
          grep -q "quick-prompt-btn" "$FILE" || { echo "❌ Missing quick prompts"; exit 1; }
          echo "✅ All required ChatInterface components present"

      - name: Verify globals.css has required styles
        run: |
          FILE="frontend/app/globals.css"

          grep -q "exam-badge" "$FILE" || { echo "❌ Missing exam-badge styles"; exit 1; }
          grep -q "exam-content" "$FILE" || { echo "❌ Missing exam-content styles"; exit 1; }
          grep -q "math-table" "$FILE" || { echo "❌ Missing math-table styles"; exit 1; }
          grep -q "typing-indicator" "$FILE" || { echo "❌ Missing typing-indicator styles"; exit 1; }
          grep -q "streaming-cursor" "$FILE" || { echo "❌ Missing streaming-cursor styles"; exit 1; }
          grep -q "katex" "$FILE" || { echo "❌ Missing katex styles"; exit 1; }
          grep -q "quick-prompt-btn" "$FILE" || { echo "❌ Missing quick-prompt-btn styles"; exit 1; }
          grep -q "scroll-to-bottom-btn" "$FILE" || { echo "❌ Missing scroll-to-bottom-btn styles"; exit 1; }
          echo "✅ All required CSS styles present"

  # ─── Job 5: Skill File Validation ────────────────────────────────────────
  skill-validation:
    name: Skill File Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Verify bac-exercise-explanation.md is complete
        run: |
          FILE="docs/ai_skills/bac-exercise-explanation.md"

          grep -q "ISS-052" "$FILE" || { echo "❌ Missing ISS-052 reference"; exit 1; }
          grep -q "2016" "$FILE" || { echo "❌ Missing 2016 rule"; exit 1; }
          grep -q "LaTeX" "$FILE" || { echo "❌ Missing LaTeX rules"; exit 1; }
          grep -q "اعطني" "$FILE" || { echo "❌ Missing اعطني pattern"; exit 1; }
          grep -q "knowledge_index" "$FILE" || { echo "❌ Missing knowledge_index reference"; exit 1; }
          grep -q "word-by-word\|streaming" "$FILE" || { echo "❌ Missing streaming reference"; exit 1; }

          SIZE=$(wc -c < "$FILE")
          if [ "$SIZE" -lt 3000 ]; then
            echo "❌ Skill file too small ($SIZE bytes)"
            exit 1
          fi
          echo "✅ Skill file complete ($SIZE bytes)"

      - name: Verify CLAUDE.md updated with ISS-052
        run: |
          grep -q "ISS-052" CLAUDE.md || {
            echo "❌ CLAUDE.md not updated with ISS-052"
            exit 1
          }
          echo "✅ CLAUDE.md updated"
