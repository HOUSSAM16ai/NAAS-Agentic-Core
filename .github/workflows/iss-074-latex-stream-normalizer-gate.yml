# ─────────────────────────────────────────────────────────────────────────────
# CI Gate — ISS-074 / D-062: LatexStreamNormalizer + Math Pipeline Quality
#
# يضمن أن:
#   1. LatexStreamNormalizer module موجود + import-able
#   2. كل orchestrator leaf nodes تستورد LatexStreamNormalizer
#   3. الـ stream tests الـ 10 الأساسية تنجح (chars-by-char, equation env, ...)
#   4. math_pipeline: _META_MARKERS و _SYSTEM_PROMPT_ECHO_MARKERS موجودة
#   5. _clean_foreign_scripts يعمل (Russian/Chinese/Japanese)
#   6. _strip_chat_meta_narration يعمل
#   7. conversation_graph: _normalize_latex_response محدَّث
#   8. MathSkill موجود في app/services/skills/
#
# يُشغَّل عند:
#   - تعديل latex_normalizer.py
#   - تعديل math_pipeline.py
#   - تعديل conversation_graph.py
#   - تعديل orchestrator leaf nodes (search.py, general_knowledge.py, main.py)
#   - تعديل math_skill.py
# ─────────────────────────────────────────────────────────────────────────────

name: "ISS-074 — LaTeX Stream Normalizer + Math Quality Gate"

on:
  push:
    branches:
      - "claude/fix-langgraph-math-responses-71F8e"
      - "main"
    paths:
      - "microservices/orchestrator_service/src/services/overmind/latex_normalizer.py"
      - "microservices/orchestrator_service/src/services/overmind/graph/search.py"
      - "microservices/orchestrator_service/src/services/overmind/graph/general_knowledge.py"
      - "microservices/orchestrator_service/src/services/overmind/graph/main.py"
      - "microservices/conversation_service/src/math_pipeline.py"
      - "microservices/conversation_service/src/conversation_graph.py"
      - "app/services/skills/math_skill.py"
      - "app/services/skills/__init__.py"
      - "tests/microservices/orchestrator_service/test_latex_normalizer.py"
      - ".github/workflows/iss-074-latex-stream-normalizer-gate.yml"
  pull_request:
    branches:
      - main
    paths:
      - "microservices/orchestrator_service/src/services/overmind/latex_normalizer.py"
      - "microservices/orchestrator_service/src/services/overmind/graph/**"
      - "microservices/conversation_service/src/math_pipeline.py"
      - "microservices/conversation_service/src/conversation_graph.py"
      - "app/services/skills/math_skill.py"

env:
  PYTHON_VERSION: "3.12"

jobs:
  # ─── Job 1: Static module + import check ────────────────────────────────────
  static-checks:
    name: "🔍 Static structure + imports"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify LatexStreamNormalizer module exists
        run: |
          test -f microservices/orchestrator_service/src/services/overmind/latex_normalizer.py \
            || (echo "❌ latex_normalizer.py missing" && exit 1)
          echo "✅ latex_normalizer.py exists"

      - name: Verify Math Skill module exists
        run: |
          test -f app/services/skills/math_skill.py \
            || (echo "❌ math_skill.py missing" && exit 1)
          test -f app/services/skills/__init__.py \
            || (echo "❌ skills/__init__.py missing" && exit 1)
          grep -q "MathSkill" app/services/skills/__init__.py \
            || (echo "❌ MathSkill not exported in __init__.py" && exit 1)
          echo "✅ MathSkill module wired into skills package"

      - name: Verify orchestrator leaf nodes import normalizer
        run: |
          for f in \
            microservices/orchestrator_service/src/services/overmind/graph/search.py \
            microservices/orchestrator_service/src/services/overmind/graph/general_knowledge.py \
            microservices/orchestrator_service/src/services/overmind/graph/main.py; do
            grep -q "LatexStreamNormalizer\|normalize_latex" "$f" \
              || (echo "❌ $f does not import LatexStreamNormalizer" && exit 1)
          done
          echo "✅ All 3 orchestrator leaf nodes import LatexStreamNormalizer"

      - name: Verify math_pipeline has D-062 markers
        run: |
          grep -q "_SYSTEM_PROMPT_ECHO_MARKERS" microservices/conversation_service/src/math_pipeline.py \
            || (echo "❌ _SYSTEM_PROMPT_ECHO_MARKERS missing" && exit 1)
          grep -q "_clean_foreign_scripts" microservices/conversation_service/src/math_pipeline.py \
            || (echo "❌ _clean_foreign_scripts missing" && exit 1)
          grep -q "_strip_meta_prefix" microservices/conversation_service/src/math_pipeline.py \
            || (echo "❌ _strip_meta_prefix missing" && exit 1)
          echo "✅ math_pipeline.py has all D-062 helpers"

      - name: Verify conversation_graph has D-062 markers
        run: |
          grep -q "_strip_chat_meta_narration" microservices/conversation_service/src/conversation_graph.py \
            || (echo "❌ _strip_chat_meta_narration missing" && exit 1)
          grep -q "_CYRILLIC_REPLACEMENTS" microservices/conversation_service/src/conversation_graph.py \
            || (echo "❌ _CYRILLIC_REPLACEMENTS missing" && exit 1)
          echo "✅ conversation_graph.py has all D-062 helpers"

  # ─── Job 2: Unit tests for normalizer ──────────────────────────────────────
  normalizer-unit-tests:
    name: "🧪 LatexStreamNormalizer unit tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install minimal deps
        run: |
          python -m pip install --quiet pydantic prometheus_client

      - name: Run inline normalizer tests
        run: |
          python <<'PY'
          import sys
          sys.path.insert(0, ".")
          from microservices.orchestrator_service.src.services.overmind.latex_normalizer import (
              LatexStreamNormalizer, normalize_latex,
          )

          # 1. simple bracket
          r = normalize_latex(r"\[x^2\]")
          assert "$$" in r and "\\[" not in r, f"FAIL T1: {r!r}"

          # 2. double-backslash bracket
          r = normalize_latex(r"\\[x^2\\]")
          assert "$$" in r, f"FAIL T2: {r!r}"

          # 3. equation environment
          r = normalize_latex(r"\begin{equation}y=0\end{equation}")
          assert "$$" in r and "\\begin{equation" not in r, f"FAIL T3: {r!r}"

          # 4. align environment
          r = normalize_latex(r"\begin{align}a=1\end{align}")
          assert "$$" in r, f"FAIL T4: {r!r}"

          # 5. inline preserved
          r = normalize_latex(r"\(f(x)\) معرفة")
          assert r"\(" in r and "$$" not in r, f"FAIL T5: {r!r}"

          # 6. char-by-char streaming
          n = LatexStreamNormalizer()
          out = []
          for c in r"احسب \[E=mc^2\] انتهى":
              out.extend(n.feed(c))
          out.extend(n.flush())
          rs = "".join(out)
          assert "$$" in rs and "E=mc^2" in rs, f"FAIL T6: {rs!r}"

          # 7. empty safety
          n2 = LatexStreamNormalizer()
          assert n2.feed("") == [], "FAIL T7 empty feed"
          assert n2.flush() == [], "FAIL T7 empty flush"

          # 8. plain text untouched
          n3 = LatexStreamNormalizer()
          for c in "نص عربي بدون رياضيات":
              n3.feed(c)
          out3 = n3.flush()
          assert "".join(out3) == "نص عربي بدون رياضيات", f"FAIL T8"

          print("🎉 ALL 8 NORMALIZER INVARIANTS PASS")
          PY

  # ─── Job 3: Math pipeline helpers ───────────────────────────────────────────
  pipeline-helpers:
    name: "🧪 Math pipeline helpers (foreign-script, meta-text)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install minimal deps
        run: |
          python -m pip install --quiet 'langgraph>=0.2.39' langchain-core httpx

      - name: Test helpers (no LLM call)
        run: |
          python <<'PY'
          import sys, types
          # stub prom_metrics
          prom = types.ModuleType("microservices.conversation_service.prom_metrics")
          prom.record_graph_invocation = lambda *a, **kw: None
          prom.record_graph_error = lambda *a, **kw: None
          sys.modules["microservices.conversation_service.prom_metrics"] = prom
          sys.path.insert(0, ".")

          from microservices.conversation_service.src.math_pipeline import (
              _classify_math_type, _normalize_latex, _strip_meta_prefix,
              _clean_foreign_scripts, _META_MARKERS, _SYSTEM_PROMPT_ECHO_MARKERS,
          )
          from microservices.conversation_service.src.conversation_graph import (
              _classify_intent, _detect_subject, _normalize_latex_response,
              _strip_chat_meta_narration,
          )

          # 1. classifier ordering: function_study before derivative
          assert _classify_math_type("ادرس الدالة") == "function_study", "FAIL classifier"
          assert _classify_math_type("احسب مشتق") == "derivative"

          # 2. foreign scripts
          assert "линейный" not in _clean_foreign_scripts("hello линейный")
          assert "向心" not in _clean_foreign_scripts("test 向心 force")

          # 3. chat meta-narration
          assert _strip_chat_meta_narration("Okay, the user said hi. مرحبا") == "مرحبا"

          # 4. latex normalize
          r = _normalize_latex(r"\[x^2\]")
          assert "$$" in r and "\\[" not in r

          # 5. echo markers + meta markers populated
          assert len(_META_MARKERS) >= 10, f"only {len(_META_MARKERS)} meta markers"
          assert len(_SYSTEM_PROMPT_ECHO_MARKERS) >= 15, f"only {len(_SYSTEM_PROMPT_ECHO_MARKERS)} echo markers"

          print(f"🎉 helpers OK | {len(_META_MARKERS)} meta + {len(_SYSTEM_PROMPT_ECHO_MARKERS)} echo markers")
          PY

  # ─── Job 4: PR summary ──────────────────────────────────────────────────────
  pr-summary:
    name: "📋 D-062 quality summary"
    runs-on: ubuntu-latest
    needs: [static-checks, normalizer-unit-tests, pipeline-helpers]
    if: always()
    steps:
      - name: Write summary
        run: |
          {
            echo "# 🧮 ISS-074 / D-062 — LaTeX Stream Normalizer + Math Quality"
            echo ""
            echo "| Gate | Status |"
            echo "|---|---|"
            echo "| static-checks (modules + imports) | ${{ needs.static-checks.result }} |"
            echo "| normalizer unit tests | ${{ needs.normalizer-unit-tests.result }} |"
            echo "| pipeline helpers (foreign-script, meta) | ${{ needs.pipeline-helpers.result }} |"
            echo ""
            echo "## ما يضمنه هذا الـ gate"
            echo ""
            echo "- `LatexStreamNormalizer` module مُهيَّأ + 8 invariants تختبر streaming + batch"
            echo "- كل orchestrator leaf nodes (SynthesizerNode, GeneralKnowledgeNode, ChatFallbackNode) تستخدم النظام الجديد"
            echo "- math_pipeline: _META_MARKERS + _SYSTEM_PROMPT_ECHO_MARKERS + _clean_foreign_scripts + _strip_meta_prefix"
            echo "- conversation_graph: _strip_chat_meta_narration + _CYRILLIC_REPLACEMENTS"
            echo "- MathSkill exposed in app/services/skills/"
          } >> $GITHUB_STEP_SUMMARY
