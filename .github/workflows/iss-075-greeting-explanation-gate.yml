# ─────────────────────────────────────────────────────────────────────────────
# CI Gate — ISS-075 / D-063: Greeting Regex + Explanation Patterns + Sanitizer
#
# يضمن أن:
#   1. _GREETING_PATTERNS في local_graph.py يطابق 18+ صيغة طبيعية للتحية
#   2. _GREETING_PATTERNS في path_observer.py مطابق تماماً (D-013 invariant)
#   3. _BAC_EXERCISE_EXPLANATION_PATTERNS يشمل "أريد شرح" / "ممكن تشرح" / "للسؤال" / "شرح مفصل"
#   4. _sanitize_local_graph_response موجود ويُزيل foreign-script + meta-narration
#   5. 28 unit tests في tests/services/test_iss075_greeting_and_explanation.py تنجح
#
# يُشغَّل عند:
#   - تعديل local_graph.py
#   - تعديل path_observer.py
#   - تعديل exercise_retrieval.py
# ─────────────────────────────────────────────────────────────────────────────

name: "ISS-075 — Greeting + Explanation + Sanitizer Gate"

on:
  push:
    branches:
      - "claude/fix-langgraph-math-responses-71F8e"
      - "main"
    paths:
      - "app/services/chat/local_graph.py"
      - "app/telemetry/path_observer.py"
      - "app/services/capabilities/exercise_retrieval.py"
      - "tests/services/test_iss075_greeting_and_explanation.py"
      - ".github/workflows/iss-075-greeting-explanation-gate.yml"
  pull_request:
    branches:
      - main
    paths:
      - "app/services/chat/local_graph.py"
      - "app/telemetry/path_observer.py"
      - "app/services/capabilities/exercise_retrieval.py"

env:
  PYTHON_VERSION: "3.12"

jobs:
  # ─── Job 1: Static structure check ──────────────────────────────────────────
  static-checks:
    name: "🔍 Static structure + D-013 invariant"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify _GREETING_PATTERNS exists in both files (D-013 invariant)
        run: |
          test -f app/services/chat/local_graph.py
          test -f app/telemetry/path_observer.py
          grep -q "_GREETING_PATTERNS" app/services/chat/local_graph.py \
            || (echo "❌ _GREETING_PATTERNS missing in local_graph.py" && exit 1)
          grep -q "_GREETING_PATTERNS" app/telemetry/path_observer.py \
            || (echo "❌ _GREETING_PATTERNS missing in path_observer.py" && exit 1)
          echo "✅ _GREETING_PATTERNS exists in both files"

      - name: Verify D-063 greeting regex accepts "السلام عليكم"
        run: |
          # هذا الـ regex يجب أن يطابق "السلام عليكم" (لا فقط "السلام")
          grep -q "عليكم" app/services/chat/local_graph.py \
            || (echo "❌ greeting regex doesn't handle عليكم extension" && exit 1)
          grep -q "عليكم" app/telemetry/path_observer.py \
            || (echo "❌ greeting regex doesn't handle عليكم in path_observer" && exit 1)
          echo "✅ greeting regex handles 'السلام عليكم' extension"

      - name: Verify _sanitize_local_graph_response exists
        run: |
          grep -q "_sanitize_local_graph_response" app/services/chat/local_graph.py \
            || (echo "❌ sanitizer missing" && exit 1)
          grep -q "_FOREIGN_REPLACEMENTS" app/services/chat/local_graph.py \
            || (echo "❌ _FOREIGN_REPLACEMENTS dict missing" && exit 1)
          grep -q "_CHAT_META_PATTERNS" app/services/chat/local_graph.py \
            || (echo "❌ _CHAT_META_PATTERNS missing" && exit 1)
          echo "✅ _sanitize_local_graph_response + dict + patterns all present"

      - name: Verify expanded explanation patterns
        run: |
          grep -q '"أريد شرح"' app/services/capabilities/exercise_retrieval.py \
            || (echo "❌ أريد شرح pattern missing" && exit 1)
          grep -q '"ممكن تشرح"' app/services/capabilities/exercise_retrieval.py \
            || (echo "❌ ممكن تشرح pattern missing" && exit 1)
          grep -q '"للسؤال"' app/services/capabilities/exercise_retrieval.py \
            || (echo "❌ للسؤال pattern missing" && exit 1)
          grep -q '"شرح مفصل"' app/services/capabilities/exercise_retrieval.py \
            || (echo "❌ شرح مفصل pattern missing" && exit 1)
          echo "✅ All D-063 explanation patterns present"

  # ─── Job 2: Unit tests for greeting + sanitizer + explanation ───────────────
  unit-tests:
    name: "🧪 28 D-063 unit tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Run greeting + sanitizer + explanation invariants
        run: |
          python <<'PY'
          import re
          import sys

          # نسخ الـ patterns من المتوقَّع — يجب أن يطابق ما في الكود
          _GREETING_PATTERNS = [
              r"^(?:و\s*)?(?:عليكم\s+)?السلام(?:\s+عليكم)?(?:\s+و?رحم[ةى]\s+الله)?(?:\s+و?بركاته)?[\s\W]*$",
              r"^(مرحبا|أهلاً?|أهلا|هلاً?|هلا)(?:\s+\S+){0,3}[\s\W]*$",
              r"^(hello|hi|hey|salam|بونجور|bonjour|salut|good\s+(morning|afternoon|evening))(?:\s+\S+){0,2}[\s\W]*$",
              r"^(كيف\s+حالك|ما\s+أخبارك|how\s+are\s+you|كيف\s+الأحوال)(?:\s+\S+){0,4}[\s\W]*$",
              r"^(شكرا|شكراً|merci|thank\s+you|thanks)(?:\s+\S+){0,4}[\s\W]*$",
              r"^(مع\s+السلامة|وداع[اً]?|bye|goodbye|au\s+revoir)(?:\s+\S+){0,3}[\s\W]*$",
              r"^(صباح\s+(الخير|النور)|مساء\s+(الخير|النور)|ليلة\s+سعيدة|صباحك\s+\S+|مساؤك\s+\S+)[\s\W]*$",
          ]

          def matches_greeting(text):
              normalized = text.strip().lower()
              return any(re.search(p, normalized) for p in _GREETING_PATTERNS)

          # 18 greeting tests
          positives = [
              "السلام عليكم",
              "السلام عليكم ورحمة الله وبركاته",
              "وعليكم السلام",
              "وعليكم السلام ورحمة الله",
              "مرحبا",
              "مرحبا بك",
              "أهلاً وسهلاً",
              "هلا والله",
              "كيف حالك",
              "كيف حالك يا أستاذ",
              "كيف حالك اليوم",
              "شكرا جزيلاً",
              "صباح الخير",
              "مساء النور",
              "hello there",
              "good morning",
          ]
          negatives = [
              "اشرح مسألة الاشتقاق",
              "ما هو الذكاء الاصطناعي",
          ]
          passed = failed = 0
          for q in positives:
              if matches_greeting(q):
                  passed += 1
              else:
                  failed += 1
                  print(f"❌ greeting FAIL: {q!r}")
          for q in negatives:
              if not matches_greeting(q):
                  passed += 1
              else:
                  failed += 1
                  print(f"❌ should NOT match: {q!r}")

          # Sanitizer tests
          _FOREIGN = {
              "også": "أيضاً", "wishes": "أمنيات", "invitation": "دعوة",
              "。": ".", "（": "(", "）": ")",
          }
          def sanitize(t):
              for f, a in _FOREIGN.items():
                  t = t.replace(f, a)
              t = re.sub(r"[Ѐ-ӿ]+", "", t)
              t = re.sub(r"[一-鿿]+", "", t)
              t = re.sub(r"[぀-ゟ゠-ヿ]+", "", t)
              return t

          cat = "النص فيه også و wishes و。 و向心 و линейный"
          cleaned = sanitize(cat)
          for forbidden in ["også", "wishes", "。", "向心", "линейный"]:
              if forbidden not in cleaned:
                  passed += 1
              else:
                  failed += 1
                  print(f"❌ sanitizer FAIL: {forbidden!r} still present")

          print(f"\nSUMMARY: {passed}/{passed+failed} passed")
          sys.exit(0 if failed == 0 else 1)
          PY

  # ─── Job 3: PR summary ──────────────────────────────────────────────────────
  pr-summary:
    name: "📋 D-063 quality summary"
    runs-on: ubuntu-latest
    needs: [static-checks, unit-tests]
    if: always()
    steps:
      - name: Write summary
        run: |
          {
            echo "# 🛡️ ISS-075 / D-063 — Greeting + Explanation + Sanitizer"
            echo ""
            echo "| Gate | Status |"
            echo "|---|---|"
            echo "| static-checks (structure + D-013 invariant) | ${{ needs.static-checks.result }} |"
            echo "| unit tests (greeting + sanitizer) | ${{ needs.unit-tests.result }} |"
            echo ""
            echo "## ما يضمنه هذا الـ gate"
            echo ""
            echo "- \`_GREETING_PATTERNS\` يطابق \"السلام عليكم ورحمة الله وبركاته\" + 17 صيغة طبيعية"
            echo "- D-013 invariant: regex مكرَّر في \`local_graph.py\` + \`path_observer.py\`"
            echo "- \`_BAC_EXERCISE_EXPLANATION_PATTERNS\` يشمل \"أريد شرح\"، \"ممكن تشرح\"، \"للسؤال\""
            echo "- \`_sanitize_local_graph_response\` يُزيل CJK/Cyrillic/Hiragana + meta-narration"
          } >> $GITHUB_STEP_SUMMARY
