# ─────────────────────────────────────────────────────────────────────────────
# CI Gate — ISS-076 / D-064: Response Sanitizer + Greeting Fast-Path
#
# يضمن أن:
#   1. response_sanitizer.py module موجود + importable
#   2. ChatFallbackNode + GeneralKnowledgeNode + SynthesizerNode تستخدم sanitize_response
#   3. ChatFallbackNode يستخدم get_greeting_fastpath_response قبل LLM
#   4. 25 unit tests تنجح
#   5. تنظيف الكلمات الكارثية الفعلية (Mexico City Amigos, будет на вас, sentido de, Eugène)
# ─────────────────────────────────────────────────────────────────────────────

name: "ISS-076 — Response Sanitizer + Greeting FastPath Gate"

on:
  push:
    branches:
      - "claude/fix-langgraph-math-responses-71F8e"
      - "main"
    paths:
      - "microservices/orchestrator_service/src/services/overmind/response_sanitizer.py"
      - "microservices/orchestrator_service/src/services/overmind/graph/main.py"
      - "microservices/orchestrator_service/src/services/overmind/graph/general_knowledge.py"
      - "microservices/orchestrator_service/src/services/overmind/graph/search.py"
      - "tests/microservices/orchestrator_service/test_response_sanitizer.py"
      - ".github/workflows/iss-076-response-sanitizer-gate.yml"
  pull_request:
    branches:
      - main
    paths:
      - "microservices/orchestrator_service/src/services/overmind/response_sanitizer.py"
      - "microservices/orchestrator_service/src/services/overmind/graph/**"

# D-105: يلغي التشغيلات البائتة عند دفع أحدث — يوفر دقائق runners
concurrency:
  group: iss-076-response-sanitizer-gate-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  PYTHON_VERSION: "3.12"

jobs:
  # ─── Job 1: Static structure ────────────────────────────────────────────────
  static-checks:
    name: "🔍 Static structure + integration"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Verify response_sanitizer module exists
        run: |
          test -f microservices/orchestrator_service/src/services/overmind/response_sanitizer.py \
            || (echo "❌ response_sanitizer.py missing" && exit 1)
          grep -q "def sanitize_response" microservices/orchestrator_service/src/services/overmind/response_sanitizer.py
          grep -q "def get_greeting_fastpath_response" microservices/orchestrator_service/src/services/overmind/response_sanitizer.py
          echo "✅ response_sanitizer.py with required functions exists"

      - name: Verify ChatFallbackNode uses sanitizer + fastpath
        run: |
          F=microservices/orchestrator_service/src/services/overmind/graph/main.py
          grep -q "sanitize_response" "$F" \
            || (echo "❌ ChatFallbackNode doesn't use sanitize_response" && exit 1)
          grep -q "get_greeting_fastpath_response" "$F" \
            || (echo "❌ ChatFallbackNode doesn't use greeting fastpath" && exit 1)
          echo "✅ ChatFallbackNode wired with D-064"

      - name: Verify GeneralKnowledgeNode uses sanitizer
        run: |
          F=microservices/orchestrator_service/src/services/overmind/graph/general_knowledge.py
          grep -q "sanitize_response" "$F" \
            || (echo "❌ GeneralKnowledgeNode doesn't use sanitize_response" && exit 1)
          echo "✅ GeneralKnowledgeNode wired with D-064"

      - name: Verify SynthesizerNode uses sanitizer
        run: |
          F=microservices/orchestrator_service/src/services/overmind/graph/search.py
          grep -q "sanitize_response" "$F" \
            || (echo "❌ SynthesizerNode doesn't use sanitize_response" && exit 1)
          echo "✅ SynthesizerNode wired with D-064"

  # ─── Job 2: Unit tests ──────────────────────────────────────────────────────
  unit-tests:
    name: "🧪 25 D-064 unit tests + catastrophe scenarios"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Run sanitizer + fastpath tests
        run: |
          python <<'PY'
          import sys
          sys.path.insert(0, ".")
          from microservices.orchestrator_service.src.services.overmind.response_sanitizer import (
              sanitize_response, get_greeting_fastpath_response,
          )

          # 1. الكارثة الفعلية من شكوى المستخدم — Russian "будет на вас"
          cat1 = "السلام будет на вас всех"
          c1 = sanitize_response(cat1, intent="chat")
          assert "будет" not in c1, f"FAIL T1: {c1!r}"

          # 2. Mexico City Amigos catastrophe
          cat2 = "تستخدم كتحية Mexico City Amigos."
          c2 = sanitize_response(cat2, intent="chat")
          assert "Mexico City" not in c2 and "Amigos" not in c2, f"FAIL T2: {c2!r}"

          # 3. Spanish "sentido de"
          cat3 = "في sentido de المعنى"
          c3 = sanitize_response(cat3, intent="chat")
          assert "sentido de" not in c3, f"FAIL T3: {c3!r}"

          # 4. Greeting fast-path
          r = get_greeting_fastpath_response("السلام عليكم")
          assert r is not None and "وعليكم السلام" in r, f"FAIL T4: {r!r}"

          # 5. Full Islamic greeting prefix match
          r5 = get_greeting_fastpath_response("السلام عليكم ورحمة الله وبركاته")
          assert r5 is not None, f"FAIL T5"

          # 6. Educational question NOT fastpath
          assert get_greeting_fastpath_response("اشرح مسألة الاشتقاق") is None

          # 7. Chat meta-narration stripped
          c7 = sanitize_response("Okay, the user said hi. مرحبا", intent="chat")
          assert "Okay, the user" not in c7 and "مرحبا" in c7

          # 8. Educational keeps meta
          c8 = sanitize_response("Let me explain this. الشرح", intent="educational")
          assert "Let me explain" in c8

          # 9. CJK punct removal
          c9 = sanitize_response("نص。 و（مثال）", intent="chat")
          assert "。" not in c9 and "（" not in c9

          # 10. Plain Arabic unchanged
          c10 = sanitize_response("نص عربي نظيف.", intent="chat")
          assert c10 == "نص عربي نظيف."

          print("🎉 ALL 10 D-064 INVARIANTS PASS")
          PY

  # ─── Job 3: PR summary ──────────────────────────────────────────────────────
  pr-summary:
    name: "📋 D-064 quality summary"
    runs-on: ubuntu-latest
    needs: [static-checks, unit-tests]
    if: always()
    steps:
      - name: Write summary
        run: |
          {
            echo "# 🧹 ISS-076 / D-064 — Response Sanitizer + Greeting FastPath"
            echo ""
            echo "| Gate | Status |"
            echo "|---|---|"
            echo "| static-checks (modules + integration) | ${{ needs.static-checks.result }} |"
            echo "| unit tests (10 catastrophe scenarios) | ${{ needs.unit-tests.result }} |"
            echo ""
            echo "## ما يضمنه هذا الـ gate"
            echo ""
            echo "- \`response_sanitizer.py\` module مع \`sanitize_response\` + \`get_greeting_fastpath_response\`"
            echo "- ChatFallbackNode + GeneralKnowledgeNode + SynthesizerNode تستخدم D-064"
            echo "- تنظيف الكلمات الكارثية: Mexico City Amigos, будет на вас, sentido de, Eugène"
            echo "- Greeting fast-path للتحيات الـ 20+ شائعة (0ms response بدون LLM)"
            echo "- Chat meta-narration stripping للـ chat intent فقط (educational يحتفظ)"
          } >> $GITHUB_STEP_SUMMARY
