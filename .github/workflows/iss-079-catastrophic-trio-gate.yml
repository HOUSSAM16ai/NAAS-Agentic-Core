# ─────────────────────────────────────────────────────────────────────────────
# CI Gate — ISS-079 / D-067: Catastrophic Trio Fix
#
# يضمن أن الإصلاحات الجراحية الثلاث لا تتراجع:
#   1. GreetingSkill رسمي موجود + بـ Pydantic contract
#   2. local_graph.py يحوي _greeting_fastpath_response
#   3. PRIMARY model = openai/gpt-oss-20b:free (ليس nemotron-nano)
#   4. _EXERCISE_EXPLANATION_SYSTEM_PROMPT بدون box-drawing chars
#   5. gateway لا يُمرِّر reasoning كـ content
#   6. كل الـ 27 اختبار يمر
# ─────────────────────────────────────────────────────────────────────────────

name: "ISS-079 — Catastrophic Trio Fix Gate"

on:
  push:
    branches:
      - "claude/fix-critical-project-failure-ixc1t"
      - "main"
    paths:
      - "app/services/skills/greeting_skill.py"
      - "app/services/skills/__init__.py"
      - "app/services/chat/local_graph.py"
      - "app/infrastructure/clients/orchestrator_client.py"
      - "app/core/gateway/simple_client.py"
      - "app/core/ai_config.py"
      - "microservices/orchestrator_service/src/core/ai_config.py"
      - "microservices/conversation_service/src/math_pipeline.py"
      - "microservices/conversation_service/src/conversation_graph.py"
      - "tests/services/test_iss079_catastrophic_fixes.py"
      - ".github/workflows/iss-079-catastrophic-trio-gate.yml"
  pull_request:
    branches:
      - main
    paths:
      - "app/services/skills/greeting_skill.py"
      - "app/services/chat/local_graph.py"
      - "app/core/gateway/simple_client.py"
      - "app/core/ai_config.py"
      - "microservices/orchestrator_service/src/core/ai_config.py"

# D-105: يلغي التشغيلات البائتة عند دفع أحدث — يوفر دقائق runners
concurrency:
  group: iss-079-catastrophic-trio-gate-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  PYTHON_VERSION: "3.12"

jobs:
  # ─── Job 1: GreetingSkill structure + contract ─────────────────────────────
  greeting-skill-structure:
    name: "🧬 GreetingSkill structure"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: "Verify GreetingSkill file exists"
        run: |
          test -f app/services/skills/greeting_skill.py
          echo "✅ GreetingSkill file exists"

      - name: "Verify required symbols"
        shell: bash
        run: |
          set -euo pipefail
          for sym in "class GreetingSkill" "class GreetingSkillInput" "class GreetingSkillOutput" "class GreetingSkillFailure"; do
            if ! grep -q "$sym" app/services/skills/greeting_skill.py; then
              echo "❌ Missing required symbol: $sym"
              exit 1
            fi
            echo "✅ Found: $sym"
          done

      - name: "Verify Prometheus metrics"
        run: |
          grep -q "skill.greeting.invocations.total" app/services/skills/greeting_skill.py || {
            echo "❌ Missing Prometheus metric: skill.greeting.invocations.total"
            exit 1
          }
          echo "✅ Prometheus metrics present"

      - name: "Verify educational blockers"
        run: |
          grep -q "_EDUCATIONAL_BLOCKERS" app/services/skills/greeting_skill.py || {
            echo "❌ Missing _EDUCATIONAL_BLOCKERS (D-065 invariant)"
            exit 1
          }
          echo "✅ Blockers present"

      - name: "Verify exports in __init__"
        run: |
          grep -q "GreetingSkill" app/services/skills/__init__.py || {
            echo "❌ GreetingSkill not exported from app/services/skills/__init__.py"
            exit 1
          }
          echo "✅ GreetingSkill exported"

  # ─── Job 2: Primary Model Verification ─────────────────────────────────────
  primary-model-correctness:
    # D-088 (2026-05-27): PRIMARY تغيَّر من gpt-oss-20b إلى gpt-oss-120b
    # بسبب rate-limiting دائم لـ gpt-oss-20b على OpenRouter (ISS-082).
    # gpt-oss-20b يبقى في fallback chain.
    name: "🎯 PRIMARY model = gpt-oss-120b (not nemotron-nano, D-088)"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: "app/core/ai_config.py PRIMARY"
        run: |
          if ! grep -q 'PRIMARY = _resolve_primary_model("openai/gpt-oss-120b:free")' app/core/ai_config.py; then
            echo "❌ app/core/ai_config.py PRIMARY must be openai/gpt-oss-120b:free (D-088)"
            grep "PRIMARY = _resolve_primary_model" app/core/ai_config.py
            exit 1
          fi
          echo "✅ app/core/ai_config.py PRIMARY correct (gpt-oss-120b)"

      - name: "orchestrator-service PRIMARY"
        run: |
          if ! grep -q 'PRIMARY = _resolve_primary_model(AvailableModels.GPT_OSS_120B_FREE)' microservices/orchestrator_service/src/core/ai_config.py; then
            echo "❌ orchestrator PRIMARY must reference GPT_OSS_120B_FREE (D-088)"
            grep "PRIMARY = _resolve_primary_model" microservices/orchestrator_service/src/core/ai_config.py
            exit 1
          fi
          echo "✅ orchestrator PRIMARY correct (GPT_OSS_120B_FREE)"

      - name: "math_pipeline default"
        run: |
          if ! grep -q '_DEFAULT_MODEL = "openai/gpt-oss-120b:free"' microservices/conversation_service/src/math_pipeline.py; then
            echo "❌ math_pipeline default model must be gpt-oss-120b:free (D-088)"
            grep "_DEFAULT_MODEL" microservices/conversation_service/src/math_pipeline.py | head -3
            exit 1
          fi
          echo "✅ math_pipeline default correct (gpt-oss-120b)"

      - name: "conversation_graph default"
        run: |
          if ! grep -q '_DEFAULT_MODEL = "openai/gpt-oss-120b:free"' microservices/conversation_service/src/conversation_graph.py; then
            echo "❌ conversation_graph default model must be gpt-oss-120b:free (D-088)"
            grep "_DEFAULT_MODEL" microservices/conversation_service/src/conversation_graph.py | head -3
            exit 1
          fi
          echo "✅ conversation_graph default correct (gpt-oss-120b)"

  # ─── Job 3: Prompt sanity (no box-drawing chars) ───────────────────────────
  prompt-sanity:
    name: "🧹 Prompt has no box-drawing chars"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: "Check _EXERCISE_EXPLANATION_SYSTEM_PROMPT cleanliness"
        run: |
          python3 - <<'PY'
          import re

          # D-071: الـ prompt يُبنى من doctrine.py — نتحقق من function body فقط
          # (الـ comments في doctrine.py تحتوي على ─ decorators — مسموح بها).
          doctrine = open("app/services/skills/doctrine.py", encoding="utf-8").read()

          # تحقق 1: build_exercise_explanation_prompt موجودة
          if "def build_exercise_explanation_prompt" not in doctrine:
              print("❌ build_exercise_explanation_prompt missing from doctrine.py")
              raise SystemExit(1)
          print("✅ build_exercise_explanation_prompt present in doctrine.py")

          # تحقق 2: استخراج function body والتحقق من غياب box-drawing chars فيه
          m = re.search(
              r"def build_exercise_explanation_prompt\(\).*?(?=\ndef |\Z)",
              doctrine, re.DOTALL
          )
          if m:
              func_body = m.group(0)
              box_chars = [c for c in func_body if 0x2500 <= ord(c) <= 0x257F]
              if len(box_chars) > 2:
                  print(f"❌ build_exercise_explanation_prompt has {len(box_chars)} box-drawing chars")
                  raise SystemExit(1)
              print(f"✅ Box-drawing chars in prompt function: {len(box_chars)} (max 2 allowed)")
          else:
              print("⚠️  Could not extract function body — skipping box-drawing check")

          # تحقق 3: local_graph.py يُعيِّن من doctrine (D-071)
          lg = open("app/services/chat/local_graph.py", encoding="utf-8").read()
          if "EXERCISE_EXPLANATION_SYSTEM_PROMPT" not in lg:
              print("❌ local_graph.py missing EXERCISE_EXPLANATION_SYSTEM_PROMPT reference")
              raise SystemExit(1)
          print("✅ local_graph.py references EXERCISE_EXPLANATION_SYSTEM_PROMPT (D-071)")

          # تحقق 4: لا box-drawing chars في الـ prompt assignment في local_graph.py
          # (السطر الذي يُعيِّن _EXERCISE_EXPLANATION_SYSTEM_PROMPT)
          for line in lg.splitlines():
              if "_EXERCISE_EXPLANATION_SYSTEM_PROMPT" in line and "=" in line:
                  box_in_line = [c for c in line if 0x2500 <= ord(c) <= 0x257F]
                  if box_in_line:
                      print(f"❌ Assignment line has box-drawing chars: {repr(line)}")
                      raise SystemExit(1)
          print("✅ No box-drawing chars in local_graph prompt assignment")

          # تحقق 5: الـ anchors الإلزامية موجودة في doctrine.py
          for anchor in ["الإجابة النموذجية", "LaTeX", "حرفياً"]:
              if anchor not in doctrine:
                  print(f"❌ doctrine.py missing anchor: {anchor}")
                  raise SystemExit(1)
          print("✅ All 3 D-067 anchors present in doctrine.py")
          PY

  # ─── Job 4: Reasoning leak guard ───────────────────────────────────────────
  reasoning-leak-guard:
    name: "🛡️ No reasoning→content leak in gateway"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: "Forbid reasoning→content redirect"
        shell: bash
        run: |
          set -euo pipefail
          # These patterns must NOT exist in simple_client.py — they cause English
          # thinking text to leak to Arabic responses.
          FORBIDDEN_PATTERNS=(
            'delta\["content"\] = delta\["reasoning"\]'
            "delta\['content'\] = delta\['reasoning'\]"
            'delta\.get\("content"\) or delta\.get\("reasoning"'
          )
          FOUND=0
          for pat in "${FORBIDDEN_PATTERNS[@]}"; do
            if grep -E "$pat" app/core/gateway/simple_client.py; then
              echo "❌ FORBIDDEN PATTERN FOUND: $pat"
              FOUND=1
            fi
          done
          if [ "$FOUND" -eq 1 ]; then
            echo "❌ Gateway must NOT redirect reasoning to content (D-067 invariant)"
            exit 1
          fi
          echo "✅ No reasoning→content leak"

  # ─── Job 5: Unit tests ─────────────────────────────────────────────────────
  unit-tests:
    name: "🧪 27 ISS-079 unit tests"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: "Install dependencies"
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio pydantic langgraph anyio

      - name: "Run ISS-079 tests"
        run: |
          python -m pytest tests/services/test_iss079_catastrophic_fixes.py -v --no-header 2>&1 | tail -40

      - name: "Run regression tests (ISS-075, ISS-076)"
        run: |
          # Verify D-067 changes don't break D-063 / D-064
          python -m pytest \
            tests/services/test_iss075_greeting_and_explanation.py \
            -v --no-header 2>&1 | tail -10

  # ─── Job 6: Summary ────────────────────────────────────────────────────────
  summary:
    name: "📋 ISS-079 Summary"
    runs-on: ubuntu-latest
    needs:
      - greeting-skill-structure
      - primary-model-correctness
      - prompt-sanity
      - reasoning-leak-guard
      - unit-tests
    if: always()
    steps:
      - name: "Final status"
        run: |
          echo "## ISS-079 Catastrophic Trio Fix — CI Summary"
          echo ""
          echo "Gates run:"
          echo "  - GreetingSkill structure: ${{ needs.greeting-skill-structure.result }}"
          echo "  - PRIMARY model: ${{ needs.primary-model-correctness.result }}"
          echo "  - Prompt sanity: ${{ needs.prompt-sanity.result }}"
          echo "  - Reasoning leak: ${{ needs.reasoning-leak-guard.result }}"
          echo "  - Unit tests: ${{ needs.unit-tests.result }}"
          if [ "${{ needs.greeting-skill-structure.result }}" != "success" ] || \
             [ "${{ needs.primary-model-correctness.result }}" != "success" ] || \
             [ "${{ needs.prompt-sanity.result }}" != "success" ] || \
             [ "${{ needs.reasoning-leak-guard.result }}" != "success" ] || \
             [ "${{ needs.unit-tests.result }}" != "success" ]; then
            echo "❌ ISS-079 gate FAILED — catastrophic fix is broken"
            exit 1
          fi
          echo "✅ ISS-079 gate PASSED"
