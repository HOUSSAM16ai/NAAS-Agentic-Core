# ─────────────────────────────────────────────────────────────────────────────
# CI Gate — D-045: End-to-End User Routing via Microservices
#
# يتحقق من أن الخدمات المصغرة متصلة فعلياً بمسار المستخدم:
#   1. routing-contract   — عقد التوجيه: ChatRoutingPolicy + OrchestratorClient
#   2. supervisor-config  — supervisor.sh يضبط المتغيرات الصحيحة
#   3. ws-protocol        — WebSocket يدعم jwt subprotocol
#   4. chat-endpoint      — orchestrator /api/chat/messages يقبل question+auth
#   5. pipeline-mode      — /compose يعيد pipeline_mode field
#   6. service-deps       — كل خدمة تملك requirements.txt مع prometheus-client
#   7. integration-gate   — تكامل شامل: routing + auth + streaming
# ─────────────────────────────────────────────────────────────────────────────

name: "D-045 — End-to-End User Routing"

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: d045-routing-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  PYTHON_VERSION: "3.12"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  # CI-safe env — no real DB, no real LLM
  DATABASE_URL: "sqlite+aiosqlite:///:memory:"
  SECRET_KEY: "test-secret-key-for-ci-pipeline-secure-length"
  ENVIRONMENT: testing
  LLM_MOCK_MODE: "1"
  SUPABASE_URL: https://dummy.supabase.co
  SUPABASE_SERVICE_ROLE_KEY: dummy-key-for-ci
  RECOVERY_ADMIN_PASSWORD: dummy-pass-for-ci

jobs:
  # ── Job 1: Chat Routing Policy Contract ───────────────────────────────────
  routing-contract:
    name: routing-contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install minimal deps
        run: pip install -q pydantic pydantic-settings
      - name: Verify ChatRoutingPolicy defaults to state_graph
        shell: bash
        run: |
          set -euo pipefail
          python3 -c "
          import sys, pathlib

          src = pathlib.Path('app/infrastructure/clients/routing_policy.py').read_text()

          checks = {
              'state_graph default': '_DEFAULT_ENDPOINT_MODE = \"state_graph\"',
              '/api/chat/messages mapping': '/api/chat/messages',
              '/agent/chat fallback': '/agent/chat',
              'from_environment classmethod': 'from_environment',
              'candidate_urls method': 'candidate_urls',
              'targets_state_graph property': 'targets_state_graph',
              'ORCHESTRATOR_CHAT_ENDPOINT env var': 'ORCHESTRATOR_CHAT_ENDPOINT',
          }
          failed = False
          for name, pattern in checks.items():
              if pattern not in src:
                  print(f'FAIL: Missing {name}')
                  failed = True
              else:
                  print(f'PASS: {name}')
          sys.exit(1 if failed else 0)
          "

      - name: Verify OrchestratorClient uses ChatRoutingPolicy
        shell: bash
        run: |
          set -euo pipefail
          python3 -c "
          import sys, pathlib

          src = pathlib.Path('app/infrastructure/clients/orchestrator_client.py').read_text()

          checks = {
              'ChatRoutingPolicy import': 'ChatRoutingPolicy',
              'from_environment call': 'from_environment',
              'candidate_urls call': 'candidate_urls',
              'service JWT generation': '_build_service_jwt',
              'X-Correlation-ID header': 'X-Correlation-ID',
              'X-Service-Source header': 'X-Service-Source',
              'streaming NDJSON': 'stream=True',
          }
          failed = False
          for name, pattern in checks.items():
              if pattern not in src:
                  print(f'FAIL: Missing {name}')
                  failed = True
              else:
                  print(f'PASS: {name}')
          sys.exit(1 if failed else 0)
          "

  # ── Job 2: Supervisor Configuration Verification ──────────────────────────
  supervisor-config:
    name: supervisor-config
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Verify supervisor.sh sets all required routing env vars
        shell: bash
        run: |
          set -euo pipefail
          SUPERVISOR=".devcontainer/supervisor.sh"

          REQUIRED_VARS=(
            "ORCHESTRATOR_SERVICE_URL"
            "CODESPACES"
            "ALLOW_CONTAINER_LOCALHOST_ORCHESTRATOR"
            "ORCHESTRATOR_CHAT_ENDPOINT"
            "PLANNING_AGENT_URL"
            "RESEARCH_AGENT_URL"
            "REASONING_AGENT_URL"
            "USER_SERVICE_URL"
          )

          FAILED=0
          for var in "${REQUIRED_VARS[@]}"; do
            if ! grep -q "export ${var}" "$SUPERVISOR" && ! grep -q "${var}=" "$SUPERVISOR"; then
              echo "FAIL: $SUPERVISOR missing $var"
              FAILED=1
            else
              echo "PASS: $SUPERVISOR sets $var"
            fi
          done

          # Verify ORCHESTRATOR_SERVICE_URL points to localhost:8006
          if ! grep -q "localhost:8006" "$SUPERVISOR"; then
            echo "FAIL: supervisor.sh does not route to localhost:8006"
            FAILED=1
          else
            echo "PASS: supervisor.sh routes to localhost:8006"
          fi

          # Verify ALLOW_CONTAINER_LOCALHOST_ORCHESTRATOR=true is set
          if ! grep -q 'ALLOW_CONTAINER_LOCALHOST_ORCHESTRATOR.*true' "$SUPERVISOR"; then
            echo "FAIL: ALLOW_CONTAINER_LOCALHOST_ORCHESTRATOR not set to true"
            FAILED=1
          else
            echo "PASS: ALLOW_CONTAINER_LOCALHOST_ORCHESTRATOR=true"
          fi

          exit $FAILED

      - name: Verify supervisor.sh launches all 8 services
        shell: bash
        run: |
          set -euo pipefail
          SUPERVISOR=".devcontainer/supervisor.sh"

          SERVICES=(
            "launch_orchestrator_service"
            "launch_user_service"
            "launch_planning_agent"
            "launch_research_agent"
            "launch_reasoning_agent"
            "launch_content_retrieval_skill"
            "launch_conversation_service"
          )

          FAILED=0
          for svc in "${SERVICES[@]}"; do
            if ! grep -q "$svc" "$SUPERVISOR"; then
              echo "FAIL: supervisor.sh missing $svc"
              FAILED=1
            else
              echo "PASS: supervisor.sh has $svc"
            fi
          done
          exit $FAILED

  # ── Job 3: WebSocket Protocol Verification ────────────────────────────────
  ws-protocol:
    name: ws-protocol
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Verify WebSocket uses jwt subprotocol for auth
        shell: bash
        run: |
          set -euo pipefail
          python3 -c "
          import sys, pathlib

          # Check ws_auth.py supports jwt subprotocol
          ws_auth = pathlib.Path('app/api/routers/ws_auth.py').read_text()
          checks = {
              'jwt subprotocol': '\"jwt\"',
              'token extraction from subprotocol': 'protocols',
              'Authorization header fallback': 'Authorization',
          }
          failed = False
          for name, pattern in checks.items():
              if pattern not in ws_auth:
                  print(f'FAIL: ws_auth.py missing {name}')
                  failed = True
              else:
                  print(f'PASS: ws_auth.py has {name}')

          # Check customer_chat.py uses orchestrator_client
          chat = pathlib.Path('app/api/routers/customer_chat.py').read_text()
          chat_checks = {
              'orchestrator_client import': 'orchestrator_client',
              'chat_with_agent call': 'chat_with_agent',
              'WebSocket endpoint': '@router.websocket',
              'streaming forward': 'stream_and_forward',
          }
          for name, pattern in chat_checks.items():
              if pattern not in chat:
                  print(f'FAIL: customer_chat.py missing {name}')
                  failed = True
              else:
                  print(f'PASS: customer_chat.py has {name}')

          sys.exit(1 if failed else 0)
          "

  # ── Job 4: Orchestrator Chat Endpoint Contract ────────────────────────────
  chat-endpoint:
    name: chat-endpoint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Verify orchestrator /api/chat/messages endpoint contract
        shell: bash
        run: |
          set -euo pipefail
          python3 -c "
          import sys, pathlib

          routes = pathlib.Path('microservices/orchestrator_service/src/api/routes.py').read_text()

          checks = {
              '/api/chat/messages POST endpoint': '@router.post(\"/api/chat/messages\"',
              'question field extraction': '_extract_chat_objective',
              'JWT auth decode': '_decode_auth_payload_or_401',
              'StreamingResponse': 'StreamingResponse',
              '/api/chat/ws WebSocket': '@router.websocket(\"/api/chat/ws\")',
              '/agent/chat fallback': '@router.post(\"/agent/chat\"',
              'conversation_init event': 'conversation_init',
              'assistant_final event': 'assistant_final',
          }
          failed = False
          for name, pattern in checks.items():
              if pattern not in routes:
                  print(f'FAIL: Missing {name}')
                  failed = True
              else:
                  print(f'PASS: {name}')
          sys.exit(1 if failed else 0)
          "

      - name: Verify _extract_chat_objective accepts question and objective fields
        shell: bash
        run: |
          set -euo pipefail
          python3 -c "
          import sys, pathlib

          routes = pathlib.Path('microservices/orchestrator_service/src/api/routes.py').read_text()

          # Find _extract_chat_objective function
          start = routes.find('def _extract_chat_objective')
          if start == -1:
              print('FAIL: _extract_chat_objective not found')
              sys.exit(1)

          func_src = routes[start:start+400]
          for field in ['question', 'objective']:
              if field not in func_src:
                  print(f'FAIL: _extract_chat_objective does not handle {field} field')
                  sys.exit(1)
              print(f'PASS: _extract_chat_objective handles {field} field')
          "

  # ── Job 5: Pipeline Mode Contract ─────────────────────────────────────────
  pipeline-mode:
    name: pipeline-mode
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Verify /compose returns pipeline_mode field
        shell: bash
        run: |
          set -euo pipefail
          python3 -c "
          import sys, pathlib

          pipeline = pathlib.Path('microservices/orchestrator_service/src/services/skills_pipeline.py').read_text()

          checks = {
              'pipeline_mode field': 'pipeline_mode',
              'full mode': '\"full\"',
              'partial mode': '\"partial\"',
              'fallback mode': '\"fallback\"',
              'skills_active field': 'skills_active',
              'composed_answer field': 'composed_answer',
              'total_duration_ms field': 'total_duration_ms',
              'asyncio.gather parallel calls': 'asyncio.gather',
              'X-Correlation-ID propagation': 'X-Correlation-ID',
          }
          failed = False
          for name, pattern in checks.items():
              if pattern not in pipeline:
                  print(f'FAIL: Missing {name}')
                  failed = True
              else:
                  print(f'PASS: {name}')
          sys.exit(1 if failed else 0)
          "

  # ── Job 6: Service Dependencies Check ─────────────────────────────────────
  service-deps:
    name: service-deps
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Verify all services have prometheus-client in requirements.txt
        shell: bash
        run: |
          set -euo pipefail
          SERVICES=(
            "orchestrator_service"
            "user_service"
            "planning_agent"
            "conversation_service"
            "research_agent"
            "reasoning_agent"
            "content_retrieval_skill"
          )
          FAILED=0
          for svc in "${SERVICES[@]}"; do
            req=$(find "microservices/${svc}" -name "requirements.txt" 2>/dev/null | head -1)
            if [ -z "$req" ]; then
              echo "FAIL: microservices/${svc} missing requirements.txt"
              FAILED=1
              continue
            fi
            if ! grep -qi "prometheus" "$req"; then
              echo "FAIL: ${svc}/requirements.txt missing prometheus-client"
              FAILED=1
            else
              echo "PASS: ${svc} has prometheus-client"
            fi
          done
          exit $FAILED

      - name: Verify asyncpg URL conversion in supervisor.sh (ISS-040 parity)
        shell: bash
        run: |
          set -euo pipefail
          SUPERVISOR=".devcontainer/supervisor.sh"
          # All services that use asyncpg must convert port 6543→5432
          ASYNCPG_SERVICES=("orchestrator" "planning" "user")
          FAILED=0
          for svc in "${ASYNCPG_SERVICES[@]}"; do
            # Check that the service's launch function converts the port
            if ! grep -A 30 "launch_${svc}" "$SUPERVISOR" 2>/dev/null | grep -q "6543.*5432\|5432\|asyncpg"; then
              echo "WARN: launch_${svc} may not convert port 6543→5432 for asyncpg"
            else
              echo "PASS: launch_${svc} handles asyncpg URL"
            fi
          done
          # Critical: orchestrator must have asyncpg conversion
          if ! grep -q "postgresql+asyncpg\|asyncpg" "$SUPERVISOR"; then
            echo "FAIL: supervisor.sh missing asyncpg URL conversion"
            FAILED=1
          else
            echo "PASS: supervisor.sh has asyncpg URL handling"
          fi
          exit $FAILED

  # ── Job 7: Integration Gate ────────────────────────────────────────────────
  integration-gate:
    name: integration-gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install test dependencies
        run: |
          pip install -q pytest pytest-asyncio httpx pydantic pydantic-settings \
            fastapi sqlalchemy aiosqlite asyncpg PyJWT prometheus-client \
            langgraph langchain-core
      - name: Run D-045 routing integration tests
        shell: bash
        env:
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
          SECRET_KEY: "test-secret-key-for-ci-pipeline-secure-length"
          ENVIRONMENT: testing
          LLM_MOCK_MODE: "1"
          ORCHESTRATOR_CHAT_ENDPOINT: "state_graph"
          CODESPACES: "true"
          ALLOW_CONTAINER_LOCALHOST_ORCHESTRATOR: "true"
          ORCHESTRATOR_SERVICE_URL: "http://localhost:8006"
          PYTHONPATH: "."
        run: |
          set -euo pipefail
          # Run D-045 specific tests if they exist
          if [ -f "tests/infrastructure/test_d045_user_routing.py" ]; then
            python -m pytest tests/infrastructure/test_d045_user_routing.py -v --tb=short
          else
            echo "::warning::D-045 test file not found — running routing policy unit tests"
            python -m pytest tests/infrastructure/test_routing_policy.py -v --tb=short 2>/dev/null || \
            python3 -c "
          import sys, os
          os.environ['ORCHESTRATOR_CHAT_ENDPOINT'] = 'state_graph'

          # Inline routing policy test
          sys.path.insert(0, '.')
          from app.infrastructure.clients.routing_policy import ChatRoutingPolicy

          policy = ChatRoutingPolicy.from_environment('http://localhost:8006')
          assert policy.targets_state_graph, 'Expected state_graph mode'
          assert policy.candidate_urls() == ['http://localhost:8006/api/chat/messages'], \
              f'Wrong URL: {policy.candidate_urls()}'
          print('PASS: ChatRoutingPolicy defaults to state_graph → /api/chat/messages')

          # Test agent fallback
          os.environ['ORCHESTRATOR_CHAT_ENDPOINT'] = 'agent'
          from importlib import reload
          import app.infrastructure.clients.routing_policy as rp
          reload(rp)
          policy2 = rp.ChatRoutingPolicy.from_environment('http://localhost:8006')
          assert not policy2.targets_state_graph, 'Expected agent mode'
          assert '/agent/chat' in policy2.candidate_urls()[0], \
              f'Wrong URL: {policy2.candidate_urls()}'
          print('PASS: ChatRoutingPolicy agent mode → /agent/chat')

          print()
          print('✅ D-045 routing contract verified')
          "
          fi

  # ── Final Gate ─────────────────────────────────────────────────────────────
  d045-required:
    name: d045-required
    runs-on: ubuntu-latest
    needs:
      - routing-contract
      - supervisor-config
      - ws-protocol
      - chat-endpoint
      - pipeline-mode
      - service-deps
      - integration-gate
    if: always() && !cancelled()
    steps:
      - name: Evaluate D-045 routing gates
        shell: bash
        run: |
          set -euo pipefail
          echo "routing-contract=${{ needs.routing-contract.result }}"
          echo "supervisor-config=${{ needs.supervisor-config.result }}"
          echo "ws-protocol=${{ needs.ws-protocol.result }}"
          echo "chat-endpoint=${{ needs.chat-endpoint.result }}"
          echo "pipeline-mode=${{ needs.pipeline-mode.result }}"
          echo "service-deps=${{ needs.service-deps.result }}"
          echo "integration-gate=${{ needs.integration-gate.result }}"

          isValid() { [ "$1" = "success" ] || [ "$1" = "skipped" ]; }

          FAILED=0
          for result in \
            "${{ needs.routing-contract.result }}" \
            "${{ needs.supervisor-config.result }}" \
            "${{ needs.ws-protocol.result }}" \
            "${{ needs.chat-endpoint.result }}" \
            "${{ needs.pipeline-mode.result }}" \
            "${{ needs.service-deps.result }}" \
            "${{ needs.integration-gate.result }}"; do
            if ! isValid "$result"; then
              FAILED=1
            fi
          done

          if [ "$FAILED" -eq 1 ]; then
            echo "❌ D-045 End-to-End User Routing gate FAILED"
            exit 1
          fi

          echo ""
          echo "════════════════════════════════════════════════════════════"
          echo "  ✅ D-045 — End-to-End User Routing: ALL GATES PASSED"
          echo "════════════════════════════════════════════════════════════"
          echo "  Chat Path: User WS → Monolith → OrchestratorClient"
          echo "             → localhost:8006/api/chat/messages (StateGraph)"
          echo "             → Planning:8002 + Research:8007 + Reasoning:8008"
          echo "             → Streaming NDJSON → User"
          echo ""
          echo "  Routing Mode: state_graph (default) | agent (rollback)"
          echo "  Auth: JWT subprotocol (ws) + service JWT (inter-service)"
          echo "  Pipeline: full | partial | fallback (graceful degradation)"
          echo "════════════════════════════════════════════════════════════"
