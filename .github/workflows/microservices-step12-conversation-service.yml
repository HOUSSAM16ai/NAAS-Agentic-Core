# ─────────────────────────────────────────────────────────────────────────────
# CI Gate — Step 12: Conversation Service (LangGraph Skill)
# D-042: conversation-service على :8003 — الخدمة السادسة في Skills Architecture
#
# يتحقق من:
#   1. static-checks   — بنية الملفات + contracts الـ Skill
#   2. metrics-gate    — 11 مقياس Prometheus موجود في prom_metrics.py
#   3. graph-gate      — LangGraph StateGraph بنية صحيحة
#   4. lint            — ruff check بدون أخطاء
#   5. step12-tests    — 80+ اختبار للخطوة 12
#   6. regression      — اختبارات الخطوات 4-11 لا تنكسر
#   7. pr-summary      — ملخص النتائج
# ─────────────────────────────────────────────────────────────────────────────

name: "Step 12 — Conversation Service CI Gate"

on:
  push:
    branches:
      - "feat/microservices-step12-conversation-service"
    paths:
      - "microservices/conversation_service/**"
      - "tests/microservices/conversation_service/**"
      - ".github/workflows/microservices-step12-conversation-service.yml"
      - "observability/native/prometheus.yml"
      - "observability/grafana/dashboards/140-microservices-step12-conversation-service.json"
      - ".devcontainer/supervisor.sh"
      - ".ona/automations.yaml"
  pull_request:
    branches:
      - main
    paths:
      - "microservices/conversation_service/**"
      - "tests/microservices/conversation_service/**"
      - ".github/workflows/microservices-step12-conversation-service.yml"

# D-105: يلغي التشغيلات البائتة عند دفع أحدث — يوفر دقائق runners
concurrency:
  group: microservices-step12-conversation-service-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  PYTHON_VERSION: "3.12"
  DATABASE_URL: "sqlite+aiosqlite:///:memory:"
  CONV_DATABASE_URL: "sqlite+aiosqlite:///:memory:"
  ORCHESTRATOR_DATABASE_URL: "sqlite+aiosqlite:///:memory:"
  SECRET_KEY: "test-secret-key-for-step12-ci-pipeline-secure"
  ENVIRONMENT: "testing"
  OPENROUTER_API_KEY: "dummy-key-for-ci-tests"
  LLM_MOCK_MODE: "1"
  SUPABASE_URL: "https://dummy.supabase.co"
  SUPABASE_ROLE_KEY: "dummy"

jobs:

  # ── Job 1: Static Checks ───────────────────────────────────────────────────
  static-checks:
    name: "Static Checks — Skill Contract Validation"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: "Verify required files exist"
        run: |
          echo "=== Checking conversation-service Skill structure ==="
          required_files=(
            "microservices/conversation_service/main.py"
            "microservices/conversation_service/prom_metrics.py"
            "microservices/conversation_service/database.py"
            "microservices/conversation_service/requirements.txt"
            "microservices/conversation_service/src/__init__.py"
            "microservices/conversation_service/src/conversation_graph.py"
          )
          for f in "${required_files[@]}"; do
            if [ -f "$f" ]; then echo "  ✅ $f"; else echo "  ❌ MISSING: $f"; exit 1; fi
          done

      - name: "Verify Skill contract — /health /metrics /chat/message endpoints"
        run: |
          echo "=== Checking endpoint definitions ==="
          grep -q '"/health"' microservices/conversation_service/main.py && echo "  ✅ /health" || { echo "  ❌ /health missing"; exit 1; }
          grep -q '"/metrics"' microservices/conversation_service/main.py && echo "  ✅ /metrics" || { echo "  ❌ /metrics missing"; exit 1; }
          grep -q '"/chat/message"' microservices/conversation_service/main.py && echo "  ✅ /chat/message" || { echo "  ❌ /chat/message missing"; exit 1; }
          grep -q '"/chat/ws"' microservices/conversation_service/main.py && echo "  ✅ /chat/ws" || { echo "  ❌ /chat/ws missing"; exit 1; }

      - name: "Verify Skill contract — no cross-service imports"
        run: |
          echo "=== Checking isolation (no cross-service imports) ==="
          # conversation_service لا يجب أن يستورد من microservices أخرى
          forbidden_imports=(
            "orchestrator_service"
            "planning_agent"
            "research_agent"
            "reasoning_agent"
            "user_service"
            "content_retrieval_skill"
          )
          for imp in "${forbidden_imports[@]}"; do
            if grep -r "from microservices.${imp}" microservices/conversation_service/ 2>/dev/null | grep -v "__pycache__"; then
              echo "  ❌ VIOLATION: imports from ${imp}"
              exit 1
            else
              echo "  ✅ no import from ${imp}"
            fi
          done

      - name: "Verify LangGraph StateGraph structure"
        run: |
          echo "=== Checking LangGraph StateGraph ==="
          grep -q "StateGraph" microservices/conversation_service/src/conversation_graph.py && echo "  ✅ StateGraph" || { echo "  ❌ StateGraph missing"; exit 1; }
          grep -q "intent_node" microservices/conversation_service/src/conversation_graph.py && echo "  ✅ intent_node" || { echo "  ❌ intent_node missing"; exit 1; }
          grep -q "response_node" microservices/conversation_service/src/conversation_graph.py && echo "  ✅ response_node" || { echo "  ❌ response_node missing"; exit 1; }
          grep -q "ConversationState" microservices/conversation_service/src/conversation_graph.py && echo "  ✅ ConversationState" || { echo "  ❌ ConversationState missing"; exit 1; }
          grep -q "asyncio.wait_for" microservices/conversation_service/src/conversation_graph.py && echo "  ✅ timeout guard" || { echo "  ❌ timeout guard missing"; exit 1; }

      - name: "Verify supervisor.sh STEP 4J"
        run: |
          echo "=== Checking supervisor.sh STEP 4J ==="
          grep -q "STEP 4J" .devcontainer/supervisor.sh && echo "  ✅ STEP 4J present" || { echo "  ❌ STEP 4J missing"; exit 1; }
          grep -q "launch_conversation_service" .devcontainer/supervisor.sh && echo "  ✅ launch_conversation_service" || { echo "  ❌ launch_conversation_service missing"; exit 1; }
          grep -q "8003" .devcontainer/supervisor.sh && echo "  ✅ port 8003" || { echo "  ❌ port 8003 missing"; exit 1; }

      - name: "Verify Prometheus scrape target"
        run: |
          echo "=== Checking prometheus.yml ==="
          grep -q "conversation-service" observability/native/prometheus.yml && echo "  ✅ scrape target" || { echo "  ❌ scrape target missing"; exit 1; }
          grep -q "localhost:8003" observability/native/prometheus.yml && echo "  ✅ port 8003" || { echo "  ❌ port 8003 missing"; exit 1; }
          grep -q 'step: "12"' observability/native/prometheus.yml && echo "  ✅ step=12 label" || { echo "  ❌ step=12 label missing"; exit 1; }

      - name: "Verify Grafana dashboard"
        run: |
          echo "=== Checking Grafana dashboard ==="
          DASH="observability/grafana/dashboards/140-microservices-step12-conversation-service.json"
          [ -f "$DASH" ] && echo "  ✅ dashboard file exists" || { echo "  ❌ dashboard missing"; exit 1; }
          python3 -c "import json; d=json.load(open('$DASH')); assert d['uid']=='cogniforge-ms-step12-conversation', 'wrong uid'; print('  ✅ uid correct')"
          python3 -c "import json; d=json.load(open('$DASH')); assert len(d['panels']) >= 14, f'only {len(d[\"panels\"])} panels'; print(f'  ✅ {len(d[\"panels\"])} panels')"

  # ── Job 2: Metrics Gate ────────────────────────────────────────────────────
  metrics-gate:
    name: "Metrics Gate — 11 Prometheus Metrics"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: "Verify all 11 metrics defined in prom_metrics.py"
        run: |
          echo "=== Checking Prometheus metrics ==="
          required_metrics=(
            "cogniforge_conversation_requests_total"
            "cogniforge_conversation_request_duration_seconds"
            "cogniforge_conversation_active_connections"
            "cogniforge_conversation_messages_total"
            "cogniforge_conversation_sessions_total"
            "cogniforge_conversation_session_duration_seconds"
            "cogniforge_conversation_graph_invocations_total"
            "cogniforge_conversation_graph_duration_seconds"
            "cogniforge_conversation_graph_errors_total"
            "cogniforge_conversation_db_operations_total"
            "cogniforge_conversation_startup_info"
          )
          PASS=0; FAIL=0
          for m in "${required_metrics[@]}"; do
            if grep -q "$m" microservices/conversation_service/prom_metrics.py; then
              echo "  ✅ $m"; PASS=$((PASS+1))
            else
              echo "  ❌ $m — MISSING"; FAIL=$((FAIL+1))
            fi
          done
          echo ""
          echo "Results: $PASS/11 metrics present"
          [ "$FAIL" -eq 0 ] || exit 1

      - name: "Verify record_* functions exist (emitters)"
        run: |
          echo "=== Checking metric emitter functions ==="
          required_fns=(
            "def record_request"
            "def record_ws_connection"
            "def record_message"
            "def record_session"
            "def record_graph_invocation"
            "def record_graph_error"
            "def record_db_operation"
            "def set_startup_info"
            "def get_metrics_output"
          )
          for fn in "${required_fns[@]}"; do
            grep -q "$fn" microservices/conversation_service/prom_metrics.py && echo "  ✅ $fn" || { echo "  ❌ $fn missing"; exit 1; }
          done

      - name: "Verify independent CollectorRegistry"
        run: |
          grep -q "CollectorRegistry()" microservices/conversation_service/prom_metrics.py && echo "  ✅ independent REGISTRY" || { echo "  ❌ REGISTRY missing"; exit 1; }
          grep -q "registry=REGISTRY" microservices/conversation_service/prom_metrics.py && echo "  ✅ metrics use REGISTRY" || { echo "  ❌ metrics not using REGISTRY"; exit 1; }

  # ── Job 3: Graph Gate ──────────────────────────────────────────────────────
  graph-gate:
    name: "Graph Gate — LangGraph StateGraph Validation"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: "Verify StateGraph topology"
        run: |
          echo "=== Checking StateGraph topology ==="
          GRAPH="microservices/conversation_service/src/conversation_graph.py"
          # ISS-070 (D-058) inserted `context_node` between intent_node and
          # response_node, so the live topology is now:
          #   START → intent_node → context_node → response_node → END
          # The gate accepts either the 2-node legacy form (intent→response)
          # or the 3-node form (intent→context→response).
          grep -q "add_node.*intent_node" "$GRAPH" && echo "  ✅ intent_node added" || { echo "  ❌ intent_node not added"; exit 1; }
          grep -q "add_node.*response_node" "$GRAPH" && echo "  ✅ response_node added" || { echo "  ❌ response_node not added"; exit 1; }
          grep -q "add_edge.*START.*intent_node" "$GRAPH" && echo "  ✅ START→intent_node edge" || { echo "  ❌ START→intent_node missing"; exit 1; }
          if grep -q "add_edge.*intent_node.*response_node" "$GRAPH"; then
            echo "  ✅ intent_node→response_node edge (legacy 2-node form)"
          elif grep -q 'add_edge.*intent_node.*context_node' "$GRAPH" \
            && grep -q 'add_edge.*context_node.*response_node' "$GRAPH"; then
            echo "  ✅ intent_node→context_node→response_node chain (D-058 3-node form)"
          else
            echo "  ❌ intent_node→response_node chain missing in either form"
            exit 1
          fi
          grep -q "add_edge.*response_node.*END" "$GRAPH" && echo "  ✅ response_node→END edge" || { echo "  ❌ response_node→END missing"; exit 1; }

      - name: "Verify Prometheus instrumentation in nodes"
        run: |
          GRAPH="microservices/conversation_service/src/conversation_graph.py"
          grep -q "record_graph_invocation" "$GRAPH" && echo "  ✅ record_graph_invocation called" || { echo "  ❌ record_graph_invocation missing"; exit 1; }
          grep -q "record_graph_error" "$GRAPH" && echo "  ✅ record_graph_error called" || { echo "  ❌ record_graph_error missing"; exit 1; }

      - name: "Verify fallback mode (no LLM dependency)"
        run: |
          GRAPH="microservices/conversation_service/src/conversation_graph.py"
          grep -q "_build_fallback_response" "$GRAPH" && echo "  ✅ fallback function exists" || { echo "  ❌ fallback missing"; exit 1; }
          grep -q "OPENROUTER_API_KEY" "$GRAPH" && echo "  ✅ LLM key check present" || { echo "  ❌ LLM key check missing"; exit 1; }

      - name: "Verify timeout guard"
        run: |
          GRAPH="microservices/conversation_service/src/conversation_graph.py"
          grep -q "asyncio.wait_for" "$GRAPH" && echo "  ✅ timeout guard present" || { echo "  ❌ timeout guard missing"; exit 1; }
          grep -q "TimeoutError" "$GRAPH" && echo "  ✅ TimeoutError handled" || { echo "  ❌ TimeoutError not handled"; exit 1; }

  # ── Job 4: Lint ────────────────────────────────────────────────────────────
  lint:
    name: "Lint — ruff check"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: "Install ruff"
        run: pip install ruff==0.4.4
      - name: "ruff check conversation_service"
        run: |
          ruff check microservices/conversation_service/ --select=E,W,F,I --ignore=E501
          echo "  ✅ ruff clean"
      - name: "ruff check tests"
        run: |
          [ -d "tests/microservices/conversation_service" ] && \
            ruff check tests/microservices/conversation_service/ --select=E,W,F,I --ignore=E501 || \
            echo "  ⚠️  test directory not yet created"

  # ── Job 5: Step 12 Tests ───────────────────────────────────────────────────
  step12-tests:
    name: "Step 12 Tests — 80+ assertions"
    runs-on: ubuntu-latest
    needs: [static-checks, metrics-gate, graph-gate, lint]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: "Install dependencies"
        run: |
          pip install --upgrade pip
          pip install \
            fastapi==0.109.2 \
            uvicorn==0.27.1 \
            pydantic>=2.8.0 \
            sqlalchemy>=2.0.0 \
            aiosqlite>=0.19.0 \
            httpx>=0.27.0 \
            langgraph \
            prometheus-client>=0.20.0 \
            pytest>=8.0.0 \
            pytest-asyncio>=0.23.0 \
            pytest-cov \
            jsonschema>=4.0.0

      - name: "Run Step 12 tests"
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          CONV_DATABASE_URL: ${{ env.CONV_DATABASE_URL }}
          SECRET_KEY: ${{ env.SECRET_KEY }}
          ENVIRONMENT: ${{ env.ENVIRONMENT }}
          OPENROUTER_API_KEY: ${{ env.OPENROUTER_API_KEY }}
          LLM_MOCK_MODE: ${{ env.LLM_MOCK_MODE }}
        run: |
          python -m pytest \
            tests/microservices/conversation_service/test_step12_conversation_service.py \
            -v --tb=short --no-header \
            --cov=microservices/conversation_service \
            --cov-report=term-missing \
            --cov-fail-under=80 \
            2>&1 | tee test_output.txt
          echo ""
          echo "=== Test Summary ==="
          tail -5 test_output.txt

  # ── Job 6: Regression ─────────────────────────────────────────────────────
  regression-steps-4-11:
    name: "Regression — Steps 4–11 unbroken"
    runs-on: ubuntu-latest
    needs: [step12-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: "Install dependencies"
        run: |
          pip install --upgrade pip
          pip install \
            fastapi==0.109.2 \
            uvicorn==0.27.1 \
            pydantic>=2.8.0 \
            sqlalchemy>=2.0.0 \
            aiosqlite>=0.19.0 \
            httpx>=0.27.0 \
            langgraph \
            prometheus-client>=0.20.0 \
            pyjwt>=2.8.0 \
            pytest>=8.0.0 \
            pytest-asyncio>=0.23.0 \
            jsonschema>=4.0.0

      - name: "Run regression tests (Steps 4–11)"
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          ORCHESTRATOR_DATABASE_URL: ${{ env.ORCHESTRATOR_DATABASE_URL }}
          SECRET_KEY: ${{ env.SECRET_KEY }}
          ENVIRONMENT: ${{ env.ENVIRONMENT }}
          OPENROUTER_API_KEY: ${{ env.OPENROUTER_API_KEY }}
          LLM_MOCK_MODE: ${{ env.LLM_MOCK_MODE }}
          SUPABASE_URL: ${{ env.SUPABASE_URL }}
          SUPABASE_ROLE_KEY: ${{ env.SUPABASE_ROLE_KEY }}
          CODESPACES: "true"
        run: |
          python -m pytest \
            tests/microservices/orchestrator_service/test_step4_persistence_relay.py \
            tests/microservices/orchestrator_service/test_step9_skills_pipeline.py \
            tests/microservices/orchestrator_service/test_step10_postgres_checkpointer.py \
            tests/microservices/content_retrieval_skill/test_step11_content_retrieval_skill.py \
            -v --tb=short --no-header -q \
            2>&1 | tail -30
          echo "  ✅ Regression tests passed"

  # ── Job 7: PR Summary ─────────────────────────────────────────────────────
  pr-summary:
    name: "PR Summary"
    runs-on: ubuntu-latest
    needs: [static-checks, metrics-gate, graph-gate, lint, step12-tests, regression-steps-4-11]
    if: always()
    steps:
      - name: "Print summary"
        run: |
          echo "════════════════════════════════════════════════════════════"
          echo "  CogniForge — Step 12: Conversation Service CI Summary"
          echo "════════════════════════════════════════════════════════════"
          echo ""
          echo "  D-042: conversation-service على :8003 — الخدمة السادسة"
          echo ""
          echo "  الملفات الجديدة:"
          echo "    microservices/conversation_service/prom_metrics.py  — 11 مقياس"
          echo "    microservices/conversation_service/src/conversation_graph.py — LangGraph"
          echo "    microservices/conversation_service/main.py          — FastAPI Skill"
          echo "    microservices/conversation_service/database.py      — lazy singleton"
          echo "    observability/grafana/dashboards/140-*.json         — 15 panels"
          echo "    tests/microservices/conversation_service/test_step12_*.py — 80+ tests"
          echo ""
          echo "  المقاييس الجديدة (11):"
          echo "    cogniforge_conversation_startup_info{step=\"12\"}"
          echo "    cogniforge_conversation_active_connections"
          echo "    cogniforge_conversation_messages_total{direction,route}"
          echo "    cogniforge_conversation_graph_invocations_total{node,status}"
          echo "    cogniforge_conversation_graph_duration_seconds"
          echo "    cogniforge_conversation_graph_errors_total{error_type}"
          echo "    ... + 5 more"
          echo ""
          echo "  Skills Architecture بعد Step 12:"
          echo "    :8000 FastAPI monolith"
          echo "    :8001 user-service (Step 5)"
          echo "    :8002 planning-agent (Step 6)"
          echo "    :8003 conversation-service (Step 12 — NEW)"
          echo "    :8006 orchestrator-service (Steps 4+9+10)"
          echo "    :8007 research-agent (Step 7)"
          echo "    :8008 reasoning-agent (Step 8)"
          echo "    :8009 content-retrieval-skill (Step 11)"
          echo ""
          echo "════════════════════════════════════════════════════════════"
