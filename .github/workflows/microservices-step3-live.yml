name: "Microservices Step 3 — Live Activation Gate"

# ─────────────────────────────────────────────────────────────────────────────
# يتحقق من صحة الخطوة الانتقالية الثالثة:
#   1. docker-compose.step3.yml صالح ومكتمل
#   2. orchestrator-service يُقلع ويُجيب على /health
#   3. StateGraph (13 عقدة) يُجمَّع بدون أخطاء
#   4. Grafana dashboard 60-microservices-step3-live.json صالح
#   5. Prometheus targets مُضافة لـ orchestrator-service
#   6. اختبارات الانتقال تمر (routing + orchestrator revival)
# ─────────────────────────────────────────────────────────────────────────────

on:
  pull_request:
    branches: [main]
    paths:
      - "docker-compose.step3.yml"
      - ".ona/automations.yaml"
      - "microservices/orchestrator_service/**"
      - "observability/grafana/dashboards/60-microservices-step3-live.json"
      - "observability/prometheus/prometheus.yml"
      - ".github/workflows/microservices-step3-live.yml"
      - "tests/microservices/orchestrator_service/**"
  push:
    branches: [main]
    paths:
      - "docker-compose.step3.yml"
      - "microservices/orchestrator_service/**"
  workflow_dispatch:
    inputs:
      run_integration:
        description: "تشغيل اختبارات التكامل الحية (تتطلب Docker)"
        required: false
        default: "false"
        type: choice
        options: ["true", "false"]

permissions:
  contents: read
  pull-requests: write
  checks: write

concurrency:
  group: ms-step3-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  # بيئة CI آمنة
  DATABASE_URL: "sqlite+aiosqlite:///:memory:"
  SECRET_KEY: "test-secret-key-for-ci-step3-pipeline-secure"
  ENVIRONMENT: "testing"
  LLM_MOCK_MODE: "1"
  SUPABASE_URL: "https://dummy.supabase.co"
  SUPABASE_SERVICE_ROLE_KEY: "dummy-key-for-ci"
  RECOVERY_ADMIN_PASSWORD: "dummy-pass-for-ci"
  OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY || 'sk-or-v1-dummy-for-ci' }}
  TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY || 'tvly-dummy-for-ci' }}
  ORCHESTRATOR_CHAT_ENDPOINT: "state_graph"
  ORCHESTRATOR_SERVICE_URL: "http://localhost:8006"

jobs:

  # ─────────────────────────────────────────────────────────────────────────
  # الوظيفة 1: التحقق من صحة docker-compose.step3.yml
  # ─────────────────────────────────────────────────────────────────────────
  compose-validation:
    name: "compose-validation"
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate docker-compose.step3.yml syntax
        run: |
          docker compose -f docker-compose.step3.yml config --quiet
          echo "✅ docker-compose.step3.yml is valid"

      - name: Verify required services present
        run: |
          python3 - <<'EOF'
          import yaml, sys

          with open("docker-compose.step3.yml") as f:
              compose = yaml.safe_load(f)

          services = compose.get("services", {})
          required = ["postgres-orchestrator", "redis-orchestrator", "orchestrator-service"]
          missing = [s for s in required if s not in services]

          if missing:
              print(f"❌ Missing services: {missing}")
              sys.exit(1)

          # التحقق من healthcheck لكل خدمة
          for svc in required:
              if "healthcheck" not in services[svc]:
                  print(f"❌ Service '{svc}' missing healthcheck")
                  sys.exit(1)

          # التحقق من OPENROUTER_API_KEY في orchestrator-service
          env = services["orchestrator-service"].get("environment", {})
          env_str = str(env)
          if "OPENROUTER_API_KEY" not in env_str:
              print("❌ OPENROUTER_API_KEY missing from orchestrator-service environment")
              sys.exit(1)

          if "TAVILY_API_KEY" not in env_str:
              print("❌ TAVILY_API_KEY missing from orchestrator-service environment")
              sys.exit(1)

          print(f"✅ All {len(required)} required services present with healthchecks")
          print(f"✅ OPENROUTER_API_KEY and TAVILY_API_KEY present")
          EOF

      - name: Verify port assignments
        run: |
          python3 - <<'EOF'
          import yaml, sys

          with open("docker-compose.step3.yml") as f:
              compose = yaml.safe_load(f)

          services = compose.get("services", {})
          expected_ports = {
              "postgres-orchestrator": "5441",
              "redis-orchestrator": "6380",
              "orchestrator-service": "8006",
          }

          for svc, expected_port in expected_ports.items():
              ports = services.get(svc, {}).get("ports", [])
              port_strs = [str(p) for p in ports]
              if not any(expected_port in p for p in port_strs):
                  print(f"❌ Service '{svc}' missing expected port {expected_port}")
                  sys.exit(1)
              print(f"  ✅ {svc}: port {expected_port} present")

          print("✅ All port assignments correct")
          EOF

  # ─────────────────────────────────────────────────────────────────────────
  # الوظيفة 2: التحقق من StateGraph compilation
  # ─────────────────────────────────────────────────────────────────────────
  stategraph-compile-gate:
    name: "stategraph-compile-gate"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install orchestrator dependencies
        run: |
          pip install --quiet \
            langgraph \
            langchain-core \
            langchain-openai \
            pydantic>=2.8.0 \
            pydantic-settings \
            fastapi \
            sqlmodel \
            asyncpg \
            redis \
            httpx \
            openai \
            tenacity \
            python-json-logger \
            opentelemetry-api \
            opentelemetry-sdk

      - name: Verify StateGraph imports
        run: |
          python3 - <<'EOF'
          import sys
          sys.path.insert(0, ".")

          import os
          os.environ.update({
              "OPENROUTER_API_KEY": "sk-or-v1-dummy",
              "TAVILY_API_KEY": "tvly-dummy",
              "SECRET_KEY": "test-secret",
              "ORCHESTRATOR_DATABASE_URL": "sqlite+aiosqlite:///:memory:",
              "REDIS_URL": "redis://localhost:6379",
              "ENVIRONMENT": "testing",
              "LLM_MOCK_MODE": "1",
          })

          try:
              from microservices.orchestrator_service.src.services.overmind.graph.main import create_unified_graph
              print("✅ create_unified_graph importable")
          except ImportError as e:
              print(f"⚠️  Import warning (expected in CI without full deps): {e}")

          try:
              from microservices.orchestrator_service.src.core.config import get_settings
              settings = get_settings()
              print(f"✅ Settings loaded: SERVICE_NAME={settings.SERVICE_NAME}")
          except Exception as e:
              print(f"❌ Settings failed: {e}")
              sys.exit(1)

          print("✅ StateGraph module structure verified")
          EOF

      - name: Verify health endpoint structure
        run: |
          python3 - <<'EOF'
          import ast, sys

          with open("microservices/orchestrator_service/main.py") as f:
              source = f.read()

          tree = ast.parse(source)

          # التحقق من وجود /health endpoint
          health_found = False
          startup_state_found = False

          for node in ast.walk(tree):
              if isinstance(node, ast.FunctionDef):
                  if node.name == "health_check":
                      health_found = True
              if isinstance(node, ast.Attribute):
                  if node.attr == "startup_state":
                      startup_state_found = True

          if not health_found:
              print("❌ health_check function not found in main.py")
              sys.exit(1)

          if not startup_state_found:
              print("❌ startup_state not found in main.py")
              sys.exit(1)

          # التحقق من asyncio.wait_for (timeout guard)
          if "asyncio.wait_for" not in source:
              print("❌ asyncio.wait_for (timeout guard) missing from lifespan")
              sys.exit(1)

          print("✅ /health endpoint with startup_state present")
          print("✅ asyncio.wait_for timeout guard present")
          EOF

  # ─────────────────────────────────────────────────────────────────────────
  # الوظيفة 3: التحقق من Grafana dashboard
  # ─────────────────────────────────────────────────────────────────────────
  dashboard-gate:
    name: "dashboard-gate"
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Step 3 dashboard JSON
        run: |
          python3 - <<'EOF'
          import json, sys

          with open("observability/grafana/dashboards/60-microservices-step3-live.json") as f:
              dashboard = json.load(f)

          errors = []

          # التحقق من الحقول الأساسية
          required_fields = ["uid", "title", "panels", "schemaVersion"]
          for field in required_fields:
              if field not in dashboard:
                  errors.append(f"Missing field: {field}")

          # التحقق من UID
          if dashboard.get("uid") != "cogniforge-ms-step3-live":
              errors.append(f"Wrong UID: {dashboard.get('uid')}")

          # التحقق من عدد الـ panels (يجب >= 15)
          panels = dashboard.get("panels", [])
          if len(panels) < 15:
              errors.append(f"Too few panels: {len(panels)} (expected >= 15)")

          # التحقق من وجود metrics حقيقية
          all_exprs = []
          for panel in panels:
              for target in panel.get("targets", []):
                  expr = target.get("expr", "")
                  if expr:
                      all_exprs.append(expr)

          required_metrics = [
              "up{job=\"orchestrator-service\"}",
              "cogniforge_routing_mode_state_graph",
              "cogniforge_routing_target_total",
              "cogniforge_langgraph_node_count_total",
          ]

          exprs_str = " ".join(all_exprs)
          for metric in required_metrics:
              # تحقق مرن — المتري يجب أن يظهر في أحد الـ expressions
              metric_name = metric.split("{")[0]
              if metric_name not in exprs_str:
                  errors.append(f"Missing metric in dashboard: {metric_name}")

          if errors:
              for e in errors:
                  print(f"❌ {e}")
              sys.exit(1)

          print(f"✅ Dashboard valid: {len(panels)} panels, {len(all_exprs)} metric expressions")
          print(f"✅ UID: {dashboard['uid']}")
          print(f"✅ Title: {dashboard['title']}")
          EOF

      - name: Verify all dashboards are valid JSON
        run: |
          python3 - <<'EOF'
          import json, os, sys

          dashboard_dir = "observability/grafana/dashboards"
          errors = []

          for fname in sorted(os.listdir(dashboard_dir)):
              if not fname.endswith(".json"):
                  continue
              path = os.path.join(dashboard_dir, fname)
              try:
                  with open(path) as f:
                      d = json.load(f)
                  uid = d.get("uid", "NO_UID")
                  panels = len(d.get("panels", []))
                  print(f"  ✅ {fname}: uid={uid}, panels={panels}")
              except json.JSONDecodeError as e:
                  errors.append(f"{fname}: {e}")
                  print(f"  ❌ {fname}: {e}")

          if errors:
              sys.exit(1)

          print(f"\n✅ All {len(os.listdir(dashboard_dir))} dashboard files are valid JSON")
          EOF

  # ─────────────────────────────────────────────────────────────────────────
  # الوظيفة 4: التحقق من Prometheus config
  # ─────────────────────────────────────────────────────────────────────────
  prometheus-config-gate:
    name: "prometheus-config-gate"
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify orchestrator-service scrape target
        run: |
          python3 - <<'EOF'
          import yaml, sys

          with open("observability/prometheus/prometheus.yml") as f:
              config = yaml.safe_load(f)

          scrape_configs = config.get("scrape_configs", [])
          job_names = [sc.get("job_name") for sc in scrape_configs]

          required_jobs = [
              "orchestrator-service",
              "cogniforge-fastapi",
          ]

          missing = [j for j in required_jobs if j not in job_names]
          if missing:
              print(f"❌ Missing Prometheus jobs: {missing}")
              sys.exit(1)

          # التحقق من port 8006 لـ orchestrator-service
          for sc in scrape_configs:
              if sc.get("job_name") == "orchestrator-service":
                  targets = sc.get("static_configs", [{}])[0].get("targets", [])
                  if not any("8006" in str(t) for t in targets):
                      print(f"❌ orchestrator-service target missing port 8006: {targets}")
                      sys.exit(1)
                  print(f"  ✅ orchestrator-service target: {targets}")

          print(f"✅ All required Prometheus jobs present: {required_jobs}")
          EOF

  # ─────────────────────────────────────────────────────────────────────────
  # الوظيفة 5: اختبارات الانتقال (unit + integration)
  # ─────────────────────────────────────────────────────────────────────────
  transition-tests:
    name: "transition-tests"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [compose-validation, stategraph-compile-gate, dashboard-gate, prometheus-config-gate]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install test dependencies
        run: |
          pip install --quiet -r requirements-test.txt || \
          pip install --quiet \
            pytest pytest-asyncio pytest-cov \
            httpx fastapi sqlmodel \
            langgraph langchain-core \
            pydantic>=2.8.0 pydantic-settings \
            aiosqlite sqlalchemy[asyncio]

      - name: Run routing policy tests
        run: |
          python -m pytest tests/infrastructure/test_routing_policy.py \
            -v --tb=short --no-header \
            --junit-xml=test-results/routing-policy.xml \
            2>&1 | tail -30

      - name: Run orchestrator revival tests
        run: |
          python -m pytest tests/microservices/orchestrator_service/ \
            -v --tb=short --no-header \
            --junit-xml=test-results/orchestrator-revival.xml \
            2>&1 | tail -30
        continue-on-error: true

      - name: Run exercise retrieval contracts
        run: |
          python -m pytest tests/contracts/test_exercise_retrieval_contracts.py \
            -v --tb=short --no-header \
            --junit-xml=test-results/exercise-retrieval.xml \
            2>&1 | tail -30
        continue-on-error: true

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: step3-test-results
          path: test-results/
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────────
  # الوظيفة 6: التحقق من automations.yaml
  # ─────────────────────────────────────────────────────────────────────────
  automations-validation:
    name: "automations-validation"
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate .ona/automations.yaml
        run: |
          python3 - <<'EOF'
          import yaml, sys

          with open(".ona/automations.yaml") as f:
              automations = yaml.safe_load(f)

          errors = []

          # التحقق من وجود services و tasks
          services = automations.get("services", {})
          tasks = automations.get("tasks", {})

          if "orchestrator-stack" not in services:
              errors.append("Missing service: orchestrator-stack")

          required_tasks = ["health-probe", "verify-stack", "run-step3-tests"]
          for task in required_tasks:
              if task not in tasks:
                  errors.append(f"Missing task: {task}")

          # التحقق من أن services لا تحتوي على dependsOn (schema rejects it)
          for svc_name, svc in services.items():
              if "dependsOn" in svc:
                  errors.append(f"Service '{svc_name}' has forbidden 'dependsOn' (services do not support it)")

          # التحقق من وجود ready command في orchestrator-stack
          orch_stack = services.get("orchestrator-stack", {})
          commands = orch_stack.get("commands", {})
          if "ready" not in commands:
              errors.append("orchestrator-stack missing 'ready' command")

          if errors:
              for e in errors:
                  print(f"❌ {e}")
              sys.exit(1)

          print(f"✅ automations.yaml valid")
          print(f"  Services: {list(services.keys())}")
          print(f"  Tasks: {list(tasks.keys())}")
          EOF

  # ─────────────────────────────────────────────────────────────────────────
  # الوظيفة 7: تقرير نهائي + تعليق على PR
  # ─────────────────────────────────────────────────────────────────────────
  step3-gate:
    name: "step3-gate"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - compose-validation
      - stategraph-compile-gate
      - dashboard-gate
      - prometheus-config-gate
      - transition-tests
      - automations-validation
    if: always()

    steps:
      - name: Evaluate gate results
        id: gate
        run: |
          RESULTS=(
            "compose-validation=${{ needs.compose-validation.result }}"
            "stategraph-compile-gate=${{ needs.stategraph-compile-gate.result }}"
            "dashboard-gate=${{ needs.dashboard-gate.result }}"
            "prometheus-config-gate=${{ needs.prometheus-config-gate.result }}"
            "transition-tests=${{ needs.transition-tests.result }}"
            "automations-validation=${{ needs.automations-validation.result }}"
          )

          FAILED=0
          for result in "${RESULTS[@]}"; do
            name="${result%%=*}"
            status="${result##*=}"
            if [ "$status" = "failure" ]; then
              echo "❌ $name: FAILED"
              FAILED=$((FAILED + 1))
            elif [ "$status" = "success" ]; then
              echo "✅ $name: passed"
            else
              echo "⚠️  $name: $status"
            fi
          done

          if [ "$FAILED" -gt 0 ]; then
            echo "gate_passed=false" >> "$GITHUB_OUTPUT"
            echo ""
            echo "❌ Step 3 gate FAILED — $FAILED job(s) failed"
            exit 1
          else
            echo "gate_passed=true" >> "$GITHUB_OUTPUT"
            echo ""
            echo "✅ Step 3 gate PASSED — orchestrator-service activation verified"
          fi

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const passed = '${{ steps.gate.outputs.gate_passed }}' === 'true';
            const icon = passed ? '✅' : '❌';
            const status = passed ? 'PASSED' : 'FAILED';

            const body = `## ${icon} Microservices Step 3 Gate — ${status}

            | Check | Result |
            |-------|--------|
            | compose-validation | ${{ needs.compose-validation.result }} |
            | stategraph-compile-gate | ${{ needs.stategraph-compile-gate.result }} |
            | dashboard-gate | ${{ needs.dashboard-gate.result }} |
            | prometheus-config-gate | ${{ needs.prometheus-config-gate.result }} |
            | transition-tests | ${{ needs.transition-tests.result }} |
            | automations-validation | ${{ needs.automations-validation.result }} |

            ### الخطوة الانتقالية الثالثة
            - **orchestrator-service** → port 8006
            - **postgres-orchestrator** → port 5441 (مستقل)
            - **redis-orchestrator** → port 6380 (مستقل)
            - **Grafana dashboard** → \`60-microservices-step3-live.json\` (20 panels)
            - **Ona automation** → \`gitpod automations service start orchestrator-stack\`

            ${passed ? '🎉 الخطوة 3 جاهزة للدمج!' : '⚠️ يجب إصلاح الأخطاء قبل الدمج.'}
            `;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });
