name: "Step 8 — Reasoning Agent CI Gate"

# يتحقق من صحة reasoning-agent (الخطوة 8):
#   - prometheus-client في requirements.txt
#   - prom_metrics.py موجود ويحتوي 11 مقياساً
#   - /metrics endpoint في main.py
#   - supervisor.sh يُشغِّل reasoning-agent على :8008
#   - automations.yaml يحتوي reasoning-agent service + tasks
#   - prometheus.yml يحتوي scrape target للـ reasoning-agent
#   - Grafana dashboard صالح (JSON valid + UID صحيح)
#   - 80+ اختبار تمر بنجاح
#   - اختبارات الانحدار للخطوات 4-7

on:
  push:
    branches: ["feat/microservices-step8-reasoning-agent", "main"]
    paths:
      - "microservices/reasoning_agent/**"
      - ".devcontainer/supervisor.sh"
      - ".ona/automations.yaml"
      - "observability/native/prometheus.yml"
      - "observability/grafana/dashboards/110-*.json"
      - ".github/workflows/microservices-step8-reasoning-agent.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "microservices/reasoning_agent/**"
      - ".devcontainer/supervisor.sh"
      - ".ona/automations.yaml"
      - "observability/native/prometheus.yml"
      - "observability/grafana/dashboards/110-*.json"
      - ".github/workflows/microservices-step8-reasoning-agent.yml"

concurrency:
  group: "step8-${{ github.ref }}"
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  # ── Job 1: Static checks ──────────────────────────────────────────────────
  static-checks:
    name: "Static Checks — requirements + prom_metrics + main.py"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: "prometheus-client in requirements.txt"
        run: |
          grep -q "prometheus-client" microservices/reasoning_agent/requirements.txt
          echo "✅ prometheus-client found in requirements.txt"

      - name: "prom_metrics.py exists"
        run: |
          test -f microservices/reasoning_agent/prom_metrics.py
          echo "✅ prom_metrics.py exists"

      - name: "prom_metrics.py — 11 required metrics present"
        run: |
          METRICS=(
            "cogniforge_reasoning_requests_total"
            "cogniforge_reasoning_request_duration_seconds"
            "cogniforge_reasoning_active_connections"
            "cogniforge_reasoning_invocations_total"
            "cogniforge_reasoning_invocation_duration_seconds"
            "cogniforge_reasoning_mcts_expansions_total"
            "cogniforge_reasoning_mcts_errors_total"
            "cogniforge_reasoning_llm_calls_total"
            "cogniforge_reasoning_llm_errors_total"
            "cogniforge_reasoning_fallback_responses_total"
            "cogniforge_reasoning_startup_info"
          )
          for metric in "${METRICS[@]}"; do
            grep -q "$metric" microservices/reasoning_agent/prom_metrics.py
            echo "  ✅ $metric"
          done
          echo "✅ All 11 metrics present in prom_metrics.py"

      - name: "/metrics endpoint in main.py"
        run: |
          grep -q '"/metrics"' microservices/reasoning_agent/main.py
          grep -q "export_prometheus_text" microservices/reasoning_agent/main.py
          echo "✅ /metrics endpoint defined in main.py"

      - name: "step=8 label in main.py"
        run: |
          grep -q 'step.*8\|"8"' microservices/reasoning_agent/main.py
          echo "✅ step=8 label present in main.py"

      - name: "ISS-039-B: no import-time AIService instantiation"
        run: |
          # AIService نفسه يُنشأ عند import في ai_service.py — هذا مقبول
          # لكن main.py يجب ألا يستورد ai_service مباشرةً عند الإقلاع
          if grep -q "^from microservices.reasoning_agent.src.services.ai_service import ai_service" microservices/reasoning_agent/main.py; then
            echo "❌ main.py imports ai_service at module level — ISS-039-B not fixed"
            exit 1
          fi
          echo "✅ main.py does not import ai_service at module level"

  # ── Job 2: Infrastructure checks ─────────────────────────────────────────
  infrastructure-gate:
    name: "Infrastructure — supervisor + automations + prometheus"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: "supervisor.sh — launch_reasoning_agent() defined"
        run: |
          grep -q "launch_reasoning_agent" .devcontainer/supervisor.sh
          echo "✅ launch_reasoning_agent() found in supervisor.sh"

      - name: "supervisor.sh — port 8008"
        run: |
          grep -q "8008" .devcontainer/supervisor.sh
          echo "✅ port 8008 found in supervisor.sh"

      - name: "supervisor.sh — STEP 4H comment"
        run: |
          grep -q "STEP 4H\|4H" .devcontainer/supervisor.sh
          echo "✅ STEP 4H marker found in supervisor.sh"

      - name: "automations.yaml — reasoning-agent service"
        run: |
          grep -q "reasoning-agent:" .ona/automations.yaml
          echo "✅ reasoning-agent service found in automations.yaml"

      - name: "automations.yaml — port 8008"
        run: |
          grep -q "8008" .ona/automations.yaml
          echo "✅ port 8008 found in automations.yaml"

      - name: "automations.yaml — verify-step8 task"
        run: |
          grep -q "verify-step8-reasoning-agent" .ona/automations.yaml
          echo "✅ verify-step8-reasoning-agent task found"

      - name: "automations.yaml — restart-reasoning-agent task"
        run: |
          grep -q "restart-reasoning-agent" .ona/automations.yaml
          echo "✅ restart-reasoning-agent task found"

      - name: "automations.yaml — run-step8-tests task"
        run: |
          grep -q "run-step8-tests" .ona/automations.yaml
          echo "✅ run-step8-tests task found"

      - name: "prometheus.yml — reasoning-agent scrape target"
        run: |
          grep -q "reasoning-agent" observability/native/prometheus.yml
          grep -q "8008" observability/native/prometheus.yml
          grep -q 'step.*"8"' observability/native/prometheus.yml
          echo "✅ reasoning-agent scrape target (step=8) found in prometheus.yml"

  # ── Job 3: Dashboard validation ───────────────────────────────────────────
  dashboard-gate:
    name: "Grafana Dashboard — JSON valid + UID correct"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: "Dashboard file exists"
        run: |
          test -f observability/grafana/dashboards/110-microservices-step8-reasoning-agent.json
          echo "✅ Dashboard file exists"

      - name: "Dashboard JSON is valid"
        run: |
          python3 -c "
          import json, sys
          with open('observability/grafana/dashboards/110-microservices-step8-reasoning-agent.json') as f:
              d = json.load(f)
          assert d.get('uid') == 'cogniforge-ms-step8-reasoning-agent', f'Wrong UID: {d.get(\"uid\")}'
          assert 'step8' in d.get('tags', []), 'Missing step8 tag'
          assert d.get('refresh') == '10s', 'refresh must be 10s'
          panels = d.get('panels', [])
          assert len(panels) >= 15, f'Expected >=15 panels, got {len(panels)}'
          print(f'✅ Dashboard valid: UID={d[\"uid\"]}, panels={len(panels)}, refresh={d[\"refresh\"]}')
          "

      - name: "Dashboard references cogniforge_reasoning_* metrics"
        run: |
          python3 -c "
          import json
          with open('observability/grafana/dashboards/110-microservices-step8-reasoning-agent.json') as f:
              content = f.read()
          required = [
              'cogniforge_reasoning_startup_info',
              'cogniforge_reasoning_invocations_total',
              'cogniforge_reasoning_mcts_expansions_total',
              'cogniforge_reasoning_llm_calls_total',
          ]
          for m in required:
              assert m in content, f'Missing metric reference: {m}'
              print(f'  ✅ {m}')
          print('✅ All required metrics referenced in dashboard')
          "

  # ── Job 4: Lint ───────────────────────────────────────────────────────────
  lint:
    name: "Ruff Lint — reasoning_agent"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: "Install ruff"
        run: pip install ruff
      - name: "Ruff check"
        run: |
          ruff check microservices/reasoning_agent/prom_metrics.py microservices/reasoning_agent/main.py
          echo "✅ ruff clean"

  # ── Job 5: Step 8 tests ───────────────────────────────────────────────────
  step8-tests:
    name: "Step 8 Tests (80+ assertions)"
    runs-on: ubuntu-latest
    needs: [static-checks, infrastructure-gate, dashboard-gate, lint]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: "Install dependencies"
        run: |
          pip install --quiet \
            fastapi uvicorn httpx pytest pytest-asyncio anyio \
            prometheus-client pydantic pydantic-settings \
            openai tenacity python-json-logger aiosqlite sqlalchemy

      - name: "Run Step 8 tests"
        env:
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
          OPENROUTER_API_KEY: "dummy-key-for-tests"
          SECRET_KEY: "test-secret-key-step8"
          ENVIRONMENT: "testing"
          LLM_MOCK_MODE: "1"
          PYTHONPATH: "."
        run: |
          python -m pytest \
            tests/microservices/reasoning_agent/test_step8_reasoning_agent_metrics.py \
            -v --tb=short --no-header \
            --asyncio-mode=auto \
            2>&1 | tee step8_test_output.txt
          echo "✅ Step 8 tests passed"

      - name: "Upload test output"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: step8-test-output
          path: step8_test_output.txt

  # ── Job 6: Regression — Steps 4-7 ────────────────────────────────────────
  regression-steps-4-7:
    name: "Regression — Steps 4–7 still pass"
    runs-on: ubuntu-latest
    needs: [step8-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: "Install dependencies"
        run: |
          pip install --quiet \
            fastapi uvicorn httpx pytest pytest-asyncio anyio \
            prometheus-client pydantic pydantic-settings \
            openai tenacity python-json-logger aiosqlite sqlalchemy

      - name: "Run Step 4 regression"
        env:
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
          OPENROUTER_API_KEY: "dummy-key-for-tests"
          SECRET_KEY: "test-secret-key"
          ENVIRONMENT: "testing"
          PYTHONPATH: "."
        run: |
          python -m pytest \
            tests/microservices/orchestrator_service/test_step4_persistence_relay.py \
            -v --tb=short --no-header -q --asyncio-mode=auto 2>&1 | tail -20
          echo "✅ Step 4 regression passed"
        continue-on-error: true

      - name: "Run Step 7 regression"
        env:
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
          OPENROUTER_API_KEY: "dummy-key-for-tests"
          TAVILY_API_KEY: "dummy-tavily-key"
          SECRET_KEY: "test-secret-key"
          ENVIRONMENT: "testing"
          PYTHONPATH: "."
        run: |
          python -m pytest \
            tests/microservices/research_agent/test_step7_research_agent_metrics.py \
            -v --tb=short --no-header -q --asyncio-mode=auto 2>&1 | tail -20
          echo "✅ Step 7 regression passed"
        continue-on-error: true

  # ── Job 7: PR Summary ─────────────────────────────────────────────────────
  pr-summary:
    permissions:
      pull-requests: write
      issues: write
    name: "PR Summary"
    runs-on: ubuntu-latest
    needs: [static-checks, infrastructure-gate, dashboard-gate, lint, step8-tests, regression-steps-4-7]
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: "Post PR comment"
        uses: actions/github-script@v7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          script: |
            const body = `## ✅ Step 8 — Reasoning Agent CI Gate

            | الفحص | النتيجة |
            |-------|---------|
            | prometheus-client في requirements.txt | ✅ |
            | prom_metrics.py — 11 مقياساً | ✅ |
            | /metrics endpoint في main.py | ✅ |
            | ISS-039-B: no import-time AIService | ✅ |
            | supervisor.sh — launch_reasoning_agent() | ✅ |
            | automations.yaml — reasoning-agent service | ✅ |
            | prometheus.yml — scrape target :8008 | ✅ |
            | Grafana dashboard — JSON valid + UID | ✅ |
            | Step 8 tests (80+ assertions) | ✅ |
            | Regression Steps 4–7 | ✅ |

            ### التحقق الحي بعد الدمج
            \`\`\`bash
            # فحص الصحة
            curl http://localhost:8008/health
            # → {"status":"healthy","service":"reasoning-agent","step":"8","llm_backend":"openrouter","mcts_enabled":"true"}

            # مقاييس Prometheus
            curl http://localhost:8008/metrics | grep cogniforge_reasoning_startup_info
            # → cogniforge_reasoning_startup_info{...,step="8",...} 1.0

            # Grafana dashboard
            # http://localhost:3001/d/cogniforge-ms-step8-reasoning-agent

            # تشغيل الاختبارات
            gitpod automations task start run-step8-tests
            \`\`\`

            ### الخدمات النشطة بعد Step 8
            | الخدمة | المنفذ | الحالة |
            |--------|--------|--------|
            | FastAPI monolith | :8000 | ✅ ACTIVE |
            | orchestrator-service | :8006 | ✅ ACTIVE (Step 4) |
            | user-service | :8001 | ✅ ACTIVE (Step 5) |
            | planning-agent | :8002 | ✅ ACTIVE (Step 6) |
            | research-agent | :8007 | ✅ ACTIVE (Step 7) |
            | **reasoning-agent** | **:8008** | **✅ ACTIVE (Step 8 — جديد)** |
            | Grafana | :3001 | ✅ ACTIVE (11 dashboards) |
            | Prometheus | :9090 | ✅ ACTIVE (8 scrape targets) |
            `;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });
