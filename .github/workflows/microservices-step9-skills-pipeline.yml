name: "Step 9 — Skills Composition Pipeline CI Gate"

on:
  push:
    branches:
      - "feat/microservices-step9-skills-pipeline"
      - "main"
    paths:
      - "microservices/orchestrator_service/src/services/skills_pipeline.py"
      - "microservices/orchestrator_service/src/core/prom_metrics.py"
      - "microservices/orchestrator_service/src/api/routes.py"
      - "microservices/orchestrator_service/src/core/config.py"
      - "microservices/orchestrator_service/main.py"
      - "observability/native/prometheus.yml"
      - "observability/grafana/dashboards/120-microservices-step9-skills-pipeline.json"
      - ".ona/automations.yaml"
      - "tests/microservices/orchestrator_service/test_step9_skills_pipeline.py"
  pull_request:
    branches: [main]
    paths:
      - "microservices/orchestrator_service/**"
      - "tests/microservices/orchestrator_service/test_step9_skills_pipeline.py"

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  # ── Job 1: Static checks ──────────────────────────────────────────────────
  static-checks:
    name: "Static Checks — skills_pipeline.py"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: "Verify skills_pipeline.py exists"
        run: |
          test -f microservices/orchestrator_service/src/services/skills_pipeline.py \
            || (echo "❌ skills_pipeline.py missing" && exit 1)
          echo "✅ skills_pipeline.py exists"

      - name: "Verify run_skills_pipeline function"
        run: |
          grep -q "async def run_skills_pipeline" \
            microservices/orchestrator_service/src/services/skills_pipeline.py \
            || (echo "❌ run_skills_pipeline missing" && exit 1)
          echo "✅ run_skills_pipeline found"

      - name: "Verify X-Correlation-ID usage"
        run: |
          grep -q "X-Correlation-ID" \
            microservices/orchestrator_service/src/services/skills_pipeline.py \
            || (echo "❌ X-Correlation-ID not used" && exit 1)
          echo "✅ X-Correlation-ID used"

      - name: "Verify asyncio.gather for parallel calls"
        run: |
          grep -q "asyncio.gather" \
            microservices/orchestrator_service/src/services/skills_pipeline.py \
            || (echo "❌ asyncio.gather missing — planning+research must run in parallel" && exit 1)
          echo "✅ asyncio.gather found"

      - name: "Verify fallback on ConnectError"
        run: |
          grep -q "ConnectError" \
            microservices/orchestrator_service/src/services/skills_pipeline.py \
            || (echo "❌ ConnectError fallback missing" && exit 1)
          echo "✅ ConnectError fallback found"

      - name: "Verify /compose endpoint in routes.py"
        run: |
          grep -q '"/compose"' microservices/orchestrator_service/src/api/routes.py \
            || grep -q "'/compose'" microservices/orchestrator_service/src/api/routes.py \
            || (echo "❌ /compose endpoint missing in routes.py" && exit 1)
          echo "✅ /compose endpoint found"

      - name: "Verify pipeline metrics in prom_metrics.py"
        run: |
          for metric in \
            cogniforge_pipeline_invocations_total \
            cogniforge_pipeline_duration_seconds \
            cogniforge_pipeline_skill_calls_total \
            cogniforge_pipeline_errors_total \
            cogniforge_pipeline_active_gauge; do
            grep -q "$metric" microservices/orchestrator_service/src/core/prom_metrics.py \
              || (echo "❌ $metric missing in prom_metrics.py" && exit 1)
            echo "✅ $metric found"
          done

      - name: "Verify pipeline_enabled in startup_info"
        run: |
          grep -q "pipeline_enabled" microservices/orchestrator_service/src/core/prom_metrics.py \
            || (echo "❌ pipeline_enabled missing in prom_metrics.py" && exit 1)
          grep -q "pipeline_enabled=True" microservices/orchestrator_service/main.py \
            || (echo "❌ pipeline_enabled=True missing in main.py" && exit 1)
          echo "✅ pipeline_enabled confirmed"

      - name: "Verify correct service ports in config.py"
        run: |
          grep -q '"8002"' microservices/orchestrator_service/src/core/config.py \
            || (echo "❌ planning-agent port 8002 missing in config.py" && exit 1)
          grep -q '"8007"' microservices/orchestrator_service/src/core/config.py \
            || (echo "❌ research-agent port 8007 missing in config.py" && exit 1)
          grep -q '"8008"' microservices/orchestrator_service/src/core/config.py \
            || (echo "❌ reasoning-agent port 8008 missing in config.py" && exit 1)
          echo "✅ Service ports correct"

  # ── Job 2: Prometheus config gate ────────────────────────────────────────
  prometheus-gate:
    name: "Prometheus Config Gate"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: "Verify skills-pipeline scrape job"
        run: |
          grep -q "skills-pipeline" observability/native/prometheus.yml \
            || (echo "❌ skills-pipeline job missing in prometheus.yml" && exit 1)
          echo "✅ skills-pipeline job found"

      - name: "Verify step 9 label"
        run: |
          python3 -c "
          content = open('observability/native/prometheus.yml').read()
          idx = content.find('skills-pipeline')
          assert idx != -1, 'skills-pipeline job not found'
          snippet = content[idx:idx+400]
          assert '\"9\"' in snippet or \"'9'\" in snippet, 'step=9 label missing'
          print('✅ step=9 label found')
          "

  # ── Job 3: Grafana dashboard gate ─────────────────────────────────────────
  dashboard-gate:
    name: "Grafana Dashboard Gate"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: "Verify dashboard file exists"
        run: |
          test -f observability/grafana/dashboards/120-microservices-step9-skills-pipeline.json \
            || (echo "❌ Step 9 dashboard missing" && exit 1)
          echo "✅ Dashboard file exists"

      - name: "Validate dashboard JSON"
        run: |
          python3 -c "
          import json
          data = json.load(open('observability/grafana/dashboards/120-microservices-step9-skills-pipeline.json'))
          assert data.get('uid') == 'cogniforge-ms-step9-pipeline', f'Wrong UID: {data.get(\"uid\")}'
          assert len(data.get('panels', [])) >= 6, 'Too few panels'
          assert data.get('refresh') == '10s', 'refresh must be 10s'
          print(f'✅ Dashboard valid: {len(data[\"panels\"])} panels, uid={data[\"uid\"]}')
          "

      - name: "Verify pipeline metrics in dashboard"
        run: |
          python3 -c "
          content = open('observability/grafana/dashboards/120-microservices-step9-skills-pipeline.json').read()
          metrics = [
            'cogniforge_pipeline_invocations_total',
            'cogniforge_pipeline_duration_seconds',
            'cogniforge_pipeline_skill_calls_total',
          ]
          for m in metrics:
            assert m in content, f'❌ {m} missing from dashboard'
            print(f'✅ {m}')
          "

  # ── Job 4: Lint ───────────────────────────────────────────────────────────
  lint:
    name: "Ruff Lint"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff --quiet
      - name: "Lint skills_pipeline.py"
        run: |
          ruff check microservices/orchestrator_service/src/services/skills_pipeline.py \
            || (echo "❌ Ruff errors in skills_pipeline.py" && exit 1)
          echo "✅ skills_pipeline.py lint clean"
      - name: "Lint prom_metrics.py"
        run: |
          ruff check microservices/orchestrator_service/src/core/prom_metrics.py \
            || (echo "❌ Ruff errors in prom_metrics.py" && exit 1)
          echo "✅ prom_metrics.py lint clean"

  # ── Job 5: Step 9 tests ───────────────────────────────────────────────────
  step9-tests:
    name: "Step 9 Tests (85+ assertions)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: "Install test dependencies"
        run: |
          pip install pytest pytest-asyncio httpx pydantic pydantic-settings \
            fastapi sqlmodel asyncpg aiosqlite prometheus-client --quiet
      - name: "Run Step 9 tests"
        env:
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
          ORCHESTRATOR_DATABASE_URL: "sqlite+aiosqlite:///:memory:"
          OPENROUTER_API_KEY: "dummy-key-for-tests"
          SECRET_KEY: "test-secret-key-for-step9-ci"
          ENVIRONMENT: "testing"
          CODESPACES: "true"
        run: |
          python -m pytest \
            tests/microservices/orchestrator_service/test_step9_skills_pipeline.py \
            -v --tb=short --no-header 2>&1 | tee step9_results.txt
          tail -5 step9_results.txt

  # ── Job 6: Regression — Steps 4-8 ────────────────────────────────────────
  regression-steps-4-8:
    name: "Regression — Steps 4–8"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: "Install dependencies"
        run: |
          pip install pytest pytest-asyncio httpx pydantic pydantic-settings \
            fastapi sqlmodel asyncpg aiosqlite prometheus-client --quiet
      - name: "Run Step 4 regression"
        env:
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
          ORCHESTRATOR_DATABASE_URL: "sqlite+aiosqlite:///:memory:"
          SECRET_KEY: "test-secret-key"
          ENVIRONMENT: "testing"
        run: |
          python -m pytest tests/microservices/orchestrator_service/test_step4_persistence_relay.py \
            -q --tb=short --no-header 2>&1 | tail -5
      - name: "Run Step 8 regression"
        env:
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
          OPENROUTER_API_KEY: "dummy"
          SECRET_KEY: "test-secret-key"
          ENVIRONMENT: "testing"
          LLM_MOCK_MODE: "1"
        run: |
          python -m pytest tests/microservices/reasoning_agent/test_step8_reasoning_agent_metrics.py \
            -q --tb=short --no-header 2>&1 | tail -5

  # ── Job 7: PR Summary ─────────────────────────────────────────────────────
  pr-summary:
    name: "PR Summary"
    runs-on: ubuntu-latest
    needs: [static-checks, prometheus-gate, dashboard-gate, lint, step9-tests, regression-steps-4-8]
    if: always() && github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - name: "Post PR comment"
        uses: actions/github-script@v7
        with:
          script: |
            const results = {
              'Static Checks': '${{ needs.static-checks.result }}',
              'Prometheus Gate': '${{ needs.prometheus-gate.result }}',
              'Dashboard Gate': '${{ needs.dashboard-gate.result }}',
              'Lint': '${{ needs.lint.result }}',
              'Step 9 Tests': '${{ needs.step9-tests.result }}',
              'Regression 4-8': '${{ needs.regression-steps-4-8.result }}',
            };
            const icon = r => r === 'success' ? '✅' : r === 'skipped' ? '⏭️' : '❌';
            const rows = Object.entries(results).map(([k,v]) => `| ${k} | ${icon(v)} ${v} |`).join('\n');
            const body = `## Step 9 — Skills Composition Pipeline CI Results\n\n| Job | Status |\n|-----|--------|\n${rows}\n\n**التحقق الحي بعد الدمج:**\n\`\`\`bash\ncurl -X POST http://localhost:8006/compose \\\n  -H 'Content-Type: application/json' \\\n  -d '{"query": "اشرح قانون نيوتن الثاني"}'\n\ncurl http://localhost:8006/metrics | grep cogniforge_pipeline\n\`\`\`\n\n**Grafana:** http://localhost:3001/d/cogniforge-ms-step9-pipeline`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });
