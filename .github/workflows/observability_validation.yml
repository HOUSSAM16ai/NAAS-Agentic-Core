name: observability-validation

on:
  pull_request:
    branches: [main]
    paths:
      - "observability/**"
      - "app/telemetry/**"
      - "app/api/routers/observability.py"
      - "app/kernel.py"
      - "requirements-observability.txt"
      - ".devcontainer/start_observability.sh"
      - ".github/workflows/observability_validation.yml"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: observability-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  static-validation:
    name: static-validation
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      # ---- 1. Compose file is syntactically valid ------------------------
      - name: Validate docker-compose.observability.yml
        shell: bash
        run: |
          set -euo pipefail
          docker compose -f observability/docker-compose.observability.yml config >/dev/null
          echo "✅ Compose syntax OK"

      # ---- 2. Required config files exist + parse ------------------------
      - name: Set up Python (for YAML / JSON parse)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate stack configs (YAML/JSON parse)
        shell: bash
        run: |
          set -euo pipefail
          pip install --quiet pyyaml
          python - <<'PY'
          import json, sys, yaml
          from pathlib import Path
          required_yaml = [
              "observability/otel-collector/otel-collector-config.yml",
              "observability/tempo/tempo-config.yml",
              "observability/loki/loki-config.yml",
              "observability/prometheus/prometheus.yml",
              "observability/grafana/provisioning/datasources/datasources.yml",
              "observability/grafana/provisioning/dashboards/dashboards.yml",
          ]
          required_json = list(Path("observability/grafana/dashboards").glob("*.json"))
          missing = [p for p in required_yaml if not Path(p).exists()]
          if missing:
              print(f"::error::Missing config files: {missing}")
              sys.exit(1)
          if not required_json:
              print("::error::No Grafana dashboards under observability/grafana/dashboards/")
              sys.exit(1)
          for p in required_yaml:
              try:
                  yaml.safe_load(Path(p).read_text(encoding="utf-8"))
              except Exception as e:
                  print(f"::error::YAML parse failed for {p}: {e}")
                  sys.exit(1)
          for p in required_json:
              try:
                  data = json.loads(p.read_text(encoding="utf-8"))
                  if "panels" not in data and "uid" not in data:
                      print(f"::warning::{p} looks unusual (no panels/uid)")
              except Exception as e:
                  print(f"::error::JSON parse failed for {p}: {e}")
                  sys.exit(1)
          print(f"✅ Validated {len(required_yaml)} YAML + {len(required_json)} JSON files")
          PY

      # ---- 3. otel_setup.py is import-clean ------------------------------
      - name: Lint observability Python
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install "ruff>=0.6,<1"
          ruff check app/telemetry/otel_setup.py app/telemetry/path_observer.py
          python -m py_compile app/telemetry/otel_setup.py app/telemetry/path_observer.py
          echo "✅ Observability Python is lint-clean and compiles"

      # ---- 4. Path observer wiring is intact -----------------------------
      - name: Verify path_observer wiring on live anchors
        shell: bash
        run: |
          set -euo pipefail
          # Customer + Admin routers must import + call open_ws_turn / close_ws_turn
          for router in app/api/routers/customer_chat.py app/api/routers/admin.py; do
            grep -q "from app.telemetry.path_observer import .*open_ws_turn" "$router" \
              || { echo "::error::$router missing open_ws_turn import"; exit 1; }
            grep -q "open_ws_turn(" "$router" \
              || { echo "::error::$router missing open_ws_turn() call"; exit 1; }
            grep -q "close_ws_turn(" "$router" \
              || { echo "::error::$router missing close_ws_turn() call"; exit 1; }
          done
          # OTel setup must be wired into kernel
          grep -q "setup_otel" app/kernel.py \
            || { echo "::error::app/kernel.py missing setup_otel wiring"; exit 1; }
          grep -q "instrument_fastapi_app" app/kernel.py \
            || { echo "::error::app/kernel.py missing instrument_fastapi_app wiring"; exit 1; }
          # Mark fallback in orchestrator client
          grep -q "mark_fallback_used" app/infrastructure/clients/orchestrator_client.py \
            || { echo "::error::orchestrator_client missing mark_fallback_used"; exit 1; }
          echo "✅ All wiring tokens present"

      # ---- 5. CLAUDE.md + .memory have observability section --------------
      - name: Verify documentation locks
        shell: bash
        run: |
          set -euo pipefail
          grep -q "Observability and Runtime Governance\|Autonomous Runtime Observability OS\|Grafana Observability Stack" CLAUDE.md \
            || { echo "::error::CLAUDE.md missing observability section"; exit 1; }
          test -s .memory/observability-topology.md \
            || { echo "::error::.memory/observability-topology.md missing or empty"; exit 1; }
          echo "✅ Documentation locks present"
