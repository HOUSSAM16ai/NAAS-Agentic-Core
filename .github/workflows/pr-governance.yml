---
# D-270 L1/L3 — الدليل قبل الدمج، وعنوان الدفع عقد.
#
# ⚠️ `pull_request_target` مقصود: يجب أن يعمل الفحص على دفعات الـforks أيضاً، وهناك
# لا يملك `pull_request` رمزاً قابلاً للقراءة من الـAPI. والأمان مبنيٌّ لا مأمول:
#
#   ① لا `checkout` لكود الدفعة إطلاقاً — يُجلَب **الأساس** (`base.sha`) وحده، فما
#      يُنفَّذ هو نصوصٌ موثوقة من الفرع الهدف لا من مساهمةٍ خارجية.
#   ② لا `secrets: inherit` ولا أيّ سرٍّ في البيئة — الصلاحيات للقراءة فقط.
#   ③ الوصف والعنوان يُقرآن من حمولة الحدث، والملفّات من REST — لا تنفيذ لشيءٍ
#      من الفرع الوارد.
#
# **إعفاء البوتات مقصود ومُعلَن**: dependabot وrelease-please يكتبان وصفهما بأنفسهما
# ولا يستطيعان اتّباع قالب `HUMAN:` — فبلا الإعفاء تُحمَّر كلّ دفعةٍ آلية بسببٍ لا
# يستطيع أحدٌ إصلاحه، وهو تعريف الفارض الذي يُدرَّب الناس على تجاوزه.

name: pr-governance

on:
    pull_request_target:
        types: [opened, edited, reopened, ready_for_review, synchronize]

permissions:
    contents: read
    pull-requests: read
    issues: read

concurrency:
    group: pr-governance-${{ github.event.pull_request.number }}
    cancel-in-progress: true

jobs:
    validate-description:
        name: الدليل قبل الدمج (D-270 L1/L3)
        # يعمل على المسوّدات أيضاً: أن يرى المساهم الفحص أخضر قبل طلب المراجعة
        # أفضل من أن يكتشفه بعدها.
        if: github.event.pull_request.user.type != 'Bot'
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - name: Checkout trusted scripts (base ref only)
              uses: actions/checkout@v5
              with:
                  ref: ${{ github.event.pull_request.base.sha }}
                  persist-credentials: false

            - name: Set up Python
              uses: actions/setup-python@v6
              with:
                  python-version: "3.12"

            - name: Collect changed paths
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  set -euo pipefail
                  gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" \
                      --paginate --jq '.[].filename' > /tmp/pr-files.txt
                  echo "ملفّات متغيّرة: $(wc -l < /tmp/pr-files.txt)"

            - name: Validate PR description
              env:
                  GITHUB_TOKEN: ${{ github.token }}
                  GITHUB_REPOSITORY: ${{ github.repository }}
                  PR_TITLE: ${{ github.event.pull_request.title }}
                  PR_BODY: ${{ github.event.pull_request.body }}
              run: |
                  set -euo pipefail
                  printf '%s' "$PR_BODY" > /tmp/pr-body.md
                  python .github/scripts/validate_pr_description.py \
                      --title "$PR_TITLE" \
                      --body-file /tmp/pr-body.md \
                      --files-file /tmp/pr-files.txt
