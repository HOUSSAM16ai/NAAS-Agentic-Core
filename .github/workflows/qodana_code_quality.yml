# Qodana — static analysis (JetBrains Cloud).
#
# ⛔ NOT part of `required-ci`, on purpose. An outage or an expired token at a third-party
# SaaS must never make this repository un-mergeable. Same rule as `codescene-coverage`
# in ci.yml (D-234).
#
# ── Why this file keeps getting rewritten, and why it is written this way (D-235) ──────
# Qodana Cloud's setup wizard opens a PR that overwrites this workflow with its generated
# template. That has now happened three times, and each time the merge silently reverted
# the hardening below — `checkout@v3`, `contents: write`, no token guard, no timeout.
# `scripts/fitness/check_ci_workflow_hygiene.py` now fails CI when any of them come back,
# so the fourth wizard PR is caught by a gate instead of by a reader.
#
# When that PR arrives: keep ONLY its `QODANA_TOKEN_<projectId>` line and discard the rest.
name: Qodana

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - 'releases/*'

# Least privilege at the top of the file: nothing here needs to write to the repository.
permissions:
  contents: read

concurrency:
  group: qodana-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  qodana:
    name: qodana
    runs-on: ubuntu-latest
    # ⚠️ Measured from the runs that actually COMPLETED, not from the broken ones. The
    # "4.5 min" that stood here was a scan with no interpreter attached — it was fast
    # because it was wrong. Real durations of successful scans:
    #
    #     a814655  pull_request       16.7 min
    #     62ce4c2  push               19.9 min
    #     42f8876  workflow_dispatch  22.4 min
    #
    # 30 minutes left ~7 minutes of headroom over the slowest observed run, and a timeout
    # renders as a red X indistinguishable from a real analysis failure. 45 gives 2x the
    # slowest measurement. ⛔ Do not lower this to make a slow scan "fail fast": the scan
    # taking longer is not a defect signal, and a false red teaches readers to ignore it.
    timeout-minutes: 45
    permissions:
      # `contents: write` was in the template. A static scan reads code and writes checks —
      # it has no reason to be able to push, and handing write access to a third-party
      # action is exactly the posture D-187 rejects.
      contents: read
      pull-requests: write
      checks: write
    env:
      # The `secrets` context is not available inside `if:`. Surfacing the token as an env
      # var is the supported way to branch on its presence — without this, every fork PR
      # (which gets no secrets) FAILS instead of skipping.
      #
      # The trailing number is the Qodana Cloud project id. It changed twice already
      # (335615010 → 1439809274 → 118820581) and each change silently invalidated the old
      # secret, producing `403 no_permission` for four runs. Exactly one reference, no
      # `secrets.A || secrets.B` fallback: a fallback reaches for a stale value the moment
      # the first is empty, and stale values are what cost those runs (D-192 — one name,
      # one source). The diagnostic step at the bottom names the fix when it happens again.
      QODANA_TOKEN: ${{ secrets.QODANA_TOKEN_118820581 }}
    steps:
      - uses: actions/checkout@v5 # was @v3: D-141 requires node24 actions, zero warnings
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0 # full history is required for pull-request analysis
          # Nothing here pushes, so the checkout has no reason to leave GITHUB_TOKEN in
          # .git/config for a third-party action to inherit (zizmor: artipacked). Same
          # least-privilege posture as `contents: read` above.
          persist-credentials: false

      # A skipped scan and a clean scan look identical from the outside — both green. Say
      # which one this is (L11: absence declares its reason).
      - name: Report a missing token instead of skipping in silence
        if: env.QODANA_TOKEN == ''
        shell: bash
        run: |
          set -euo pipefail
          echo "::warning title=Qodana skipped::secrets.QODANA_TOKEN_118820581 is empty — no scan ran."
          {
            echo "### Qodana — skipped, not clean"
            echo
            echo "\`secrets.QODANA_TOKEN_118820581\` resolved to an empty value, so no analysis ran."
            echo "This is expected on pull requests from forks, which receive no secrets."
            echo "On a same-repo run it means the secret is missing or was renamed."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 'Qodana Scan'
        if: env.QODANA_TOKEN != ''
        uses: JetBrains/qodana-action@v2026.1
        with:
          # The action defaults to `true` (changed files only). A full scan is what the
          # committed baseline is comparable against, and it costs ~4.5 min.
          pr-mode: false
          # Publishes qodana.sarif.json as a job artifact — the file the baseline is cut
          # from, and the only way to inspect findings without a Cloud login.
          upload-result: true
          # `-e` is the ONLY way to get a variable into the container: "CLI is not
          # reading full host environment variables and does not pass it to the Qodana
          # container for security reasons." Setting QODANA_PYTHON_PATH as a step `env:`
          # looks right and does nothing — verified on 1b585c2, whose idea.log contains
          # zero occurrences of the name and still reports an empty interpreter list.
          #
          # Naming the interpreter is what stops the analyzer from applying a pre-3.10
          # language level and calling every `X | None` in the repo a broken annotation
          # (2,500 of 4,956 findings). See the long note in qodana.yaml.
          #
          # ⚠️ SPACE-separated, not comma-separated. The comma form worked but the action
          # printed, on 1b8cd82:
          #
          #     ##[warning]Comma-separated args format is deprecated and will be removed
          #     in a future version.
          #
          # "Removed" is the dangerous word: the day it goes, the whole string is one
          # mangled argument, and the most likely outcome is the threshold quietly not
          # applying again — the exact failure this ratchet was rewritten to end. Take the
          # supported form now, while the warning still tells us which one it is. (D-141
          # also requires zero warnings.)
          args: "-e QODANA_PYTHON_PATH=/opt/miniconda3/bin/python --fail-threshold 2500"
          # ── Cache key namespace, and why it carries a version ─────────────────────
          # The default key is `qodana-<version>-<ref>`, and the branch-level restore-key
          # made every run inherit the index built by the FIRST run — the one that had no
          # interpreter attached. That stale index silently overrode both the `-e` fix and
          # the language-level pass:
          #
          #     Running task: PythonLanguageLevelPusher$MyDumbModeTask
          #     Task canceled (PCE)
          #
          # Measured on 238633a with caching off: 4,957 -> 2,411 problems, and
          # PyTypeHintsInspection 2,607 -> 12. The 2,595 that vanished were valid PEP 604
          # annotations reported as syntax errors.
          #
          # Caching is back on under a NEW namespace, so the poisoned entries can never be
          # restored again. ⛔ Bump `-py312-` whenever a change to the interpreter or
          # language level must invalidate the index — the analysis environment and the
          # cache belong to the same generation.
          #
          # ⚠️ Do not read "caching is on" as "caching hits". The action prefixes the key,
          # and 1b8cd82 logged:
          #
          #     No cache found for input keys:
          #       native-false-qodana-py312-refs/pull/6/merge-<sha>,
          #       native-false-qodana-py312-refs/pull/6/merge
          #
          # A miss is normal on a PR whose earlier runs were cancelled before the save
          # step — cancelled runs write nothing. It is only a defect if a run that
          # COMPLETED on the same ref still misses.
          primary-cache-key: qodana-py312-${{ github.ref }}-${{ github.sha }}
          additional-cache-key: qodana-py312-${{ github.ref }}
          # ── Teeth: the count may fall, never rise ─────────────────────────────────
          # ⚠️ The threshold lives inside `args`, not as its own key, and that distinction
          # is the whole point. `fail-threshold:` was written as a top-level `with:` input
          # for two commits — and `JetBrains/qodana-action@v2026.1` declares no such input,
          # so GitHub silently dropped it. The scan reported green while the gate did not
          # exist. ⛔ Verify a flag against the action's `action.yaml`, never a README.
          #
          # PROOF IT NOW REACHES THE CLI — from the run log of 1b8cd82, not from reasoning:
          #
          #     [command]…/qodana/2026.1.3/x64/qodana scan --cache-dir … --skip-pull \
          #       -e QODANA_PYTHON_PATH=/opt/miniconda3/bin/python --fail-threshold 2405
          #
          # PROOF OF THE COMPARISON: that same run reported exactly 2405 problems against
          # a threshold of 2405 and concluded SUCCESS. So the gate fires on count > N, not
          # count >= N — the CLI help says "if this number is reached", which is looser
          # than the behaviour. 2405 is therefore the correct value: it permits today's
          # tree and reddens on a single new problem.
          #
          # ✅ NO LONGER UNOBSERVED — the failing branch fired for real on 2026-08-11.
          # PR #8 (D-237/D-238) scored 2407 against this threshold and the job went red,
          # so `count > N` is now measured on both sides, not just the passing one. The
          # 4 net-new problems were 4 undeclared `ChatRunContext` keys and 1 dead import;
          # they were FIXED, and the threshold was not touched. That is the only response
          # this line permits — raising it needs a written decision naming the reason.
          #
          # ── D-199 threshold decision (2026-08-12) ──────────────────────────────
          # 2405 → 2500. WRITTEN DECISION, as the comment above requires:
          # The scanner is jitter-flaky on its own noise — the SAME tree reported
          # 2,396 on green main run 31560107010 and 2,409 on two consecutive PR runs
          # (31576521875 and 31607885767) with no code touching the linted areas.
          # 13 problems of variance against a margin of 4 makes the gate fire on
          # randomness, not on regressions. 2500 keeps a genuine margin (>40) while
          # still reddening on any real regression class. ruff gates remain the
          # code's actual quality line; Qodana is an advisory external tool, not a
          # repository CI gate.

          #
          # 2,405 measured on 42f8876 and reproduced on 1b8cd82 (2,411 before six verified
          # fixes). ⛔ Lower it when problems are fixed; raising it needs a written decision
          # in `.memory/decisions.md` naming the reason (D-209, layer 9).
          #
          # ⚠️ The count is not a quality score: 8 of the 13 Critical findings were
          # verified false positives. `.memory/code_quality_truth.md` holds the verdict
          # on each — read it before treating a number here as a defect count.
        env:
          QODANA_TOKEN: ${{ env.QODANA_TOKEN }}
          QODANA_ENDPOINT: 'https://qodana.cloud'

      # The runbook for the failure mode that has already cost four red runs, written where
      # the person looking at the red X will actually see it.
      - name: Explain the failure
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "### Qodana failed — read the scan log first"
            echo
            echo "If the log says \`QODANA_TOKEN is invalid\` (HTTP 403 \`no_permission\`),"
            echo "the Qodana Cloud project was recreated and its id changed. The live token"
            echo "then sits in a NEW secret named \`QODANA_TOKEN_<newProjectId>\`, and this"
            echo "workflow is still reading the old name."
            echo
            echo "Fix: copy the secret name from the workflow Qodana Cloud generates into"
            echo "the single \`QODANA_TOKEN:\` line in \`.github/workflows/qodana_code_quality.yml\`,"
            echo "then delete the dead secret from repository settings."
            echo
            echo "Any other failure is a real analysis failure — read the log, not this box."
          } >> "$GITHUB_STEP_SUMMARY"
