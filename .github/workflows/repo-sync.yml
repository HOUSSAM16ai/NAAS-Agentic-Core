name: Sync to other repository

# Runs on every push to main in BOTH repositories and replicates the pushed
# content into the OTHER repository, keeping the two repos 100% identical.
#
# Direction is determined dynamically by which repository the run belongs to:
#   Houssam-lab/NAAS-Agentic-Core  -> pushes to bakabala27-svg/NAAS-Agentic-Core
#   bakabala27-svg/NAAS-Agentic-Core -> pushes to Houssam-lab/NAAS-Agentic-Core

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out current repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync into the other repository
        env:
          MIRROR_PAT: ${{ secrets.MIRROR_PAT }}
          UPSTREAM_PAT: ${{ secrets.UPSTREAM_PAT }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REPOSITORY" = "Houssam-lab/NAAS-Agentic-Core" ]; then
            PEER="bakabala27-svg/NAAS-Agentic-Core"
            PAT="${MIRROR_PAT}"
            IDENTITY="bakabala27-svg"
          else
            PEER="Houssam-lab/NAAS-Agentic-Core"
            PAT="${UPSTREAM_PAT}"
            IDENTITY="bakabala27-svg"
          fi

          if [ -z "$PAT" ]; then
            echo "Error: Authentication token (PAT) is missing or empty. Please check repository secrets."
            exit 1
          fi

          git config user.name "$IDENTITY"
          git config user.email "$IDENTITY@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${PAT}@github.com/${PEER}.git"
          git push origin "HEAD:main" --force
