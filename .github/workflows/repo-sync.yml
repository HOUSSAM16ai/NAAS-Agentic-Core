name: Sync to other repository
# Runs on every push to main in BOTH repositories and replicates the pushed
# content into the OTHER repository, keeping the two repos 100% identical.
#
# Direction is determined dynamically by which repository the run belongs to:
#   Houssam-lab/NAAS-Agentic-Core  -> pushes to bakabala27-svg/NAAS-Agentic-Core (uses secrets.MIRROR_PAT)
#   bakabala27-svg/NAAS-Agentic-Core -> pushes to Houssam-lab/NAAS-Agentic-Core (uses secrets.UPSTREAM_PAT)
#
# Auth strategy (v4): The checkout action with an explicit token is the ONLY
# authentication method proven to pass GitHub Actions runner identity checks.
# To push to the PEER repository from the same job, we rewrite origin's URL to
# the peer's URL but KEEP the PAT in the checkout-provided Authorization
# header (git applies the header to the remote named "origin" via the
# http.<base>.extraheader config checkout sets), and point the header base at
# the peer URL by re-issuing the header config against the peer URL. This is
# achieved with url.insteadOf + an explicit credential helper: the PAT is
# passed through git's credential system rather than via x-access-token URLs,
# which is what the runner rejects for third-party PATs.
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out current repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.MIRROR_PAT }}

      - name: Replicate main into the peer repository
        env:
          MIRROR_PAT: ${{ secrets.MIRROR_PAT }}
          UPSTREAM_PAT: ${{ secrets.UPSTREAM_PAT }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REPOSITORY" = "Houssam-lab/NAAS-Agentic-Core" ]; then
            PEER="bakabala27-svg/NAAS-Agentic-Core"
            PAT="${MIRROR_PAT}"
          else
            PEER="Houssam-lab/NAAS-Agentic-Core"
            PAT="${UPSTREAM_PAT}"
          fi
          if [ -z "$PAT" ]; then
            echo "Error: peer authentication token is missing. Check repository secrets."
            exit 1
          fi
          IDENTITY="bakabala27-svg"
          git config user.name "${IDENTITY}"
          git config user.email "${IDENTITY}@users.noreply.github.com"

          # Point origin at the peer URL. The checkout action registered an
          # Authorization header with the PAT for the base URL origin used;
          # keep that header valid by clearing checkout's extraheader AFTER we
          # change the URL, then attach the PAT via a plain credential helper
          # so git sends Basic auth as the real token owner (not the bot).
          git remote set-url origin "https://github.com/${PEER}.git"
          # Credential helper returns the PAT for any github.com push URL.
          git config --global "credential.helper" '!f() { echo username=x-access-token; echo password='"${PAT}"'; }; f'
          # Remove the checkout-provided header for origin so git falls back
          # to the credential helper for the new URL.
          git config --unset "http.https://github.com/.extraheader" || true
          git config --unset "http.https://github.com/${PEER}/.extraheader" || true

          git push origin HEAD:main --force
