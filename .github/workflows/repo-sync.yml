name: Sync to other repository
# Runs on every push to main in BOTH repositories and replicates the pushed
# content into the OTHER repository, keeping the two repos 100% identical.
#
# Direction is determined dynamically by which repository the run belongs to:
#   Houssam-lab/NAAS-Agentic-Core  -> pushes to bakabala27-svg/NAAS-Agentic-Core (uses secrets.MIRROR_PAT)
#   bakabala27-svg/NAAS-Agentic-Core -> pushes to Houssam-lab/NAAS-Agentic-Core (uses secrets.UPSTREAM_PAT)
#
# Auth strategy (v6): the peer push is authenticated by a git credential helper
# that sends the peer PAT as Basic auth, so git acts as the real token owner and
# not as github-actions[bot] (x-access-token URLs alone are rejected by the
# runner). The checkout token is deliberately independent of that: it only has
# to read THIS repository, so it falls back through the peer secrets to
# github.token. v5 hardcoded MIRROR_PAT there and every run in the repository
# that owns UPSTREAM_PAT died at checkout with "Input required and not supplied:
# token" — before any sync logic executed. A retry loop on the push absorbs
# transient "cannot lock ref" conflicts when both sides run simultaneously.
#
# When the peer PAT is absent the job does NOT fail: it skips with a named
# reason in the log and the run summary (D-206 L11 — absence is declared, never
# silent). Mirroring resumes by itself once the secret is added.
#
# v7 (ISS-197) classifies the push rejection instead of retrying it blindly. The
# retry loop exists for ONE named reason — the "cannot lock ref" race when both
# sides sync at once — but it re-ran on every failure, the peer's branch
# protection included, and no amount of retrying changes a repository setting.
# That burned ~60s of runner time per push and then reported "failed after 5
# attempts" with no cause and no drift figure, on every commit since 2026-08-22
# while the mirror silently fell 60 commits behind. Now a deterministic
# rejection stops on the first attempt and reports the rule the remote actually
# named plus the measured drift; transient failures still get all five attempts.
# The classification lives in scripts/ci/repo_sync_classify.py so it is tested
# against the real recorded rejection instead of only in production.
#
# A blocked push is still a FAILURE, not a skip — unlike the absent PAT above.
# A missing secret is a deployment fact; a rejected push means the two repos
# have actually diverged, and hiding that would lose 60 commits quietly (§0 —
# no silent failure).
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out current repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # The checkout token is NOT what authenticates the peer push — the sync
          # step below rewrites origin and re-authenticates through its own
          # credential helper. Hardcoding MIRROR_PAT here made checkout abort with
          # "Input required and not supplied: token" in the repository that owns
          # UPSTREAM_PAT instead, killing the job before the real logic ran. The
          # fallback keeps checkout working in both repositories and with neither.
          token: ${{ secrets.MIRROR_PAT || secrets.UPSTREAM_PAT || github.token }}

      - name: Replicate main into the peer repository
        env:
          MIRROR_PAT: ${{ secrets.MIRROR_PAT }}
          UPSTREAM_PAT: ${{ secrets.UPSTREAM_PAT }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REPOSITORY" = "Houssam-lab/NAAS-Agentic-Core" ]; then
            PEER="bakabala27-svg/NAAS-Agentic-Core"
            PAT="${MIRROR_PAT}"
          else
            PEER="Houssam-lab/NAAS-Agentic-Core"
            PAT="${UPSTREAM_PAT}"
          fi
          # Declared absence, not silence (D-206 L11). A peer PAT that was never
          # configured is a deployment fact, not a defect in this push — failing
          # every commit for it trains people to ignore the job. So the skip is
          # loud: it names the missing secret in the log AND in the run summary,
          # so an unconfigured mirror is visible rather than merely quiet. Sync
          # resumes on its own the moment the secret exists.
          if [ -z "$PAT" ]; then
            NOTICE="peer sync disabled: no PAT configured for ${PEER}"
            echo "::notice::${NOTICE} — add the peer push secret to enable mirroring."
            {
              echo "### ⏭️ ${NOTICE}"
              echo ""
              echo "Nothing was pushed to \`${PEER}\`. Add the peer push token to"
              echo "repository secrets and mirroring resumes on the next commit."
            } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
            exit 0
          fi
          IDENTITY="bakabala27-svg"
          git config user.name "${IDENTITY}"
          git config user.email "${IDENTITY}@users.noreply.github.com"

          # Point origin at the peer URL and authenticate with the PAT via a
          # plain credential helper (Basic auth as the token owner).
          git remote set-url origin "https://github.com/${PEER}.git"
          git config --global "credential.helper" '!f() { echo username=x-access-token; echo password='"${PAT}"'; }; f'
          git config --unset "http.https://github.com/.extraheader" || true
          git config --unset "http.https://github.com/${PEER}/.extraheader" || true

          # Retry the push to tolerate transient lock-ref races between the two
          # simultaneous sync workflows — and ONLY those. Every failure is
          # classified first; a deterministic rejection breaks out immediately,
          # because sleeping ten seconds does not change a branch protection rule.
          PUSH_LOG="$(mktemp)"
          CLASSIFICATION="unknown"
          RULES=""
          for attempt in 1 2 3 4 5; do
            if { git fetch origin main --quiet && git push origin HEAD:main --force; } \
                 >"${PUSH_LOG}" 2>&1; then
              echo "Push to ${PEER} succeeded on attempt ${attempt}."
              exit 0
            fi
            cat "${PUSH_LOG}"
            CLASSIFY_OUT="$(python3 scripts/ci/repo_sync_classify.py "${PUSH_LOG}")"
            # Split in the shell, not through `head`/`tail`: under `pipefail` a
            # reader that closes early can SIGPIPE the writer and kill the step.
            CLASSIFICATION="${CLASSIFY_OUT%%$'\n'*}"
            if [ "${CLASSIFY_OUT}" = "${CLASSIFICATION}" ]; then
              RULES=""
            else
              RULES="${CLASSIFY_OUT#*$'\n'}"
            fi
            if [ "${CLASSIFICATION}" = "protected_branch" ] || \
               [ "${CLASSIFICATION}" = "auth_denied" ]; then
              echo "Deterministic rejection (${CLASSIFICATION}) on attempt ${attempt}:" \
                   "retrying cannot change it. Stopping now."
              break
            fi
            echo "Attempt ${attempt} failed (${CLASSIFICATION}); sleeping 10s before retry..."
            sleep 10
          done

          # Measure the drift rather than asserting it. An unmeasured "sync
          # failed" gives a reader no way to tell one stale commit from sixty.
          git fetch origin "+refs/heads/main:refs/remotes/peer/main" --quiet || true
          LOCAL_SHA="$(git rev-parse --short HEAD)"
          PEER_SHA="$(git rev-parse --short refs/remotes/peer/main 2>/dev/null || echo unknown)"
          BEHIND="$(git rev-list --count refs/remotes/peer/main..HEAD 2>/dev/null || echo unknown)"
          BEHIND_MERGES="$(git rev-list --count --merges refs/remotes/peer/main..HEAD \
                           2>/dev/null || echo unknown)"

          # Content rescue: main is blocked, but an ordinary branch is not. Push
          # the head to an unprotected ref so the work actually ARRIVES on the
          # peer and waits for a single fast-forward, instead of nothing arriving
          # at all. Strictly less invasive than the force-push to main this job
          # already performs, and with the same token and the same mandate.
          RESCUE_REF="mirror/main"
          RESCUE_STATE="not_attempted"
          if [ "${CLASSIFICATION}" = "protected_branch" ]; then
            if git push origin "HEAD:refs/heads/${RESCUE_REF}" --force; then
              RESCUE_STATE="pushed"
            else
              RESCUE_STATE="failed"
            fi
          fi

          echo "::error::sync to ${PEER} blocked (${CLASSIFICATION}); mirror is ${BEHIND} commits behind."
          {
            echo "### ❌ Mirror sync blocked — \`${CLASSIFICATION}\`"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| This repository \`main\` | \`${LOCAL_SHA}\` |"
            echo "| \`${PEER}\` \`main\` | \`${PEER_SHA}\` |"
            echo "| Commits the peer is missing | ${BEHIND} (of which ${BEHIND_MERGES} are merge commits) |"
            echo "| Head pushed to \`${RESCUE_REF}\` | ${RESCUE_STATE} |"
            echo ""
            if [ -n "${RULES}" ]; then
              echo "Rules the remote named, verbatim:"
              echo ""
              printf '%s\n' "${RULES}" | sed 's/^/- /'
              echo ""
            fi
            if [ "${CLASSIFICATION}" = "protected_branch" ]; then
              echo "\`main\` on the peer requires a linear history, and this repository"
              echo "merges deliberately (D-287) so Dependabot branches close as Merged."
              echo "The two rules cannot both hold. To unblock, on \`${PEER}\`:"
              echo ""
              echo "1. Settings → Branches → \`main\`: turn off **Require linear history**."
              echo "2. Allow the sync token's owner to bypass the pull-request requirement."
              echo ""
              echo "Sync then heals itself on the next push. Rewriting this repository's"
              echo "history to be linear instead would break the identity the mirror exists"
              echo "for, and needs an ADR."
            fi
          } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
          exit 1
