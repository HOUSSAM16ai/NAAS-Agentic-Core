# ─────────────────────────────────────────────────────────────────────────────
# CI Gate — D-069: Skills Doctrine Drift Detection
#
# يضمن أن منظومة الـ skills تحترم الـ doctrine الموحَّد:
#   1. كل Skill يستورد من `doctrine.py` (لا redefinition محلي)
#   2. Manifest في `doctrine.py` متّسق مع الـ doctrines نفسها
#   3. EXPLANATION_DOCTRINE_VERSION ≥ 2.0.0 (post-D-069)
#   4. `local_graph._EXERCISE_EXPLANATION_SYSTEM_PROMPT` يحوي anchors
#      من EXPLANATION_DOCTRINE (drift detection)
#
# يُشغَّل على كل PR/push (لا paths filter — gate إلزامي بسيط وسريع).
# Runs in ~30s | All jobs must pass | NO skipped | NO failed
# ─────────────────────────────────────────────────────────────────────────────

name: "Skills Doctrine Gate (D-069)"

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: skills-doctrine-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  PYTHON_VERSION: "3.12"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  DATABASE_URL: "sqlite+aiosqlite:///:memory:"
  SECRET_KEY: "test-secret-key-for-ci-pipeline-secure-length"
  ENVIRONMENT: testing
  LLM_MOCK_MODE: "1"
  SUPABASE_URL: https://dummy.supabase.co
  SUPABASE_SERVICE_ROLE_KEY: dummy-key-for-ci
  RECOVERY_ADMIN_PASSWORD: dummy-pass-for-ci

jobs:
  # ── Job 1: Doctrine module drift detection (static) ─────────────────────────
  doctrine-drift:
    name: doctrine-drift
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install minimal deps for doctrine import
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          # doctrine.py has no external deps. bac_exercise_skill.py imports
          # pydantic + the project's own modules. Install pydantic only.
          pip install -q "pydantic>=2.11.5,<3.0.0" "pydantic-settings>=2.3.0,<3.0.0"

      - name: Run skills doctrine drift gate
        shell: bash
        run: |
          set -euo pipefail
          python scripts/fitness/check_skills_doctrine.py

  # ── Job 2: Skills doctrine invariant tests (pytest) ─────────────────────────
  doctrine-invariants:
    name: doctrine-invariants
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install test deps
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          # Install minimal set required to import & test the doctrine module.
          # PyJWT is required because the root conftest.py (imported by pytest
          # automatically) does `import jwt` at module level.
          pip install -q pytest pytest-asyncio "pydantic>=2.11.5,<3.0.0" \
            "pydantic-settings>=2.3.0,<3.0.0" "PyJWT>=2.8.0,<3.0.0" \
            "passlib>=1.7.4" "bcrypt>=3.2.0"

      - name: Run doctrine invariants test suite
        shell: bash
        run: |
          set -euo pipefail
          # -p no:cov disables coverage plugin without requiring pytest-cov installed.
          # --no-cov requires the plugin to be present; -p no:cov does not.
          python -m pytest tests/services/test_skills_doctrine.py -v --tb=short \
            -p no:cov

  # ── Job 3: Required gate (success-only) ─────────────────────────────────────
  skills-doctrine-required:
    name: skills-doctrine-required
    runs-on: ubuntu-latest
    needs: [doctrine-drift, doctrine-invariants]
    # Run on every event — even if upstream failed/cancelled. The summary
    # explicitly checks for `success` (NOT `success || skipped`) so this gate
    # never silently passes on a skipped upstream job.
    if: always()
    steps:
      - name: Evaluate doctrine gate
        shell: bash
        run: |
          set -euo pipefail
          echo "doctrine-drift=${{ needs.doctrine-drift.result }}"
          echo "doctrine-invariants=${{ needs.doctrine-invariants.result }}"

          # STRICT: only `success` counts. Any other status (failure, skipped,
          # cancelled, neutral) makes this gate fail loudly.
          if [ "${{ needs.doctrine-drift.result }}" != "success" ] || \
             [ "${{ needs.doctrine-invariants.result }}" != "success" ]; then
            echo "❌ Skills Doctrine Gate FAILED — at least one upstream job did not succeed."
            exit 1
          fi

          echo ""
          echo "════════════════════════════════════════════════════════════"
          echo "  ✅ D-069 — Skills Doctrine Gate: ALL CHECKS PASSED"
          echo "════════════════════════════════════════════════════════════"
          echo "  Doctrines: retrieval | explanation | model_answer_reliance"
          echo "             | detailed_explanation"
          echo "  Single source of truth: app/services/skills/doctrine.py"
          echo "  EXPLANATION_DOCTRINE_VERSION ≥ 2.0.0 (post-D-069)"
          echo "════════════════════════════════════════════════════════════"
