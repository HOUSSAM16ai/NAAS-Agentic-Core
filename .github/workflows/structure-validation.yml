name: 🔍 Structure Validation (Critical)

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop, 'copilot/**']
    paths:
      - 'app/**'
      - 'tests/**'
      - 'scripts/validate_structure.py'
      - 'requirements-ci.txt'
      - 'requirements-test.txt'
      - '.github/workflows/structure-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: structure-validation-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  PYTHON_VERSION: '3.12'
  DATABASE_URL: "sqlite+aiosqlite:///:memory:"
  SECRET_KEY: "test-secret-key-for-ci-pipeline-secure-length"
  ENVIRONMENT: "testing"
  LLM_MOCK_MODE: '1'
  SUPABASE_URL: "https://dummy.supabase.co"
  SUPABASE_SERVICE_ROLE_KEY: "dummy-key-for-ci"
  RECOVERY_ADMIN_PASSWORD: "dummy-pass-for-ci"

jobs:
  validate-structure:
    name: Validate Service Structure
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Fetch repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up deterministic environment
        uses: ./.github/actions/setup

      - name: Run structure validation
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_structure.py

  validate-integration:
    name: Integration Tests (E2E Chat)
    # ISS-CI-GREEN-001: لا job يجب أن يظهر كـ "skipped" على push/PR.
    # كان: `if: github.event_name == 'workflow_dispatch'` — كل push/PR → skipped check.
    # الآن: يعمل دائماً. تشغيل اختبارات E2E غير المرتبطة بـ DB حقيقي (LLM_MOCK_MODE=1).
    # PostgreSQL service ليس مطلوباً لاختبارات الـ structure/method accessibility الحالية،
    # فأُزيل لتقليل وقت التنفيذ وضمان النجاح الحتمي.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: validate-structure

    steps:
      - name: Fetch repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Set up deterministic environment
        uses: ./.github/actions/setup

      - name: Install integration test dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: Run E2E structure tests
        env:
          # In-memory SQLite is enough for the structure-accessibility tests in
          # tests/integration/test_chat_e2e.py. The previous Postgres service
          # was only needed for legacy tests that have been deleted/relocated.
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
          SECRET_KEY: test-secret-key-for-ci-pipeline-secure-length
          ENVIRONMENT: testing
          LLM_MOCK_MODE: '1'
          SUPABASE_URL: https://dummy.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: dummy-key-for-ci
          RECOVERY_ADMIN_PASSWORD: dummy-pass-for-ci
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "tests/integration/test_chat_e2e.py" ]; then
            # The file exists today (verified live 2026-05-18). If it ever
            # disappears, treat that as a regression — never silently skip.
            python -m pytest tests/integration/test_chat_e2e.py -v --tb=short
            echo "INTEGRATION_STATUS=passed" >> "$GITHUB_ENV"
          else
            echo "❌ tests/integration/test_chat_e2e.py missing — REGRESSION"
            exit 1
          fi

      - name: Integration suite summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          echo "### Integration smoke status: ${INTEGRATION_STATUS:-unknown}" >> "$GITHUB_STEP_SUMMARY"
          echo "Runs on every push/PR — no longer gated on workflow_dispatch." >> "$GITHUB_STEP_SUMMARY"
