  verify-step8-reasoning-agent:
    name: "Verify Step 8 — Reasoning Agent Live Metrics"
    description: |
      يتحقق من أن reasoning-agent يعمل على :8008 ويُصدِّر مقاييس Prometheus حقيقية.
      يفحص: /health + /metrics + MCTS status + LLM backend + Prometheus scrape target + Grafana dashboard.
    command: |
      set -euo pipefail
      PASS=0; FAIL=0
      check() {
        local label="$1"; shift
        if eval "$@" > /dev/null 2>&1; then
          echo "  ✅ $label"
          PASS=$((PASS+1))
        else
          echo "  ❌ $label"
          FAIL=$((FAIL+1))
        fi
      }

      echo ""
      echo "══════════════════════════════════════════════════════"
      echo "  Step 8 — Reasoning Agent Live Verification"
      echo "══════════════════════════════════════════════════════"
      echo ""

      echo "── 1. Health Check ──────────────────────────────────"
      check "GET /health → 200" "curl -sf http://localhost:8008/health"
      HEALTH=$(curl -sf http://localhost:8008/health 2>/dev/null || echo '{}')
      echo "     Response: $HEALTH"
      check "step=8 in health" "echo '$HEALTH' | grep -q '\"step\":\"8\"'"
      check "mcts_enabled=true in health" "echo '$HEALTH' | grep -q 'mcts_enabled'"

      echo ""
      echo "── 2. Prometheus /metrics ───────────────────────────"
      check "GET /metrics → 200" "curl -sf http://localhost:8008/metrics"
      check "cogniforge_reasoning_startup_info present" \
        "curl -sf http://localhost:8008/metrics | grep -q 'cogniforge_reasoning_startup_info'"
      check "step=8 label in metrics" \
        "curl -sf http://localhost:8008/metrics | grep -q 'step=\"8\"'"
      check "cogniforge_reasoning_invocations_total present" \
        "curl -sf http://localhost:8008/metrics | grep -q 'cogniforge_reasoning_invocations_total'"
      check "cogniforge_reasoning_mcts_expansions_total present" \
        "curl -sf http://localhost:8008/metrics | grep -q 'cogniforge_reasoning_mcts_expansions_total'"
      check "cogniforge_reasoning_llm_calls_total present" \
        "curl -sf http://localhost:8008/metrics | grep -q 'cogniforge_reasoning_llm_calls_total'"

      echo ""
      echo "── 3. LLM Backend ───────────────────────────────────"
      LLM_BACKEND=$(echo "$HEALTH" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('llm_backend','unknown'))" 2>/dev/null || echo "unknown")
      echo "     LLM backend: $LLM_BACKEND"
      if [ "$LLM_BACKEND" = "openrouter" ]; then
        echo "  ✅ OpenRouter ACTIVE (OPENROUTER_API_KEY set)"
        PASS=$((PASS+1))
      elif [ "$LLM_BACKEND" = "openai" ]; then
        echo "  ✅ OpenAI ACTIVE (OPENAI_API_KEY set)"
        PASS=$((PASS+1))
      else
        echo "  ⚠️  Mock mode — no API key set (fallback responses only)"
        PASS=$((PASS+1))
      fi

      echo ""
      echo "── 4. Prometheus Scrape Target ──────────────────────"
      check "Prometheus /api/v1/targets accessible" \
        "curl -sf http://localhost:9090/api/v1/targets"
      TARGETS=$(curl -sf http://localhost:9090/api/v1/targets 2>/dev/null || echo '{}')
      check "reasoning-agent target exists" \
        "echo '$TARGETS' | grep -q 'reasoning-agent'"

      echo ""
      echo "── 5. Grafana Dashboard ─────────────────────────────"
      check "Grafana /api/health → ok" \
        "curl -sf http://localhost:3001/api/health | grep -q 'ok'"
      check "Step 8 dashboard exists" \
        "curl -sf 'http://admin:admin@localhost:3001/api/dashboards/uid/cogniforge-ms-step8-reasoning-agent' | grep -q 'step8'"

      echo ""
      echo "── 6. All Microservices Health Matrix ───────────────"
      for svc_port in "orchestrator-service:8006" "user-service:8001" "planning-agent:8002" "research-agent:8007" "reasoning-agent:8008"; do
        svc="${svc_port%%:*}"
        port="${svc_port##*:}"
        if curl -sf "http://localhost:${port}/health" > /dev/null 2>&1; then
          echo "  ✅ $svc (:$port)"
          PASS=$((PASS+1))
        else
          echo "  ❌ $svc (:$port) — DOWN"
          FAIL=$((FAIL+1))
        fi
      done

      echo ""
      echo "══════════════════════════════════════════════════════"
      echo "  Results: ✅ $PASS passed | ❌ $FAIL failed"
      echo "══════════════════════════════════════════════════════"
      echo ""
      echo "  Grafana Step 8 dashboard:"
      echo "  → http://localhost:3001/d/cogniforge-ms-step8-reasoning-agent"
      echo ""
      echo "  Live metrics:"
      echo "  → curl http://localhost:8008/metrics | grep cogniforge_reasoning"
      echo ""
      [ "$FAIL" -eq 0 ] && exit 0 || exit 1
    triggeredBy:
      - manual

  restart-reasoning-agent:
    name: "Restart Reasoning Agent"
    description: يوقف reasoning-agent ويُعيد تشغيله يدوياً على :8008.
    command: |
      set -euo pipefail
      echo "🔄 Restarting reasoning-agent on :8008..."
