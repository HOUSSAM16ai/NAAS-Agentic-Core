# .ona/automations.yaml
# ─────────────────────────────────────────────────────────────────────────────
# CogniForge — Ona Automations (Step 8: Reasoning Agent — MCTS + LLM + /metrics)
#
# الواقع: Codespaces لا يدعم Docker-in-Docker في هذا الـ devcontainer.
# الحل: الخدمات تعمل كـ uvicorn processes مباشرة (مثل Grafana/Prometheus).
#
# الجديد في Step 8:
#   - reasoning-agent على :8008 — MCTS + LLM + /metrics (cogniforge_reasoning_*)
#   - verify-step8-reasoning-agent — تحقق حي شامل من reasoning-agent
#   - restart-reasoning-agent — إعادة تشغيل يدوي
#   - run-step8-tests — 80+ اختبار للخطوة 8
#
# الخدمات النشطة (Codespaces — uvicorn processes):
#   :8000 FastAPI monolith | :8001 user-service | :8002 planning-agent
#   :8006 orchestrator-service | :8007 research-agent | :8008 reasoning-agent
#   :3001 Grafana | :9090 Prometheus
# ─────────────────────────────────────────────────────────────────────────────

services:

  orchestrator-service:
    name: "Orchestrator Service (Step 4 — OUTBOX_RELAY + /metrics)"
    description: |
      يُشغِّل orchestrator-service كـ uvicorn process مباشر على :8006.
      Step 4: OUTBOX_RELAY_ENABLED=true + /metrics endpoint حقيقي.
      لا يتطلب Docker. يبدأ تلقائياً عبر supervisor.sh.
      التحقق: curl http://localhost:8006/health
               curl http://localhost:8006/metrics | grep cogniforge_outbox
    commands:
      start: |
        set -euo pipefail
        ORCH_PORT="8006"
        LOG_FILE="/app/.observability/orchestrator.log"

        if [ -z "${OPENROUTER_API_KEY:-}" ]; then
          echo "❌ OPENROUTER_API_KEY غير مضبوط — أضفه في Gitpod Secrets"
          exit 1
        fi

        pkill -f "uvicorn microservices.orchestrator_service" 2>/dev/null || true
        sleep 1
        mkdir -p /app/.observability

        echo "🚀 Starting orchestrator-service (Step 4) on :${ORCH_PORT}..."
        echo "   OUTBOX_RELAY_ENABLED=true | /metrics → Prometheus"

        # تحويل URL إلى asyncpg (ISS-038-B) + port 5432 بدلاً من 6543 (ISS-040)
        # PgBouncer (6543) يرفض prepared statements — direct PostgreSQL (5432) مطلوب
        _raw_orch_db="${ORCHESTRATOR_DATABASE_URL:-${DATABASE_URL:-}}"
        _async_orch_db="${_raw_orch_db/postgresql:\/\//postgresql+asyncpg://}"
        _async_orch_db="${_async_orch_db/postgresql+psycopg2:\/\//postgresql+asyncpg://}"
        _async_orch_db=$(echo "$_async_orch_db" | sed 's/:6543\//:5432\//')
        _async_orch_db=$(echo "$_async_orch_db" | sed 's/[?&]sslmode=[^&]*//' | sed 's/[?&]ssl=[^&]*//')

        ORCHESTRATOR_DATABASE_URL="$_async_orch_db" \
        OPENROUTER_API_KEY="${OPENROUTER_API_KEY}" \
        TAVILY_API_KEY="${TAVILY_API_KEY:-}" \
        SECRET_KEY="${SECRET_KEY:-cogniforge-orchestrator-dev-key}" \
        REDIS_URL="${REDIS_URL:-redis://localhost:6379}" \
        ENVIRONMENT="${ENVIRONMENT:-development}" \
        CODESPACES="true" \
        OUTBOX_RELAY_ENABLED="true" \
        OUTBOX_RELAY_INTERVAL_SECONDS="15" \
        OUTBOX_RELAY_BATCH_SIZE="50" \
        PLANNING_AGENT_URL="http://localhost:8002" \
        RESEARCH_AGENT_URL="http://localhost:8007" \
        REASONING_AGENT_URL="http://localhost:8008" \
        USER_SERVICE_URL="http://localhost:8001" \
        python -m uvicorn microservices.orchestrator_service.main:app \
          --host 0.0.0.0 \
          --port "$ORCH_PORT" \
          --workers 1 \
          --log-level info \
          2>&1 | tee -a "$LOG_FILE"

      ready: |
        curl -sf http://localhost:8006/health && \
        curl -sf http://localhost:8006/metrics | grep -q "cogniforge_orchestrator_startup_info"

      stop: |
        pkill -f "uvicorn microservices.orchestrator_service" 2>/dev/null || true
        echo "✅ orchestrator-service stopped."

  planning-agent:
    name: "Planning Agent (Step 6 — DSPy + LangGraph + /metrics)"
    description: |
      يُشغِّل planning-agent كـ uvicorn process مباشر على :8002.
      Step 6: /metrics endpoint حقيقي (cogniforge_planning_*). DSPy + LangGraph.
      لا يتطلب Docker. يبدأ تلقائياً عبر supervisor.sh.
      التحقق: curl http://localhost:8002/health
               curl http://localhost:8002/metrics | grep cogniforge_planning_startup_info
    commands:
      start: |
        set -euo pipefail
        PLANNING_PORT="8002"
        LOG_FILE="/app/.observability/planning_agent.log"

        pkill -f "uvicorn microservices.planning_agent" 2>/dev/null || true
        sleep 1
        mkdir -p /app/.observability

        echo "🚀 Starting planning-agent (Step 6) on :${PLANNING_PORT}..."
        echo "   DSPy: ${OPENROUTER_API_KEY:+enabled}${OPENROUTER_API_KEY:-disabled (fallback mode)}"
        echo "   /metrics → Prometheus | cogniforge_planning_*"

        # تحويل URL إلى asyncpg — SQLAlchemy async يرفض psycopg2 المتزامن
        _raw_db="${PLANNING_DATABASE_URL:-${DATABASE_URL:-}}"
        _async_db="${_raw_db/postgresql:\/\//postgresql+asyncpg://}"
        _async_db="${_async_db/postgresql+psycopg2:\/\//postgresql+asyncpg://}"
        _async_db=$(echo "$_async_db" | sed 's/[?&]sslmode=[^&]*//' | sed 's/[?&]ssl=[^&]*//')

        PLANNING_DATABASE_URL="$_async_db" \
        PLANNING_OPENROUTER_API_KEY="${OPENROUTER_API_KEY:-}" \
        PLANNING_SECRET_KEY="${SECRET_KEY:-cogniforge-planning-agent-dev-key}" \
        PLANNING_ENVIRONMENT="${ENVIRONMENT:-development}" \
        PLANNING_SERVICE_NAME="planning-agent" \
        PLANNING_SERVICE_VERSION="1.0.0" \
        python -m uvicorn microservices.planning_agent.main:app \
          --host 0.0.0.0 \
          --port "$PLANNING_PORT" \
          --workers 1 \
          --log-level info \
          2>&1 | tee -a "$LOG_FILE"

      ready: |
        curl -sf http://localhost:8002/health && \
        curl -sf http://localhost:8002/metrics | grep -q "cogniforge_planning_startup_info"

      stop: |
        pkill -f "uvicorn microservices.planning_agent" 2>/dev/null || true
        echo "✅ planning-agent stopped."

  reasoning-agent:
    name: "Reasoning Agent (Step 8 — MCTS + LLM + /metrics)"
    description: |
      يُشغِّل reasoning-agent كـ uvicorn process مباشر على :8008.
      Step 8: /metrics endpoint حقيقي (cogniforge_reasoning_*). MCTS + LLM حي.
      لا يتطلب Docker. يبدأ تلقائياً عبر supervisor.sh.
      التحقق: curl http://localhost:8008/health
               curl http://localhost:8008/metrics | grep cogniforge_reasoning_startup_info
    commands:
      start: |
        set -euo pipefail
        REASONING_PORT="8008"
        LOG_FILE="/app/.observability/reasoning_agent.log"

        pkill -f "uvicorn microservices.reasoning_agent" 2>/dev/null || true
        sleep 1
        mkdir -p /app/.observability

        echo "🚀 Starting reasoning-agent (Step 8) on :${REASONING_PORT}..."
        echo "   LLM: ${OPENROUTER_API_KEY:+✅ OpenRouter ACTIVE}${OPENROUTER_API_KEY:-⚠️  mock mode (no OPENROUTER_API_KEY)}"
        echo "   MCTS: ✅ ACTIVE (always enabled)"
        echo "   /metrics → Prometheus | cogniforge_reasoning_*"

        REASONING_OPENROUTER_API_KEY="${OPENROUTER_API_KEY:-}" \
        OPENROUTER_API_KEY="${OPENROUTER_API_KEY:-}" \
        OPENAI_API_KEY="${OPENAI_API_KEY:-}" \
        ENVIRONMENT="${ENVIRONMENT:-development}" \
        SECRET_KEY="${SECRET_KEY:-cogniforge-reasoning-agent-dev-key}" \
        PYTHONPATH="/app" \
        python -m uvicorn microservices.reasoning_agent.main:app \
          --host 0.0.0.0 \
          --port "$REASONING_PORT" \
          --workers 1 \
          --log-level info \
          2>&1 | tee -a "$LOG_FILE"

      ready: |
        curl -sf http://localhost:8008/health &&
        curl -sf http://localhost:8008/metrics | grep -q "cogniforge_reasoning_startup_info"

      stop: |
        pkill -f "uvicorn microservices.reasoning_agent" 2>/dev/null || true
        echo "✅ reasoning-agent stopped."

  research-agent:
    name: "Research Agent (Step 7 — Tavily Web Search + /metrics)"
    description: |
      يُشغِّل research-agent كـ uvicorn process مباشر على :8007.
      Step 7: /metrics endpoint حقيقي (cogniforge_research_*). Tavily web search حي.
      لا يتطلب Docker. يبدأ تلقائياً عبر supervisor.sh.
      التحقق: curl http://localhost:8007/health
               curl http://localhost:8007/metrics | grep cogniforge_research_startup
    commands:
      start: |
        set -euo pipefail
        RESEARCH_PORT="8007"
        LOG_FILE="/app/.observability/research_agent.log"

        pkill -f "uvicorn microservices.research_agent" 2>/dev/null || true
        sleep 1
        mkdir -p /app/.observability

        echo "🚀 Starting research-agent (Step 7) on :${RESEARCH_PORT}..."
        echo "   Tavily: ${TAVILY_API_KEY:+✅ KEY SET — web search ACTIVE}${TAVILY_API_KEY:-❌ no key — web search disabled}"
        echo "   /metrics → Prometheus | cogniforge_research_*"

        # تحويل URL إلى asyncpg — SQLAlchemy async يرفض psycopg2 المتزامن (ISS-038-B)
        _raw_db="${RESEARCH_DATABASE_URL:-${DATABASE_URL:-}}"
        _async_db="${_raw_db/postgresql:\/\//postgresql+asyncpg://}"
        _async_db="${_async_db/postgresql+psycopg2:\/\//postgresql+asyncpg://}"
        _async_db=$(echo "$_async_db" | sed 's/[?&]sslmode=[^&]*//' | sed 's/[?&]ssl=[^&]*//')

        RESEARCH_DATABASE_URL="$_async_db" \
        RESEARCH_OPENROUTER_API_KEY="${OPENROUTER_API_KEY:-}" \
        TAVILY_API_KEY="${TAVILY_API_KEY:-}" \
        ENVIRONMENT="${ENVIRONMENT:-development}" \
        SECRET_KEY="${SECRET_KEY:-cogniforge-research-agent-dev-key}" \
        PYTHONPATH="/app" \
        python -m uvicorn microservices.research_agent.main:app \
          --host 0.0.0.0 \
          --port "$RESEARCH_PORT" \
          --workers 1 \
          --log-level info \
          2>&1 | tee -a "$LOG_FILE"

      ready: |
        curl -sf http://localhost:8007/health &&
        curl -sf http://localhost:8007/metrics | grep -q "cogniforge_research_startup"

      stop: |
        pkill -f "uvicorn microservices.research_agent" 2>/dev/null || true
        echo "✅ research-agent stopped."

  conversation-service:
    name: "Conversation Service (Step 12 — LangGraph StateGraph + /metrics)"
    description: |
      يُشغِّل conversation-service كـ uvicorn process مباشر على :8003.
      Step 12: LangGraph StateGraph (intent_node → response_node) + /metrics حقيقي.
      لا يتطلب Docker. يبدأ تلقائياً عبر supervisor.sh STEP 4J.
      التحقق: curl http://localhost:8003/health
               curl http://localhost:8003/metrics | grep cogniforge_conversation_startup_info
    commands:
      start: |
        set -euo pipefail
        CONV_PORT="8003"
        LOG_FILE="/app/.observability/conversation_service.log"

        pkill -f "uvicorn microservices.conversation_service" 2>/dev/null || true
        sleep 1
        mkdir -p /app/.observability

        echo "🚀 Starting conversation-service (Step 12) on :${CONV_PORT}..."
        echo "   LangGraph: intent_node → response_node"
        echo "   LLM: ${OPENROUTER_API_KEY:+✅ OpenRouter ACTIVE}${OPENROUTER_API_KEY:-⚠️  fallback mode (no OPENROUTER_API_KEY)}"
        echo "   /metrics → Prometheus | cogniforge_conversation_*"

        # تحويل URL إلى asyncpg (ISS-038-B) + port 5432 بدلاً من 6543 (ISS-040)
        _raw_db="${CONV_DATABASE_URL:-${DATABASE_URL:-sqlite+aiosqlite:///:memory:}}"
        _async_db="${_raw_db/postgresql:\/\//postgresql+asyncpg://}"
        _async_db="${_async_db/postgresql+psycopg2:\/\//postgresql+asyncpg://}"
        _async_db=$(echo "$_async_db" | sed 's/:6543\//:5432\//')
        _async_db=$(echo "$_async_db" | sed 's/[?&]sslmode=[^&]*//' | sed 's/[?&]ssl=[^&]*//')

        CONV_DATABASE_URL="$_async_db" \
        OPENROUTER_API_KEY="${OPENROUTER_API_KEY:-}" \
        ENVIRONMENT="${ENVIRONMENT:-development}" \
        PYTHONPATH="/app" \
        python -m uvicorn microservices.conversation_service.main:app \
          --host 0.0.0.0 \
          --port "$CONV_PORT" \
          --workers 1 \
          --log-level info \
          2>&1 | tee -a "$LOG_FILE"

      ready: |
        curl -sf http://localhost:8003/health &&
        curl -sf http://localhost:8003/metrics | grep -q "cogniforge_conversation_startup_info"

      stop: |
        pkill -f "uvicorn microservices.conversation_service" 2>/dev/null || true
        echo "✅ conversation-service stopped."

  user-service:
    name: "User Service (Step 5 — Prometheus /metrics)"
    description: |
      يُشغِّل user-service كـ uvicorn process مباشر على :8001.
      Step 5: /metrics endpoint حقيقي (cogniforge_user_*).
      لا يتطلب Docker. يبدأ تلقائياً عبر supervisor.sh.
      التحقق: curl http://localhost:8001/health
               curl http://localhost:8001/metrics | grep cogniforge_user
    commands:
      start: |
        set -euo pipefail
        USER_PORT="8001"
        LOG_FILE="/app/.observability/user_service.log"

        if [ -z "${DATABASE_URL:-}" ] && [ -z "${USER_DATABASE_URL:-}" ]; then
          echo "❌ DATABASE_URL غير مضبوط — أضفه في Gitpod Secrets"
          exit 1
        fi

        pkill -f "uvicorn microservices.user_service" 2>/dev/null || true
        sleep 1
        mkdir -p /app/.observability

        echo "🚀 Starting user-service (Step 5) on :${USER_PORT}..."
        echo "   /metrics → Prometheus | cogniforge_user_*"

        USER_DATABASE_URL="${USER_DATABASE_URL:-${DATABASE_URL:-}}" \
        SECRET_KEY="${SECRET_KEY:-cogniforge-user-service-dev-key}" \
        ENVIRONMENT="${ENVIRONMENT:-development}" \
        USER_SERVICE_NAME="user-service" \
        USER_SERVICE_VERSION="1.0.0" \
        python -m uvicorn microservices.user_service.main:app \
          --host 0.0.0.0 \
          --port "$USER_PORT" \
          --workers 1 \
          --log-level info \
          2>&1 | tee -a "$LOG_FILE"

      ready: |
        curl -sf http://localhost:8001/health && \
        curl -sf http://localhost:8001/metrics | grep -q "cogniforge_user_startup_info"

      stop: |
        pkill -f "uvicorn microservices.user_service" 2>/dev/null || true
        echo "✅ user-service stopped."

tasks:

  health-probe:
    name: "Orchestrator Health Probe"
    description: تقرير صحة orchestrator-service الحي مع Prometheus targets.
    command: |
      set -euo pipefail
      URL="http://localhost:8006"
      echo "═══════════════════════════════════════════════════════════"
      echo "  CogniForge — Orchestrator Health Probe (Step 3)"
      echo "═══════════════════════════════════════════════════════════"
      echo ""
      echo "▶ GET ${URL}/health"
      HEALTH=$(curl -sf "${URL}/health" 2>/dev/null) || {
        echo "❌ orchestrator-service غير متاح على :8006"
        echo "   راجع: cat /app/.observability/orchestrator.log"
        echo "   أو شغّل: gitpod automations service start orchestrator-service"
        exit 1
      }
      echo "$HEALTH" | python3 -m json.tool
      STATUS=$(echo "$HEALTH" | python3 -c "import sys,json; print(json.load(sys.stdin).get('status','?'))")
      GRAPH=$(echo "$HEALTH" | python3 -c "import sys,json; print(json.load(sys.stdin).get('graph_ready',False))")
      echo ""
      echo "  Status: $STATUS | Graph Ready: $GRAPH"
      echo "  PID: $(pgrep -f 'uvicorn microservices.orchestrator_service' 2>/dev/null || echo 'not found')"
      echo ""
      echo "▶ Prometheus targets"
      curl -sf "http://localhost:9090/api/v1/targets" 2>/dev/null | python3 -c "import sys,json; d=json.load(sys.stdin); [print('  UP ' + t.get('labels',{}).get('job','?') if t.get('health')=='up' else '  DOWN ' + t.get('labels',{}).get('job','?')) for t in d.get('data',{}).get('activeTargets',[])]" 2>/dev/null || echo "  (Prometheus غير متاح)"
      echo ""
      echo "═══════════════════════════════════════════════════════════"
      [ "$STATUS" = "ok" ] || [ "$STATUS" = "degraded" ] && echo "  ✅ Step 3 ACTIVE" || echo "  ⚠️  Status: $STATUS"
      echo "═══════════════════════════════════════════════════════════"
    triggeredBy:
      - manual

  verify-stack:
    name: "Verify Full Stack (Step 3)"
    description: تحقق شامل من جميع مكونات الـ stack في Codespaces.
    command: |
      set -euo pipefail
      PASS=0; FAIL=0
      check() {
        if eval "$2" > /dev/null 2>&1; then echo "  ✅ $1"; PASS=$((PASS+1))
        else echo "  ❌ $1"; FAIL=$((FAIL+1)); fi
      }
      echo "═══════════════════════════════════════════════════════════"
      echo "  CogniForge — Full Stack Verification (Step 3)"
      echo "═══════════════════════════════════════════════════════════"
      echo ""
      echo "▶ HTTP Endpoints"
      check "FastAPI monolith :8000"     "curl -sf http://localhost:8000/health"
      check "orchestrator-service :8006" "curl -sf http://localhost:8006/health"
      check "Grafana :3001"              "curl -sf http://localhost:3001/api/health"
      check "Prometheus :9090"           "curl -sf http://localhost:9090/-/healthy"
      check "Next.js :3000"              "curl -sf http://localhost:3000/"
      echo ""
      echo "▶ Processes"
      check "uvicorn monolith"           "pgrep -f 'uvicorn app.main'"
      check "uvicorn orchestrator"       "pgrep -f 'uvicorn microservices.orchestrator_service'"
      check "grafana-server"             "pgrep -f 'grafana-server'"
      check "prometheus"                 "pgrep -f '/opt/prometheus/prometheus'"
      echo ""
      HEALTH=$(curl -sf http://localhost:8006/health 2>/dev/null) || HEALTH="{}"
      STATUS=$(echo "$HEALTH" | python3 -c "import sys,json; print(json.load(sys.stdin).get('status','unknown'))" 2>/dev/null || echo "unknown")
      GRAPH=$(echo "$HEALTH" | python3 -c "import sys,json; print(json.load(sys.stdin).get('graph_ready',False))" 2>/dev/null || echo "false")
      echo "▶ Orchestrator: status=$STATUS | graph_ready=$GRAPH"
      echo ""
      echo "═══════════════════════════════════════════════════════════"
      echo "  Results: ✅ $PASS passed | ❌ $FAIL failed"
      [ "$FAIL" -eq 0 ] && echo "  🎉 Step 3 FULLY OPERATIONAL" || echo "  ⚠️  Logs: cat /app/.observability/orchestrator.log"
      echo "═══════════════════════════════════════════════════════════"
    triggeredBy:
      - manual

  restart-orchestrator:
    name: "Restart Orchestrator Service"
    description: يوقف orchestrator-service ويُعيد تشغيله يدوياً.
    command: |
      set -euo pipefail
      echo "🔄 Restarting orchestrator-service..."
      pkill -f "uvicorn microservices.orchestrator_service" 2>/dev/null || true
      sleep 2
      [ -z "${OPENROUTER_API_KEY:-}" ] && { echo "❌ OPENROUTER_API_KEY غير مضبوط"; exit 1; }
      # ISS-038-B: asyncpg URL + ISS-040: port 5432 (direct PG, not PgBouncer 6543)
      _raw_orch="${ORCHESTRATOR_DATABASE_URL:-${DATABASE_URL:-}}"
      _async_orch="${_raw_orch/postgresql:\/\//postgresql+asyncpg://}"
      _async_orch="${_async_orch/postgresql+psycopg2:\/\//postgresql+asyncpg://}"
      _async_orch=$(echo "$_async_orch" | sed 's/:6543\//:5432\//')
      _async_orch=$(echo "$_async_orch" | sed 's/[?&]sslmode=[^&]*//' | sed 's/[?&]ssl=[^&]*//')
      ORCHESTRATOR_DATABASE_URL="$_async_orch" \
      OPENROUTER_API_KEY="${OPENROUTER_API_KEY}" \
      TAVILY_API_KEY="${TAVILY_API_KEY:-}" \
      SECRET_KEY="${SECRET_KEY:-cogniforge-orchestrator-dev-key}" \
      REDIS_URL="${REDIS_URL:-redis://localhost:6379}" \
      ENVIRONMENT="${ENVIRONMENT:-development}" \
      OUTBOX_RELAY_ENABLED="true" \
      OUTBOX_RELAY_INTERVAL_SECONDS="15" \
      OUTBOX_RELAY_BATCH_SIZE="50" \
      nohup python -m uvicorn microservices.orchestrator_service.main:app \
        --host 0.0.0.0 --port 8006 --workers 1 --log-level info \
        >> /app/.observability/orchestrator.log 2>&1 &
      echo "✅ orchestrator-service restarted (PID=$!)"
      echo "   curl http://localhost:8006/health"
      echo "   curl http://localhost:8006/metrics | grep cogniforge_outbox"
    triggeredBy:
      - manual

  run-step3-tests:
    name: "Run Step 3 Transition Tests"
    description: اختبارات الانتقال للخطوة 3 بمتغيرات CI آمنة.
    command: |
      set -euo pipefail
      export DATABASE_URL="sqlite+aiosqlite:///:memory:"
      export SECRET_KEY="test-secret-key-for-step3-tests"
      export ENVIRONMENT="testing"
      export OPENROUTER_API_KEY="${OPENROUTER_API_KEY:-dummy-key-for-tests}"
      export TAVILY_API_KEY="${TAVILY_API_KEY:-}"
      export LLM_MOCK_MODE="1"
      echo "🧪 Running Step 3 transition tests..."
      python -m pytest \
        tests/microservices/orchestrator_service/ \
        tests/infrastructure/test_routing_policy.py \
        tests/contracts/test_exercise_retrieval_contracts.py \
        -v --tb=short --no-header -q 2>&1 | tail -40
      echo "✅ Tests complete."
    triggeredBy:
      - manual

  verify-step4-metrics:
    name: "Verify Step 4 — Prometheus Metrics Live"
    description: |
      يتحقق من أن /metrics endpoint يُصدِّر مقاييس Prometheus حقيقية
      ومن أن OUTBOX_RELAY_ENABLED=true في orchestrator-service.
    command: |
      set -euo pipefail
      URL="http://localhost:8006"
      echo "═══════════════════════════════════════════════════════════"
      echo "  CogniForge — Step 4 Metrics Verification"
      echo "═══════════════════════════════════════════════════════════"
      echo ""

      echo "▶ GET ${URL}/health"
      HEALTH=$(curl -sf "${URL}/health" 2>/dev/null) || {
        echo "❌ orchestrator-service غير متاح على :8006"
        echo "   شغّل: gitpod automations service start orchestrator-service"
        exit 1
      }
      echo "$HEALTH" | python3 -m json.tool
      echo ""

      echo "▶ GET ${URL}/metrics (Prometheus text format)"
      METRICS=$(curl -sf "${URL}/metrics" 2>/dev/null) || {
        echo "❌ /metrics endpoint غير متاح"
        exit 1
      }

      PASS=0; FAIL=0
      check_metric() {
        if echo "$METRICS" | grep -q "$1"; then
          echo "  ✅ $1"; PASS=$((PASS+1))
        else
          echo "  ❌ $1 — غائب"; FAIL=$((FAIL+1))
        fi
      }

      echo ""
      echo "▶ Required metrics:"
      check_metric "cogniforge_orchestrator_startup_info"
      check_metric "cogniforge_outbox_relay_cycles_total"
      check_metric "cogniforge_outbox_relay_processed_total"
      check_metric "cogniforge_outbox_relay_failed_total"
      check_metric "cogniforge_stategraph_invocations_total"
      check_metric "cogniforge_orchestrator_requests_total"

      echo ""
      echo "▶ OUTBOX_RELAY status:"
      RELAY=$(echo "$HEALTH" | python3 -c "import sys,json; d=json.load(sys.stdin); print('startup_state:', d.get('startup_state','?')); print('graph_ready:', d.get('graph_ready',False))" 2>/dev/null || echo "parse error")
      echo "  $RELAY"

      echo ""
      echo "▶ Prometheus scrape targets:"
      curl -sf "http://localhost:9090/api/v1/targets" 2>/dev/null | python3 -c "import sys,json; d=json.load(sys.stdin); [print(('  UP ' if t.get('health')=='up' else '  DOWN ') + t.get('labels',{}).get('job','?') + ' — ' + t.get('scrapeUrl','?')) for t in d.get('data',{}).get('activeTargets',[])]" 2>/dev/null || echo "  (Prometheus غير متاح)"

      echo ""
      echo "▶ Grafana dashboard:"
      echo "  http://localhost:3001/d/cogniforge-ms-step4-persistence"
      echo ""
      echo "═══════════════════════════════════════════════════════════"
      echo "  Results: ✅ $PASS passed | ❌ $FAIL failed"
      [ "$FAIL" -eq 0 ] && echo "  🎉 Step 4 METRICS ACTIVE" || echo "  ⚠️  بعض المقاييس غائبة"
      echo "═══════════════════════════════════════════════════════════"
      [ "$FAIL" -eq 0 ]
    triggeredBy:
      - manual

  run-step4-tests:
    name: "Run Step 4 Persistence Relay Tests"
    description: اختبارات الخطوة 4 — OUTBOX_RELAY + Prometheus metrics.
    command: |
      set -euo pipefail
      export DATABASE_URL="sqlite+aiosqlite:///:memory:"
      export ORCHESTRATOR_DATABASE_URL="sqlite+aiosqlite:///:memory:"
      export SECRET_KEY="test-secret-key-for-step4-tests"
      export ENVIRONMENT="testing"
      export OPENROUTER_API_KEY="${OPENROUTER_API_KEY:-dummy-key-for-tests}"
      export TAVILY_API_KEY="${TAVILY_API_KEY:-}"
      export LLM_MOCK_MODE="1"
      echo "🧪 Running Step 4 persistence relay tests..."
      python -m pytest \
        tests/microservices/orchestrator_service/test_step4_persistence_relay.py \
        tests/microservices/orchestrator_service/test_outbox_relay_lifecycle.py \
        tests/microservices/orchestrator_service/test_outbox_relay_control_plane.py \
        -v --tb=short --no-header -q 2>&1 | tail -50
      echo "✅ Step 4 tests complete."
    triggeredBy:
      - manual

  verify-step5-user-service:
    name: "Verify Step 5 — User Service Live Metrics"
    description: |
      يتحقق من أن user-service يعمل على :8001 ويُصدِّر مقاييس Prometheus حقيقية.
      يفحص: /health + /metrics + Prometheus scrape target + Grafana dashboard.
    command: |
      set -euo pipefail
      URL="http://localhost:8001"
      echo "═══════════════════════════════════════════════════════════"
      echo "  CogniForge — Step 5: User Service Verification"
      echo "═══════════════════════════════════════════════════════════"
      echo ""

      echo "▶ GET ${URL}/health"
      HEALTH=$(curl -sf "${URL}/health" 2>/dev/null) || {
        echo "❌ user-service غير متاح على :8001"
        echo "   راجع: cat /app/.observability/user_service.log"
        echo "   أو شغّل: gitpod automations service start user-service"
        exit 1
      }
      echo "$HEALTH" | python3 -m json.tool
      STATUS=$(echo "$HEALTH" | python3 -c "import sys,json; print(json.load(sys.stdin).get('status','?'))")
      echo ""

      echo "▶ GET ${URL}/metrics (Prometheus text format)"
      METRICS=$(curl -sf "${URL}/metrics" 2>/dev/null) || {
        echo "❌ /metrics endpoint غير متاح"
        exit 1
      }

      PASS=0; FAIL=0
      check_metric() {
        if echo "$METRICS" | grep -q "$1"; then
          echo "  ✅ $1"; PASS=$((PASS+1))
        else
          echo "  ❌ $1 — غائب"; FAIL=$((FAIL+1))
        fi
      }

      echo ""
      echo "▶ Required metrics:"
      check_metric "cogniforge_user_startup_info"
      check_metric "cogniforge_user_requests_total"
      check_metric "cogniforge_user_request_duration_seconds"
      check_metric "cogniforge_user_auth_operations_total"
      check_metric "cogniforge_user_registrations_total"
      check_metric "cogniforge_user_logins_total"

      echo ""
      echo "▶ Prometheus scrape targets:"
      curl -sf "http://localhost:9090/api/v1/targets" 2>/dev/null | \
        python3 -c "import sys,json; [print(f'  {chr(9989) if t["health"]=="up" else chr(10060)} [{t["labels"].get("job","?")}] {t["health"]}') for t in json.load(sys.stdin)["data"]["activeTargets"]]" \
        2>/dev/null || echo "  (Prometheus غير متاح)"

      echo ""
      echo "▶ Grafana dashboard:"
      echo "  http://localhost:3001/d/cogniforge-ms-step5-user-service"
      echo ""
      echo "▶ Process check:"
      PID=$(pgrep -f 'uvicorn microservices.user_service' 2>/dev/null || echo 'not found')
      echo "  user-service PID: $PID"
      echo ""
      echo "═══════════════════════════════════════════════════════════"
      echo "  Results: ✅ $PASS passed | ❌ $FAIL failed | Status: $STATUS"
      [ "$FAIL" -eq 0 ] && echo "  🎉 Step 5 USER-SERVICE ACTIVE" || echo "  ⚠️  بعض المقاييس غائبة"
      echo "═══════════════════════════════════════════════════════════"
      [ "$FAIL" -eq 0 ]
    triggeredBy:
      - manual

  restart-user-service:
    name: "Restart User Service"
    description: يوقف user-service ويُعيد تشغيله يدوياً.
    command: |
      set -euo pipefail
      echo "🔄 Restarting user-service..."
      pkill -f "uvicorn microservices.user_service" 2>/dev/null || true
      sleep 2
      USER_DATABASE_URL="${USER_DATABASE_URL:-${DATABASE_URL:-}}" \
      SECRET_KEY="${SECRET_KEY:-cogniforge-user-service-dev-key}" \
      ENVIRONMENT="${ENVIRONMENT:-development}" \
      USER_SERVICE_NAME="user-service" \
      USER_SERVICE_VERSION="1.0.0" \
      nohup python -m uvicorn microservices.user_service.main:app \
        --host 0.0.0.0 --port 8001 --workers 1 --log-level info \
        >> /app/.observability/user_service.log 2>&1 &
      echo "✅ user-service restarted (PID=$!)"
      echo "   curl http://localhost:8001/health"
      echo "   curl http://localhost:8001/metrics | grep cogniforge_user"
    triggeredBy:
      - manual

  run-step5-tests:
    name: "Run Step 5 User Service Tests"
    description: اختبارات الخطوة 5 — user-service Prometheus metrics.
    command: |
      set -euo pipefail
      export DATABASE_URL="sqlite+aiosqlite:///:memory:"
      export USER_DATABASE_URL="sqlite+aiosqlite:///:memory:"
      export SECRET_KEY="test-secret-key-for-step5-tests"
      export ENVIRONMENT="testing"
      export LLM_MOCK_MODE="1"
      echo "🧪 Running Step 5 user-service tests..."
      python -m pytest \
        tests/microservices/user_service/test_step5_user_service_metrics.py \
        -v --tb=short --no-header -q 2>&1 | tail -50
      echo "✅ Step 5 tests complete."
    triggeredBy:
      - manual

  # ── Step 6: Planning Agent ─────────────────────────────────────────────────

  restart-planning-agent:
    name: "Restart Planning Agent"
    description: يوقف planning-agent ويُعيد تشغيله يدوياً على :8002.
    command: |
      set -euo pipefail
      echo "🔄 Restarting planning-agent..."
      pkill -f "uvicorn microservices.planning_agent" 2>/dev/null || true
      sleep 2
      # تحويل URL إلى asyncpg — SQLAlchemy async يرفض psycopg2 المتزامن (ISS-038-B)
      _raw_db="${PLANNING_DATABASE_URL:-${DATABASE_URL:-}}"
      _async_db="${_raw_db/postgresql:\/\//postgresql+asyncpg://}"
      _async_db="${_async_db/postgresql+psycopg2:\/\//postgresql+asyncpg://}"
      _async_db=$(echo "$_async_db" | sed 's/[?&]sslmode=[^&]*//' | sed 's/[?&]ssl=[^&]*//')
      PLANNING_DATABASE_URL="$_async_db" \
      PLANNING_OPENROUTER_API_KEY="${OPENROUTER_API_KEY:-}" \
      PLANNING_SECRET_KEY="${SECRET_KEY:-cogniforge-planning-agent-dev-key}" \
      PLANNING_ENVIRONMENT="${ENVIRONMENT:-development}" \
      PLANNING_SERVICE_NAME="planning-agent" \
      PLANNING_SERVICE_VERSION="1.0.0" \
      nohup python -m uvicorn microservices.planning_agent.main:app \
        --host 0.0.0.0 --port 8002 --workers 1 --log-level info \
        >> /app/.observability/planning_agent.log 2>&1 &
      echo "✅ planning-agent restarted (PID=$!)"
      echo "   curl http://localhost:8002/health"
      echo "   curl http://localhost:8002/metrics | grep cogniforge_planning"
    triggeredBy:
      - manual

  verify-step6-planning-agent:
    name: "Verify Step 6 — Planning Agent Live Metrics"
    description: |
      يتحقق من أن planning-agent يعمل على :8002 ويُصدِّر مقاييس Prometheus حقيقية.
      يفحص: /health + /metrics + Prometheus scrape target + Grafana dashboard.
    command: |
      set -euo pipefail
      URL="http://localhost:8002"
      echo "═══════════════════════════════════════════════════════════"
      echo "  CogniForge — Step 6: Planning Agent Verification"
      echo "═══════════════════════════════════════════════════════════"
      echo ""

      echo "▶ GET ${URL}/health"
      HEALTH=$(curl -sf "${URL}/health" 2>/dev/null) || {
        echo "❌ planning-agent غير متاح على :8002"
        echo "   راجع: cat /app/.observability/planning_agent.log"
        echo "   أو شغّل: gitpod automations task start restart-planning-agent"
        exit 1
      }
      echo "$HEALTH" | python3 -m json.tool
      STATUS=$(echo "$HEALTH" | python3 -c "import sys,json; print(json.load(sys.stdin).get('status','?'))")
      echo ""

      echo "▶ GET ${URL}/metrics (Prometheus text format)"
      METRICS=$(curl -sf "${URL}/metrics" 2>/dev/null) || {
        echo "❌ /metrics endpoint غير متاح"
        exit 1
      }

      PASS=0; FAIL=0
      check_metric() {
        if echo "$METRICS" | grep -q "$1"; then
          echo "  ✅ $1"; PASS=$((PASS+1))
        else
          echo "  ❌ $1 — غائب"; FAIL=$((FAIL+1))
        fi
      }

      echo ""
      echo "▶ Required metrics (cogniforge_planning_*):"
      check_metric "cogniforge_planning_startup_info"
      check_metric "cogniforge_planning_requests_total"
      check_metric "cogniforge_planning_request_duration_seconds"
      check_metric "cogniforge_planning_plans_total"
      check_metric "cogniforge_planning_plan_duration_seconds"
      check_metric "cogniforge_planning_dspy_invocations_total"
      check_metric "cogniforge_planning_fallback_plans_total"
      check_metric "cogniforge_planning_db_operations_total"

      echo ""
      echo "▶ DSPy availability:"
      echo "$METRICS" | grep "cogniforge_planning_startup_info" | head -3 || echo "  (startup_info not yet emitted)"

      echo ""
      echo "▶ Prometheus scrape targets:"
      curl -sf "http://localhost:9090/api/v1/targets" 2>/dev/null \
        | python3 -c "import sys,json; [print(('  ✅ ' if t['health']=='up' else '  ❌ ')+t.get('labels',{}).get('job','?')+' '+t['health']) for t in json.load(sys.stdin)['data']['activeTargets']]" \
        2>/dev/null || echo "  (Prometheus غير متاح)"

      echo ""
      echo "▶ Grafana dashboard:"
      echo "  http://localhost:3001/d/cogniforge-ms-step6-planning-agent"
      echo ""
      echo "▶ Process check:"
      PID=$(pgrep -f 'uvicorn microservices.planning_agent' 2>/dev/null || echo 'not found')
      echo "  planning-agent PID: $PID"
      echo ""
      echo "▶ Test plan creation:"
      PLAN_RESP=$(curl -sf -X POST "${URL}/plans" \
        -H 'Content-Type: application/json' \
        -H 'Authorization: Bearer cogniforge-service-token' \
        -d '{"goal":"اختبار التحقق الحي للخطوة 6"}' 2>/dev/null) || PLAN_RESP=""
      if [ -n "$PLAN_RESP" ]; then
        echo "  ✅ POST /plans → plan created"
        echo "$PLAN_RESP" | python3 -c "import sys,json; d=json.load(sys.stdin); print('  plan_id='+str(d.get('plan_id','?'))+' | strategy='+str(d.get('strategy_name','?')))" 2>/dev/null || true
        PASS=$((PASS+1))
      else
        echo "  ⚠️  POST /plans → no response (service token may differ)"
      fi

      echo ""
      echo "═══════════════════════════════════════════════════════════"
      echo "  Results: ✅ $PASS passed | ❌ $FAIL failed | Status: $STATUS"
      [ "$FAIL" -eq 0 ] && echo "  🎉 Step 6 PLANNING-AGENT ACTIVE" || echo "  ⚠️  بعض المقاييس غائبة"
      echo "═══════════════════════════════════════════════════════════"
      [ "$FAIL" -eq 0 ]
    triggeredBy:
      - manual

  docker-compose-stack:
    name: "Docker Compose Full Stack (Step 6)"
    description: |
      يُشغِّل docker-compose.step6.yml — orchestrator + user-service + planning-agent.
      مخصص لبيئات Docker (ليس Codespaces). في Codespaces: supervisor.sh هو المسار.
      يتطلب: OPENROUTER_API_KEY + DATABASE_URL في البيئة.
    command: |
      set -euo pipefail
      echo "═══════════════════════════════════════════════════════════"
      echo "  CogniForge — Docker Compose Step 6 Stack"
      echo "═══════════════════════════════════════════════════════════"
      echo ""

      # التحقق من Docker
      if ! command -v docker &>/dev/null; then
        echo "⚠️  Docker غير متاح في هذه البيئة."
        echo "   في Codespaces: supervisor.sh يُشغِّل الخدمات كـ uvicorn processes."
        echo "   استخدم: gitpod automations task start restart-planning-agent"
        echo ""
        echo "   للتشغيل في بيئة Docker محلية:"
        echo "   export OPENROUTER_API_KEY=sk-or-v1-..."
        echo "   export DATABASE_URL=postgresql://..."
        echo "   docker compose -f docker-compose.step6.yml up -d"
        exit 0
      fi

      # التحقق من المتغيرات
      [ -z "${OPENROUTER_API_KEY:-}" ] && { echo "❌ OPENROUTER_API_KEY مطلوب"; exit 1; }
      [ -z "${DATABASE_URL:-}" ] && { echo "❌ DATABASE_URL مطلوب"; exit 1; }

      echo "▶ Building and starting Step 6 stack..."
      docker compose -f docker-compose.step6.yml up -d --build

      echo ""
      echo "▶ Waiting for services to be healthy (60s)..."
      sleep 10

      PASS=0; FAIL=0
      check_svc() {
        if curl -sf --connect-timeout 5 "$2/health" >/dev/null 2>&1; then
          echo "  ✅ $1 ($2)"; PASS=$((PASS+1))
        else
          echo "  ❌ $1 ($2) — not healthy yet"; FAIL=$((FAIL+1))
        fi
      }

      check_svc "orchestrator-service" "http://localhost:8006"
      check_svc "user-service"         "http://localhost:8001"
      check_svc "planning-agent"       "http://localhost:8002"

      echo ""
      echo "▶ Docker Compose status:"
      docker compose -f docker-compose.step6.yml ps

      echo ""
      echo "▶ Metrics endpoints:"
      echo "  orchestrator: curl http://localhost:8006/metrics | grep cogniforge_outbox"
      echo "  user-service: curl http://localhost:8001/metrics | grep cogniforge_user"
      echo "  planning:     curl http://localhost:8002/metrics | grep cogniforge_planning"
      echo ""
      echo "▶ Grafana dashboards:"
      echo "  Step 4: http://localhost:3001/d/cogniforge-ms-step4-persistence"
      echo "  Step 5: http://localhost:3001/d/cogniforge-ms-step5-user-service"
      echo "  Step 6: http://localhost:3001/d/cogniforge-ms-step6-planning-agent"
      echo ""
      echo "▶ Stop stack:"
      echo "  docker compose -f docker-compose.step6.yml down"
      echo ""
      echo "═══════════════════════════════════════════════════════════"
      echo "  Results: ✅ $PASS healthy | ❌ $FAIL not ready"
      [ "$FAIL" -eq 0 ] && echo "  🎉 Step 6 Docker Stack RUNNING" || echo "  ⚠️  بعض الخدمات لم تصبح جاهزة بعد — انتظر 30 ثانية وأعد المحاولة"
      echo "═══════════════════════════════════════════════════════════"
    triggeredBy:
      - manual

  run-step6-tests:
    name: "Run Step 6 Planning Agent Tests"
    description: اختبارات الخطوة 6 — planning-agent Prometheus metrics + DSPy + /metrics endpoint.
    command: |
      set -euo pipefail
      export DATABASE_URL="sqlite+aiosqlite:///:memory:"
      export PLANNING_DATABASE_URL="sqlite+aiosqlite:///:memory:"
      export PLANNING_OPENROUTER_API_KEY="${OPENROUTER_API_KEY:-dummy-key-for-tests}"
      export SECRET_KEY="test-secret-key-for-step6-tests"
      export ENVIRONMENT="testing"
      export LLM_MOCK_MODE="1"
      echo "🧪 Running Step 6 planning-agent tests..."
      python -m pytest \
        tests/microservices/planning_agent/test_step6_planning_agent_metrics.py \
        -v --tb=short --no-header -q 2>&1 | tail -60
      echo "✅ Step 6 tests complete."
    triggeredBy:
      - manual

  # ── Step 7: Research Agent ────────────────────────────────────────────────

  verify-step7-research-agent:
    name: "Verify Step 7 — Research Agent Live Metrics"
    description: |
      يتحقق من أن research-agent يعمل على :8007 ويُصدِّر مقاييس Prometheus حقيقية.
      يفحص: /health + /metrics + Tavily status + Prometheus scrape target + Grafana dashboard.
    command: |
      set -euo pipefail
      echo "═══════════════════════════════════════════════════════════"
      echo "  CogniForge — Step 7: Research Agent Live Verification"
      echo "═══════════════════════════════════════════════════════════"
      echo ""
      PASS=0; FAIL=0

      check() {
        local label="$1"; local cmd="$2"
        if eval "$cmd" >/dev/null 2>&1; then
          echo "  ✅ $label"; PASS=$((PASS+1))
        else
          echo "  ❌ $label"; FAIL=$((FAIL+1))
        fi
      }

      echo "▶ Health endpoint"
      check "GET /health → 200" "curl -sf http://localhost:8007/health"
      HEALTH=$(curl -sf http://localhost:8007/health 2>/dev/null || echo '{}')
      echo "  Response: $HEALTH"
      TAVILY_STATUS=$(echo "$HEALTH" | python3 -c "import sys,json; print(json.load(sys.stdin).get('tavily_available','?'))" 2>/dev/null || echo "?")
      echo "  Tavily available: $TAVILY_STATUS"
      echo ""

      echo "▶ Prometheus /metrics endpoint"
      check "GET /metrics → 200" "curl -sf http://localhost:8007/metrics"
      check "cogniforge_research_startup_info present" \
        "curl -sf http://localhost:8007/metrics | grep -q cogniforge_research_startup"
      check "cogniforge_research_requests_total present" \
        "curl -sf http://localhost:8007/metrics | grep -q cogniforge_research_requests_total"
      check "cogniforge_research_tavily_calls_total present" \
        "curl -sf http://localhost:8007/metrics | grep -q cogniforge_research_tavily_calls_total"
      check "cogniforge_research_searches_total present" \
        "curl -sf http://localhost:8007/metrics | grep -q cogniforge_research_searches_total"
      echo ""

      echo "▶ Prometheus scrape target"
      check "research-agent target UP in Prometheus" \
        "curl -sf 'http://localhost:9090/api/v1/targets' | python3 -c \"import sys,json; d=json.load(sys.stdin); targets=[t for t in d.get('data',{}).get('activeTargets',[]) if 'research-agent' in t.get('labels',{}).get('job','')]; exit(0 if any(t.get('health')=='up' for t in targets) else 1)\""
      echo ""

      echo "▶ Grafana dashboard"
      check "Dashboard cogniforge-ms-step7-research-agent accessible" \
        "curl -sf 'http://localhost:3001/api/dashboards/uid/cogniforge-ms-step7-research-agent' -u admin:admin"
      echo ""

      echo "▶ Process check"
      PID=$(pgrep -f "uvicorn microservices.research_agent" 2>/dev/null || echo "")
      if [ -n "$PID" ]; then
        echo "  ✅ research-agent process running (PID=$PID)"; PASS=$((PASS+1))
      else
        echo "  ❌ research-agent process NOT found"; FAIL=$((FAIL+1))
      fi
      echo ""

      echo "▶ Metrics sample"
      curl -sf http://localhost:8007/metrics 2>/dev/null | grep "^cogniforge_research" | head -15 || echo "  (metrics not available)"
      echo ""

      echo "═══════════════════════════════════════════════════════════"
      STATUS=$( [ "$FAIL" -eq 0 ] && echo "✅ ALL PASS" || echo "⚠️  $FAIL FAILED" )
      echo "  Results: ✅ $PASS passed | ❌ $FAIL failed | Status: $STATUS"
      [ "$FAIL" -eq 0 ] && echo "  🎉 Step 7 RESEARCH-AGENT ACTIVE" || echo "  ⚠️  بعض المقاييس غائبة"
      echo ""
      echo "  Grafana: http://localhost:3001/d/cogniforge-ms-step7-research-agent"
      echo "  Logs:    cat /app/.observability/research_agent.log"
      echo "═══════════════════════════════════════════════════════════"
      [ "$FAIL" -eq 0 ]
    triggeredBy:
      - manual

  restart-research-agent:
    name: "Restart Research Agent"
    description: يوقف research-agent ويُعيد تشغيله يدوياً على :8007.
    command: |
      set -euo pipefail
      echo "🔄 Restarting research-agent on :8007..."
      pkill -f "uvicorn microservices.research_agent" 2>/dev/null || true
      sleep 2

      _raw_db="${RESEARCH_DATABASE_URL:-${DATABASE_URL:-}}"
      _async_db="${_raw_db/postgresql:\/\//postgresql+asyncpg://}"
      _async_db="${_async_db/postgresql+psycopg2:\/\//postgresql+asyncpg://}"
      _async_db=$(echo "$_async_db" | sed 's/[?&]sslmode=[^&]*//' | sed 's/[?&]ssl=[^&]*//')

      mkdir -p /app/.observability
      RESEARCH_DATABASE_URL="$_async_db" \
      TAVILY_API_KEY="${TAVILY_API_KEY:-}" \
      OPENROUTER_API_KEY="${OPENROUTER_API_KEY:-}" \
      ENVIRONMENT="${ENVIRONMENT:-development}" \
      SECRET_KEY="${SECRET_KEY:-cogniforge-research-agent-dev-key}" \
      PYTHONPATH="/app" \
      nohup python -m uvicorn microservices.research_agent.main:app \
        --host 0.0.0.0 --port 8007 --workers 1 --log-level info \
        >> /app/.observability/research_agent.log 2>&1 &

      echo "⏳ Waiting for research-agent to be ready..."
      for i in $(seq 1 20); do
        if curl -sf http://localhost:8007/health >/dev/null 2>&1; then
