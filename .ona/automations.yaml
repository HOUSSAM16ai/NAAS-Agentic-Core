# .ona/automations.yaml
# ─────────────────────────────────────────────────────────────────────────────
# CogniForge — Ona Automations
# الخطوة الانتقالية الثالثة: تفعيل orchestrator-service كـ Ona service حي
#
# الخدمات:
#   orchestrator-stack  — يُشغِّل postgres-orchestrator + redis + orchestrator-service
#
# المهام:
#   verify-stack        — يتحقق من صحة الـ stack بعد الإقلاع
#   health-probe        — يستعلم /health و /metrics من orchestrator-service
#   run-tests           — يُشغِّل اختبارات الانتقال
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ─────────────────────────────────────────────────────────────────────────
  # orchestrator-stack: الخدمة الرئيسية للخطوة 3
  # تُشغِّل: postgres-orchestrator + redis-orchestrator + orchestrator-service
  # ─────────────────────────────────────────────────────────────────────────
  orchestrator-stack:
    name: "Orchestrator Stack (Step 3)"
    description: |
      يُشغِّل الـ orchestrator-service مع قاعدة بياناته المستقلة وRedis.
      الخطوة الانتقالية الثالثة نحو الخدمات المصغرة.
      بعد الإقلاع: curl http://localhost:8006/health
    commands:
      start: |
        set -euo pipefail

        # ─── حقن المتغيرات البيئية ─────────────────────────────────────────
        # المفاتيح تُقرأ من بيئة Ona (Gitpod Secrets) أو .devcontainer/secrets.env
        export OPENROUTER_API_KEY="${OPENROUTER_API_KEY:?OPENROUTER_API_KEY not set — add it to Gitpod Secrets}"
        export TAVILY_API_KEY="${TAVILY_API_KEY:-}"
        export SECRET_KEY="${SECRET_KEY:-cogniforge-step3-dev-secret-key-change-in-prod}"
        export POSTGRES_USER="${POSTGRES_USER:-cogniforge}"
        export POSTGRES_PASSWORD="${POSTGRES_PASSWORD:-cogniforge_pass}"

        echo "🚀 [Step 3] Starting orchestrator stack..."
        echo "   OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:0:20}..."
        echo "   TAVILY_API_KEY: ${TAVILY_API_KEY:0:15}..."

        # ─── تشغيل الـ stack ───────────────────────────────────────────────
        docker compose -f docker-compose.step3.yml up -d --build --remove-orphans

        echo "✅ [Step 3] Stack started. Waiting for health..."

        # ─── انتظار جاهزية orchestrator-service ───────────────────────────
        MAX_WAIT=120
        ELAPSED=0
        until curl -sf http://localhost:8006/health > /dev/null 2>&1; do
          if [ "$ELAPSED" -ge "$MAX_WAIT" ]; then
            echo "❌ [Step 3] orchestrator-service did not become healthy after ${MAX_WAIT}s"
            docker compose -f docker-compose.step3.yml logs orchestrator-service --tail=50
            exit 1
          fi
          echo "   ⏳ Waiting for orchestrator-service... (${ELAPSED}s/${MAX_WAIT}s)"
          sleep 5
          ELAPSED=$((ELAPSED + 5))
        done

        echo "✅ [Step 3] orchestrator-service is LIVE at :8006"
        curl -s http://localhost:8006/health | python3 -m json.tool

      ready: |
        curl -sf http://localhost:8006/health

      stop: |
        echo "🛑 [Step 3] Stopping orchestrator stack..."
        docker compose -f docker-compose.step3.yml down
        echo "✅ [Step 3] Stack stopped."

tasks:

  # ─────────────────────────────────────────────────────────────────────────
  # health-probe: استعلام صحة orchestrator-service بشكل مفصل
  # ─────────────────────────────────────────────────────────────────────────
  health-probe:
    name: "Orchestrator Health Probe"
    description: |
      يستعلم /health و /metrics من orchestrator-service ويطبع التقرير الكامل.
      يُستخدم للتحقق الحي بعد تشغيل orchestrator-stack.
    command: |
      set -euo pipefail

      ORCHESTRATOR_URL="http://localhost:8006"

      echo "═══════════════════════════════════════════════════════════"
      echo "  CogniForge — Orchestrator Health Probe (Step 3)"
      echo "═══════════════════════════════════════════════════════════"

      # ─── /health ──────────────────────────────────────────────────────
      echo ""
      echo "▶ GET ${ORCHESTRATOR_URL}/health"
      HEALTH=$(curl -sf "${ORCHESTRATOR_URL}/health" 2>/dev/null) || {
        echo "❌ orchestrator-service غير متاح على :8006"
        echo "   شغّل أولاً: gitpod automations service start orchestrator-stack"
        exit 1
      }
      echo "$HEALTH" | python3 -m json.tool

      STATUS=$(echo "$HEALTH" | python3 -c "import sys,json; print(json.load(sys.stdin).get('status','unknown'))")
      GRAPH_READY=$(echo "$HEALTH" | python3 -c "import sys,json; print(json.load(sys.stdin).get('graph_ready', False))")
      STARTUP=$(echo "$HEALTH" | python3 -c "import sys,json; print(json.load(sys.stdin).get('startup_state','unknown'))")

      echo ""
      echo "  Status       : $STATUS"
      echo "  Graph Ready  : $GRAPH_READY"
      echo "  Startup State: $STARTUP"

      # ─── /metrics ─────────────────────────────────────────────────────
      echo ""
      echo "▶ GET ${ORCHESTRATOR_URL}/metrics (Prometheus)"
      METRICS=$(curl -sf "${ORCHESTRATOR_URL}/metrics" 2>/dev/null) || echo "  (metrics endpoint غير متاح)"
      if [ -n "$METRICS" ]; then
        echo "$METRICS" | grep -E "^cogniforge_|^# HELP cogniforge_" | head -30 || echo "  (لا توجد metrics بادئة cogniforge_)"
      fi

      # ─── تقرير Prometheus scrape ──────────────────────────────────────
      echo ""
      echo "▶ Prometheus Scrape Status (localhost:9090)"
      PROM_TARGETS=$(curl -sf "http://localhost:9090/api/v1/targets" 2>/dev/null) || echo "  (Prometheus غير متاح)"
      if [ -n "$PROM_TARGETS" ]; then
        echo "$PROM_TARGETS" | python3 -c "
import sys, json
d = json.load(sys.stdin)
targets = d.get('data', {}).get('activeTargets', [])
for t in targets:
    job = t.get('labels', {}).get('job', '?')
    health = t.get('health', '?')
    url = t.get('scrapeUrl', '?')
    icon = '✅' if health == 'up' else '❌'
    print(f'  {icon} [{job}] {health} — {url}')
" 2>/dev/null || echo "  (تعذّر تحليل targets)"
      fi

      echo ""
      echo "═══════════════════════════════════════════════════════════"
      if [ "$STATUS" = "ok" ] || [ "$STATUS" = "degraded" ]; then
        echo "  ✅ orchestrator-service LIVE — Step 3 ACTIVE"
      else
        echo "  ⚠️  orchestrator-service في حالة: $STATUS"
      fi
      echo "═══════════════════════════════════════════════════════════"
    triggeredBy:
      - manual

  # ─────────────────────────────────────────────────────────────────────────
  # verify-stack: تحقق شامل من الـ stack بعد الإقلاع
  # ─────────────────────────────────────────────────────────────────────────
  verify-stack:
    name: "Verify Microservices Stack (Step 3)"
    description: |
      يتحقق من صحة جميع مكونات الـ stack:
        - postgres-orchestrator (port 5441)
        - redis-orchestrator (port 6380)
        - orchestrator-service (port 8006)
        - Prometheus scrape targets
        - Grafana dashboards
    command: |
      set -euo pipefail

      PASS=0
      FAIL=0

      check() {
        local name="$1"
        local cmd="$2"
        if eval "$cmd" > /dev/null 2>&1; then
          echo "  ✅ $name"
          PASS=$((PASS + 1))
        else
          echo "  ❌ $name"
          FAIL=$((FAIL + 1))
        fi
      }

      echo "═══════════════════════════════════════════════════════════"
      echo "  CogniForge — Stack Verification (Step 3)"
      echo "═══════════════════════════════════════════════════════════"
      echo ""

      echo "▶ Infrastructure"
      check "postgres-orchestrator :5441" "pg_isready -h localhost -p 5441 -U cogniforge -d orchestrator_db"
      check "redis-orchestrator :6380" "redis-cli -p 6380 ping"
      check "orchestrator-service :8006" "curl -sf http://localhost:8006/health"
      check "FastAPI monolith :8000" "curl -sf http://localhost:8000/health"
      check "Grafana :3001" "curl -sf http://localhost:3001/api/health"
      check "Prometheus :9090" "curl -sf http://localhost:9090/-/healthy"

      echo ""
      echo "▶ Orchestrator Health Detail"
      HEALTH=$(curl -sf http://localhost:8006/health 2>/dev/null) || HEALTH="{}"
      STATUS=$(echo "$HEALTH" | python3 -c "import sys,json; print(json.load(sys.stdin).get('status','unknown'))" 2>/dev/null || echo "unknown")
      GRAPH=$(echo "$HEALTH" | python3 -c "import sys,json; print(json.load(sys.stdin).get('graph_ready',False))" 2>/dev/null || echo "false")
      echo "  Status: $STATUS | Graph Ready: $GRAPH"

      echo ""
      echo "▶ Docker Containers"
      docker compose -f docker-compose.step3.yml ps 2>/dev/null || echo "  (docker compose غير متاح)"

      echo ""
      echo "═══════════════════════════════════════════════════════════"
      echo "  Results: ✅ $PASS passed | ❌ $FAIL failed"
      if [ "$FAIL" -eq 0 ]; then
        echo "  🎉 Step 3 FULLY OPERATIONAL"
      else
        echo "  ⚠️  $FAIL checks failed — راجع الـ logs"
      fi
      echo "═══════════════════════════════════════════════════════════"
    triggeredBy:
      - manual

  # ─────────────────────────────────────────────────────────────────────────
  # run-step3-tests: تشغيل اختبارات الانتقال للخطوة 3
  # ─────────────────────────────────────────────────────────────────────────
  run-step3-tests:
    name: "Run Step 3 Transition Tests"
    description: |
      يُشغِّل اختبارات الانتقال للخطوة 3:
        - tests/microservices/orchestrator_service/
        - tests/infrastructure/test_routing_policy.py
        - tests/contracts/test_exercise_retrieval_contracts.py
    command: |
      set -euo pipefail

      export DATABASE_URL="sqlite+aiosqlite:///:memory:"
      export SECRET_KEY="test-secret-key-for-step3-tests"
      export ENVIRONMENT="testing"
      export OPENROUTER_API_KEY="${OPENROUTER_API_KEY:-dummy-key-for-tests}"
      export TAVILY_API_KEY="${TAVILY_API_KEY:-}"
      export LLM_MOCK_MODE="1"

      echo "🧪 [Step 3] Running transition tests..."
      echo ""

      python -m pytest \
        tests/microservices/orchestrator_service/ \
        tests/infrastructure/test_routing_policy.py \
        tests/contracts/test_exercise_retrieval_contracts.py \
        -v \
        --tb=short \
        --no-header \
        -q \
        2>&1 | tail -40

      echo ""
      echo "✅ [Step 3] Tests complete."
    triggeredBy:
      - manual
