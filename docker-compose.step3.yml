# docker-compose.step3.yml
# ─────────────────────────────────────────────────────────────────────────────
# الخطوة الانتقالية الثالثة نحو الخدمات المصغرة — Step 3: Live Activation
#
# يُشغِّل هذا الملف الخدمات الأساسية فقط لتفعيل orchestrator-service بشكل حي:
#   1. postgres-orchestrator  — قاعدة بيانات مستقلة للـ orchestrator
#   2. redis-orchestrator     — ذاكرة تخزين مؤقت مستقلة
#   3. orchestrator-service   — الخدمة الرئيسية (13-node StateGraph)
#
# الاستخدام:
#   docker compose -f docker-compose.step3.yml up -d
#   docker compose -f docker-compose.step3.yml logs -f orchestrator-service
#   docker compose -f docker-compose.step3.yml down
#
# التحقق الحي:
#   curl http://localhost:8006/health
#   curl http://localhost:8006/metrics
#
# ملاحظة: يستخدم Supabase كقاعدة بيانات رئيسية للمونوليث (DATABASE_URL).
#          postgres-orchestrator هي قاعدة بيانات مستقلة للـ orchestrator فقط.
# ─────────────────────────────────────────────────────────────────────────────

version: "3.9"

services:

  # ─────────────────────────────────────────────────────────────────────────
  # 1. قاعدة بيانات مستقلة للـ orchestrator
  # ─────────────────────────────────────────────────────────────────────────
  postgres-orchestrator:
    image: postgres:15-alpine
    container_name: cogniforge-postgres-orchestrator-step3
    restart: unless-stopped
    ports:
      - "5441:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cogniforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cogniforge_pass}
      POSTGRES_DB: orchestrator_db
    volumes:
      - ./infra/postgres/init-orchestrator-db.sh:/docker-entrypoint-initdb.d/init.sh:ro
      - postgres-orchestrator-step3-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cogniforge} -d orchestrator_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - cogniforge-step3

  # ─────────────────────────────────────────────────────────────────────────
  # 2. Redis مستقل للـ orchestrator
  # ─────────────────────────────────────────────────────────────────────────
  redis-orchestrator:
    image: redis:7.2-alpine
    container_name: cogniforge-redis-orchestrator-step3
    restart: unless-stopped
    ports:
      - "6380:6379"
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --save ""
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - cogniforge-step3

  # ─────────────────────────────────────────────────────────────────────────
  # 3. orchestrator-service — الخدمة الرئيسية (13-node StateGraph)
  # ─────────────────────────────────────────────────────────────────────────
  orchestrator-service:
    build:
      context: .
      dockerfile: microservices/orchestrator_service/Dockerfile
    container_name: cogniforge-orchestrator-step3
    restart: unless-stopped
    ports:
      - "8006:8006"
    environment:
      # ─── هوية الخدمة ───────────────────────────────────────────────────
      SERVICE_NAME: orchestrator-service
      SERVICE_VERSION: "3.0.0-step3"
      ENVIRONMENT: development

      # ─── مفاتيح LLM (مطلوبة للـ StateGraph) ───────────────────────────
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:?OPENROUTER_API_KEY is required — set it in .env.docker or export it}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}

      # ─── قاعدة البيانات المستقلة ────────────────────────────────────────
      ORCHESTRATOR_DATABASE_URL: postgresql://${POSTGRES_USER:-cogniforge}:${POSTGRES_PASSWORD:-cogniforge_pass}@postgres-orchestrator:5432/orchestrator_db

      # ─── Redis ──────────────────────────────────────────────────────────
      REDIS_URL: redis://redis-orchestrator:6379

      # ─── خدمات مصغرة أخرى (اختيارية في Step 3) ─────────────────────────
      PLANNING_AGENT_URL: http://localhost:8001
      MEMORY_AGENT_URL: http://localhost:8002
      RESEARCH_AGENT_URL: http://localhost:8007
      REASONING_AGENT_URL: http://localhost:8008
      USER_SERVICE_URL: http://localhost:8003
      AUDITOR_SERVICE_URL: http://localhost:8009

      # ─── أمان ───────────────────────────────────────────────────────────
      SECRET_KEY: ${SECRET_KEY:-cogniforge-step3-dev-secret-key-change-in-prod}

      # ─── مراقبة ─────────────────────────────────────────────────────────
      OTEL_SERVICE_NAME: orchestrator-service
      OTEL_EXPORTER_OTLP_ENDPOINT: ""
      LOG_LEVEL: INFO

      # ─── Outbox relay (معطل في Step 3 — يُفعَّل في Step 4) ──────────────
      OUTBOX_RELAY_ENABLED: "false"

    command: >
      uvicorn microservices.orchestrator_service.main:app
      --host 0.0.0.0
      --port 8006
      --workers 1
      --log-level info
      --access-log
    depends_on:
      postgres-orchestrator:
        condition: service_healthy
      redis-orchestrator:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8006/health | python3 -c \"import sys,json; d=json.load(sys.stdin); sys.exit(0 if d.get('status') in ('ok','degraded') else 1)\""]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - cogniforge-step3
    labels:
      cogniforge.step: "3"
      cogniforge.tier: "microservice"
      cogniforge.service: "orchestrator"

networks:
  cogniforge-step3:
    name: cogniforge-step3
    driver: bridge

volumes:
  postgres-orchestrator-step3-data:
    name: cogniforge-postgres-orchestrator-step3-data
