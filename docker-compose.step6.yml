# =============================================================================
# docker-compose.step6.yml — Step 6: Planning Agent + Full Microservices Stack
# =============================================================================
# الخطوة 6: تفعيل planning-agent مع orchestrator-service و user-service
# في بيئة Docker Compose كاملة (للتطوير المحلي وCI — ليس Codespaces).
#
# في Codespaces: supervisor.sh يُشغِّل الخدمات كـ uvicorn processes مباشرة.
# في Docker: هذا الملف يُشغِّل الـ stack الكامل بما فيه planning-agent.
#
# الاستخدام:
#   docker compose -f docker-compose.step6.yml up -d
#   docker compose -f docker-compose.step6.yml ps
#   docker compose -f docker-compose.step6.yml logs -f planning-agent
#   docker compose -f docker-compose.step6.yml down
#
# المتغيرات المطلوبة (من .env أو Codespaces Secrets):
#   OPENROUTER_API_KEY  — لتفعيل DSPy/LangGraph في planning-agent
#   TAVILY_API_KEY      — لتفعيل web search في orchestrator-service
#   DATABASE_URL        — Supabase PgBouncer (مشترك بين الخدمات)
# =============================================================================

version: "3.9"

services:

  # ── Infrastructure ──────────────────────────────────────────────────────────

  redis-step6:
    image: redis:7.2-alpine
    container_name: cogniforge-redis-step6
    restart: unless-stopped
    ports:
      - "6381:6379"
    networks:
      - cogniforge-step6-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ── Orchestrator Service (Step 4 — OUTBOX_RELAY + /metrics) ────────────────

  orchestrator-service:
    build:
      context: .
      dockerfile: microservices/orchestrator_service/Dockerfile
    container_name: cogniforge-orchestrator-step6
    restart: unless-stopped
    ports:
      - "8006:8006"
    environment:
      - SERVICE_NAME=orchestrator-service
      - SERVICE_VERSION=1.0.0
      - ENVIRONMENT=development
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
      - ORCHESTRATOR_DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=redis://redis-step6:6379
      - OUTBOX_RELAY_ENABLED=true
      - OUTBOX_RELAY_INTERVAL_SECONDS=15
      - OUTBOX_RELAY_BATCH_SIZE=50
      - PLANNING_AGENT_URL=http://planning-agent:8002
      - USER_SERVICE_URL=http://user-service:8001
    command: >
      python -m uvicorn microservices.orchestrator_service.main:app
      --host 0.0.0.0 --port 8006 --workers 1 --log-level info
    networks:
      - cogniforge-step6-network
    depends_on:
      redis-step6:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8006/health"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ── User Service (Step 5 — /metrics) ───────────────────────────────────────

  user-service:
    build:
      context: .
      dockerfile: microservices/user_service/Dockerfile
    container_name: cogniforge-user-step6
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      - SERVICE_NAME=user-service
      - SERVICE_VERSION=1.0.0
      - ENVIRONMENT=development
      - USER_DATABASE_URL=${DATABASE_URL}
      - DATABASE_URL=${DATABASE_URL}
      - SECRET_KEY=${SECRET_KEY:-cogniforge-user-service-dev-key}
    command: >
      python -m uvicorn microservices.user_service.main:app
      --host 0.0.0.0 --port 8001 --workers 1 --log-level info
    networks:
      - cogniforge-step6-network
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8001/health"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 20s

  # ── Planning Agent (Step 6 — DSPy + LangGraph + /metrics) ──────────────────

  planning-agent:
    build:
      context: .
      dockerfile: microservices/planning_agent/Dockerfile
    container_name: cogniforge-planning-step6
    restart: unless-stopped
    ports:
      - "8002:8002"
    environment:
      - SERVICE_NAME=planning-agent
      - SERVICE_VERSION=1.0.0
      - ENVIRONMENT=development
      - PLANNING_DATABASE_URL=${DATABASE_URL}
      - DATABASE_URL=${DATABASE_URL}
      - PLANNING_OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - PLANNING_SECRET_KEY=${SECRET_KEY:-cogniforge-planning-agent-dev-key}
      - PLANNING_AI_MODEL=nvidia/nemotron-3-nano-30b-a3b:free
      - PLANNING_AI_BASE_URL=https://openrouter.ai/api/v1
    command: >
      python -m uvicorn microservices.planning_agent.main:app
      --host 0.0.0.0 --port 8002 --workers 1 --log-level info
    networks:
      - cogniforge-step6-network
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8002/health"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s

networks:
  cogniforge-step6-network:
    driver: bridge
    name: cogniforge-step6-network
