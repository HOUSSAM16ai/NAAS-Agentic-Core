services:
  # ==========================================
  # Infrastructure Services
  # ==========================================

  redis:
    image: redis:7.2-alpine
    container_name: cogniforge-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - cogniforge-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis - Dedicated for Orchestrator (Renamed to avoid conflict)
  redis-orchestrator:
    image: redis:alpine
    container_name: cogniforge-redis-orchestrator
    ports:
      - "6380:6379"
    networks:
      - cogniforge-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Postgres Planning - Dedicated
  postgres-planning:
    image: postgres:15-alpine
    container_name: cogniforge-postgres-planning
    ports:
      - "5435:5432"
    networks:
      - cogniforge-network
    volumes:
      - ./infra/postgres/init-planning-db.sh:/docker-entrypoint-initdb.d/init.sh
      - postgres-planning-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: planning_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d planning_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Postgres Memory - Dedicated
  postgres-memory:
    image: postgres:15-alpine
    container_name: cogniforge-postgres-memory
    ports:
      - "5436:5432"
    networks:
      - cogniforge-network
    volumes:
      - ./infra/postgres/init-memory-db.sh:/docker-entrypoint-initdb.d/init.sh
      - postgres-memory-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: memory_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d memory_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Postgres User - Dedicated
  postgres-user:
    image: postgres:15-alpine
    container_name: cogniforge-postgres-user
    ports:
      - "5437:5432"
    networks:
      - cogniforge-network
    volumes:
      - ./infra/postgres/init-user-db.sh:/docker-entrypoint-initdb.d/init.sh
      - postgres-user-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: user_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d user_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Postgres Research - Dedicated
  postgres-research:
    image: postgres:15-alpine
    container_name: cogniforge-postgres-research
    ports:
      - "5438:5432"
    networks:
      - cogniforge-network
    volumes:
      - ./infra/postgres/init-research-db.sh:/docker-entrypoint-initdb.d/init.sh
      - postgres-research-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: research_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d research_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Postgres Reasoning - Dedicated
  postgres-reasoning:
    image: postgres:15-alpine
    container_name: cogniforge-postgres-reasoning
    ports:
      - "5439:5432"
    networks:
      - cogniforge-network
    volumes:
      - ./infra/postgres/init-reasoning-db.sh:/docker-entrypoint-initdb.d/init.sh
      - postgres-reasoning-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: reasoning_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d reasoning_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Postgres Observability - Dedicated
  postgres-observability:
    image: postgres:15-alpine
    container_name: cogniforge-postgres-observability
    ports:
      - "5440:5432"
    networks:
      - cogniforge-network
    volumes:
      - ./infra/postgres/init-observability-db.sh:/docker-entrypoint-initdb.d/init.sh
      - postgres-observability-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: observability_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d observability_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Postgres Orchestrator - Dedicated
  postgres-orchestrator:
    image: postgres:15-alpine
    container_name: cogniforge-postgres-orchestrator
    ports:
      - "5441:5432"
    networks:
      - cogniforge-network
    volumes:
      - ./infra/postgres/init-orchestrator-db.sh:/docker-entrypoint-initdb.d/init.sh
      - postgres-orchestrator-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: orchestrator_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d orchestrator_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ==========================================
  # Core Platform Services (Modern Architecture)
  # ==========================================

  # Frontend - Next.js Application
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cogniforge-frontend
    ports:
      - "3000:3000"
    networks:
      - cogniforge-network
    environment:
      # API_URL tells the Next.js server side proxy where to find the backend
      API_URL: http://api-gateway:8000
    depends_on:
      - api-gateway

  # API Gateway - Central Microservice Gateway
  api-gateway:
    build:
      context: ./microservices/api_gateway
      dockerfile: Dockerfile
    container_name: cogniforge-gateway
    ports:
      - "8000:8000"  # Takes over the primary port
    environment:
      - ENVIRONMENT=production
      # R0.1 (D-172): production config must be explicit — '*' is rejected by the
      # settings validators under ENVIRONMENT=production (a real fail-on-first-run).
      - BACKEND_CORS_ORIGINS=http://localhost:3000,http://localhost:8000
      - ALLOWED_HOSTS=localhost,127.0.0.1,api-gateway,orchestrator-service,frontend,planning-agent,research-agent,reasoning-agent,conversation-service
      - SECRET_KEY=${SECRET_KEY:-super_secret_key_change_in_production}
      - PLANNING_AGENT_URL=http://planning-agent:8001
      - MEMORY_AGENT_URL=http://memory-agent:8002
      - USER_SERVICE_URL=http://user-service:8003
      - OBSERVABILITY_SERVICE_URL=http://observability-service:8005
      - RESEARCH_AGENT_URL=http://research-agent:8007
      - REASONING_AGENT_URL=http://reasoning-agent:8008
      - ORCHESTRATOR_SERVICE_URL=http://orchestrator-service:8006
    command: uvicorn microservices.api_gateway.main:app --host 0.0.0.0 --port 8000
    depends_on:
      - planning-agent
      - memory-agent
      - user-service
      - observability-service
      - research-agent
      - reasoning-agent
      - orchestrator-service
    networks:
      - cogniforge-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Planning Agent - Generator of Plans
  planning-agent:
    build:
      context: ./microservices/planning_agent
      dockerfile: Dockerfile
    container_name: cogniforge-planning-agent
    ports:
      - "8001:8001"
    environment:
      - SERVICE_NAME=planning-agent
      - SERVICE_VERSION=1.0.0
      - SECRET_KEY=${SECRET_KEY:-super_secret_key_change_in_production}
      # R0.1 (D-172): planning-agent uses create_async_engine → requires the
      # asyncpg driver. Bare postgresql:// loads psycopg2 (sync) and crashes at
      # boot ("asyncio extension requires an async driver"). Documented pattern
      # (ISS-038-B) — the compose URLs were still on the sync scheme.
      - PLANNING_DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@postgres-planning:5432/planning_db
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@postgres-planning:5432/planning_db
    command: uvicorn microservices.planning_agent.main:app --host 0.0.0.0 --port 8001
    networks:
      - cogniforge-network
    depends_on:
      postgres-planning:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Memory Agent
  memory-agent:
    build:
      context: ./microservices/memory_agent
      dockerfile: Dockerfile
    container_name: cogniforge-memory-agent
    ports:
      - "8002:8002"
    environment:
      - SERVICE_NAME=memory-agent
      - SERVICE_VERSION=1.0.0
      - SECRET_KEY=${SECRET_KEY:-super_secret_key_change_in_production}
      - MEMORY_DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@postgres-memory:5432/memory_db?options=-c%20search_path%3Dmemory
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@postgres-memory:5432/memory_db?options=-c%20search_path%3Dmemory
    command: uvicorn microservices.memory_agent.main:app --host 0.0.0.0 --port 8002
    networks:
      - cogniforge-network
    depends_on:
      postgres-memory:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # User Service
  user-service:
    build:
      context: ./microservices/user_service
      dockerfile: Dockerfile
    container_name: cogniforge-user-service
    ports:
      - "8003:8003"
    environment:
      - SERVICE_NAME=user-service
      - SERVICE_VERSION=1.0.0
      - SECRET_KEY=${SECRET_KEY:-super_secret_key_change_in_production}
      - USER_DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@postgres-user:5432/user_db?options=-c%20search_path%3Duser_service
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@postgres-user:5432/user_db?options=-c%20search_path%3Duser_service
    command: uvicorn microservices.user_service.main:app --host 0.0.0.0 --port 8003
    networks:
      - cogniforge-network
    depends_on:
      postgres-user:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Observability Service
  observability-service:
    build:
      context: ./microservices/observability_service
      dockerfile: Dockerfile
    container_name: cogniforge-observability
    ports:
      - "8005:8005"
    environment:
      - SERVICE_NAME=observability-service
      - SERVICE_VERSION=1.0.0
      - SECRET_KEY=${SECRET_KEY:-super_secret_key_change_in_production}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@postgres-observability:5432/observability_db?options=-c%20search_path%3Dobservability
    command: uvicorn microservices.observability_service.main:app --host 0.0.0.0 --port 8005
    networks:
      - cogniforge-network
    depends_on:
      postgres-observability:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8005/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Orchestrator Service - The Maestro
  orchestrator-service:
    build:
      context: ./microservices/orchestrator_service
      dockerfile: Dockerfile
    container_name: cogniforge-orchestrator
    restart: always
    volumes:
      - .:/workspace:ro
    ports:
      - "8006:8006"
    environment:
      - SERVICE_NAME=orchestrator-service
      # R0.1 (D-172): the image runs as non-root `appuser` with no writable home,
      # so DSPy/llama-index cache writes to $HOME crash graph compile
      # ("Permission denied: '/home/appuser'"). Point HOME/caches at /tmp.
      - HOME=/tmp
      - XDG_CACHE_HOME=/tmp/.cache
      - ENVIRONMENT=production
      # R0.1 (D-172): explicit production CORS/hosts (validators reject '*') +
      # a strong ADMIN_TOOL_API_KEY (required in production/staging).
      - BACKEND_CORS_ORIGINS=http://localhost:3000,http://localhost:8000
      - ALLOWED_HOSTS=localhost,127.0.0.1,api-gateway,orchestrator-service,frontend,planning-agent,research-agent,reasoning-agent,conversation-service
      - ADMIN_TOOL_API_KEY=${ADMIN_TOOL_API_KEY:-cogniforge-admin-tool-key-change-me-in-real-prod}
      - SECRET_KEY=${SECRET_KEY:-super_secret_key_change_in_production}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
      # R0.1/R0.2 (D-172): asyncpg for the async engine (bare postgresql:// loads
      # psycopg2, which isn't installed → SQLModel init fails → checkpointer
      # silently degrades to MemorySaver). sslmode=disable for the local no-SSL
      # Postgres; _build_psycopg_conninfo converts this to psycopg for the checkpointer.
      - ORCHESTRATOR_DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@postgres-orchestrator:5432/orchestrator_db?sslmode=disable
      - REDIS_URL=redis://redis-orchestrator:6379
      - PLANNING_AGENT_URL=http://planning-agent:8001
      - MEMORY_AGENT_URL=http://memory-agent:8002
      - RESEARCH_AGENT_URL=http://research-agent:8007
      - REASONING_AGENT_URL=http://reasoning-agent:8008
      - USER_SERVICE_URL=http://user-service:8003
      - AUDITOR_SERVICE_URL=http://auditor-service:8009
    command: uvicorn microservices.orchestrator_service.main:app --host 0.0.0.0 --port 8006
    networks:
      - cogniforge-network
    depends_on:
      postgres-orchestrator:
        condition: service_healthy
      redis-orchestrator:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8006/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Research Agent
  research-agent:
    build:
      context: ./microservices/research_agent
      dockerfile: Dockerfile
    container_name: cogniforge-research-agent
    ports:
      - "8007:8007"
    environment:
      - SERVICE_NAME=research-agent
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@postgres-research:5432/research_db
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
    command: uvicorn microservices.research_agent.main:app --host 0.0.0.0 --port 8007
    networks:
      - cogniforge-network
    depends_on:
      postgres-research:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8007/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Auditor Service - The strict reviewer of the plans and execution
  auditor-service:
    build:
      context: ./microservices/auditor_service
      dockerfile: Dockerfile
    container_name: cogniforge-auditor-service
    ports:
      - "8009:8009"
    environment:
      - SERVICE_NAME=auditor-service
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
    command: uvicorn microservices.auditor_service.src.main:app --host 0.0.0.0 --port 8009
    networks:
      - cogniforge-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8009/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Notation Service (D-185) - "the system defines every symbol it prints" (ISS-138)
  # No DB, no API keys, no LLM: a stdlib-only symbol registry, so it always boots.
  notation-service:
    build:
      context: .
      dockerfile: microservices/notation_service/Dockerfile
    container_name: cogniforge-notation-service
    restart: always
    ports:
      - "8011:8011"
    environment:
      - SERVICE_NAME=notation-service
    networks:
      - cogniforge-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8011/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Reasoning Agent - Handles deep thinking requests
  reasoning-agent:
    build:
      context: ./microservices/reasoning_agent
      dockerfile: Dockerfile
    container_name: cogniforge-reasoning-agent
    ports:
      - "8008:8008"
    environment:
      - SERVICE_NAME=reasoning-agent
      - ENVIRONMENT=production
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@postgres-reasoning:5432/reasoning_db
    command: uvicorn microservices.reasoning_agent.main:app --host 0.0.0.0 --port 8008
    networks:
      - cogniforge-network
    depends_on:
      postgres-reasoning:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8008/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Conversation Service - HTTP/WS Parity
  conversation-service:
    build:
      context: ./microservices/conversation_service
      dockerfile: Dockerfile
    container_name: cogniforge-conversation-service
    ports:
      - "8010:8010"
    environment:
      - SERVICE_NAME=conversation-service
      - PORT=8010
    command: uvicorn microservices.conversation_service.main:app --host 0.0.0.0 --port 8010
    networks:
      - cogniforge-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8010/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ==========================================
  # Observability (R0.1 closure gate — real Prometheus + Grafana, D-172)
  # ==========================================

  # Prometheus — scrapes every /metrics-exposing service over the compose network
  prometheus:
    image: prom/prometheus:v2.55.0
    container_name: cogniforge-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./observability/compose/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    networks:
      - cogniforge-network
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5

  # Grafana — provisioned Prometheus datasource + 20 dashboards; anonymous viewer
  grafana:
    image: grafana/grafana:11.3.0
    container_name: cogniforge-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_USERS_DEFAULT_THEME=dark
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    networks:
      - cogniforge-network
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ==========================================
  # Event streaming + durable workflows (D-201)
  # ==========================================

  # Redpanda speaks the Kafka protocol from a single binary: no ZooKeeper, no
  # KRaft controller quorum to operate, and roughly a tenth of the memory of a
  # JVM broker. At this traffic level that is the honest weight — the platform
  # gets Kafka semantics without an operations team to run Kafka.
  redpanda:
    image: redpandadata/redpanda:v24.2.7
    container_name: cogniforge-redpanda
    restart: unless-stopped
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp=1
      - --memory=512M
      - --reserve-memory=0M
      - --node-id=0
      - --check=false
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:9092
    ports:
      - "9092:9092"
      - "9644:9644"
    networks:
      - cogniforge-network
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      # `cluster health` is the real readiness signal. A listening port only
      # proves the process booted, not that the cluster can accept writes —
      # exactly the "process alive, service dead" state the constitution bans.
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Topics are created explicitly, once. `auto.create.topics.enable` would let a
  # single typo mint a topic nobody consumes, which then swallows messages in
  # silence until retention expires — the worst class of failure this project has.
  redpanda-topics:
    image: redpandadata/redpanda:v24.2.7
    container_name: cogniforge-redpanda-topics
    depends_on:
      redpanda:
        condition: service_healthy
    networks:
      - cogniforge-network
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        for spec in \
          "cogniforge.product.events.v1 3 2592000000" \
          "cogniforge.learning.evaluated.v1 3 1209600000" \
          "cogniforge.notifications.requested.v1 1 604800000" \
          "cogniforge.dead-letter.v1 1 7776000000"; do
          set -- $$spec
          rpk topic create "$$1" --brokers redpanda:9092 \
            --partitions "$$2" --topic-config retention.ms="$$3" || true
        done
        rpk topic list --brokers redpanda:9092
    restart: "no"

  postgres-temporal:
    image: postgres:16-alpine
    container_name: cogniforge-postgres-temporal
    restart: unless-stopped
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
      POSTGRES_DB: temporal
    networks:
      - cogniforge-network
    volumes:
      - postgres-temporal-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Temporal owns the workflows that must survive a restart: the weekly guardian
  # report, corpus ingestion, and reminder fan-out. Those are long, resumable and
  # cancellable — precisely what a cron job plus a retry loop gets wrong.
  temporal:
    image: temporalio/auto-setup:1.25.2
    container_name: cogniforge-temporal
    restart: unless-stopped
    depends_on:
      postgres-temporal:
        condition: service_healthy
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - POSTGRES_SEEDS=postgres-temporal
    ports:
      - "7233:7233"
    networks:
      - cogniforge-network
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "temporal:7233"]
      interval: 15s
      timeout: 5s
      retries: 10

  temporal-ui:
    image: temporalio/ui:2.31.2
    container_name: cogniforge-temporal-ui
    restart: unless-stopped
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:3000
    ports:
      - "8233:8080"
    networks:
      - cogniforge-network

networks:
  # R0.1 (D-172): compose-managed with a stable name so `docker compose up`
  # self-creates it — no manual `docker network create` pre-step. The fixed
  # `name:` preserves the `cogniforge-network` identity that the sibling compose
  # files (step3/step6/host) reference as external.
  cogniforge-network:
    name: cogniforge-network
    driver: bridge

volumes:
  redpanda-data:
  postgres-temporal-data:
  postgres-planning-data:
  postgres-memory-data:
  postgres-user-data:
  postgres-research-data:
  postgres-reasoning-data:
  postgres-observability-data:
  postgres-orchestrator-data:
  prometheus-data:
  grafana-data:
