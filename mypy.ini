[mypy]
python_version = 3.12
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
strict_equality = true
plugins = pydantic.mypy

[mypy.plugins.sqlmodel]
enabled = false

[mypy-tests.*]
ignore_errors = true

[mypy-legacy.*]
ignore_errors = true

[mypy-alembic.*]
ignore_errors = true

# D-192 (roadmap D2): we type-check *our* code, not our dependencies. Installing
# httpx so `shared/http_client` can be checked properly also drags in httpx's
# optional CLI module, which imports `rich` — an extra we do not install. Those
# are errors in someone else's file, and letting them fail the gate would teach
# the next person to reach for `--ignore-missing-imports`, which hides real errors
# in our code too. Silence the library, keep the strictness where it belongs.
[mypy-httpx.*]
ignore_errors = true

# `rich` and `click` are httpx's optional CLI extras, not our dependencies.
[mypy-rich.*]
ignore_missing_imports = true

[mypy-click.*]
ignore_missing_imports = true

# Same rule, second instance: `pydantic_settings` reads YAML behind an optional
# extra. A gate that passes only where a particular set of stubs happens to be
# installed is a gate that runs in CI alone — the same defect this round fixed in
# `check_core_kernel_acl`. Enumerated deliberately, one library at a time, so the
# strictness on our own code is never traded away wholesale.
[mypy-pydantic_settings.*]
ignore_errors = true

[mypy-yaml.*]
ignore_missing_imports = true
