# =============================================================================
# Grafana — custom config for CogniForge Mission Control
# =============================================================================
# This file is mounted at /etc/grafana/grafana.ini inside the container.
# Sets the default home dashboard so anonymous viewers land on the curated
# Mission Control panel — not Grafana's generic "welcome" page.
#
# IMPORTANT — environment-aware overrides
# ---------------------------------------
# Defaults below are tuned for LOCAL execution (http://localhost:3001).
# In GitHub Codespaces the Grafana UI is reached through the GitHub-issued
# preview proxy (https://<CODESPACE_NAME>-3001.preview.app.github.dev/), which
# is cross-origin to the container. The defaults `domain=localhost`,
# `cookie_samesite=lax`, and `cookie_secure=false` make the browser refuse the
# Grafana session cookie under that proxy → infinite redirect / blank panels.
#
# `.devcontainer/start_observability.sh` detects Codespaces at boot and
# OVERRIDES the three variables below via env passthrough on the Grafana
# container (`GF_SERVER_ROOT_URL`, `GF_SERVER_DOMAIN`,
# `GF_SECURITY_COOKIE_SAMESITE`, `GF_SECURITY_COOKIE_SECURE`,
# `GF_SECURITY_CSRF_ALWAYS_CHECK`). DO NOT hard-code the Codespaces URL here —
# Grafana env vars trump grafana.ini at process boot.
# =============================================================================

[server]
# Default = local. Codespaces overrides via env (see start_observability.sh).
protocol = http
http_port = 3000
domain = localhost
root_url = %(protocol)s://%(domain)s:%(http_port)s/
serve_from_sub_path = false

[security]
admin_user = admin
allow_embedding = true
# Default = lax (good for localhost). Codespaces overrides to `none` + secure.
cookie_samesite = lax
cookie_secure = false
# Disable strict CSRF host check — the GitHub Codespaces proxy strips/rewrites
# the Origin/Host headers, which would otherwise trigger 403 on POST endpoints.
# Safe here because anonymous viewer is the only auth surface and admin login
# is gated on a strong password. Hardcoded false because env override is
# additive and env always wins.
csrf_always_check = false

[auth.anonymous]
enabled = true
org_role = Viewer
hide_version = true

[users]
default_theme = dark
home_page = /d/cogniforge-mission-control/cogniforge-mission-control

[dashboards]
default_home_dashboard_path = /var/lib/grafana/dashboards/00-mission-control.json
min_refresh_interval = 5s

[explore]
enabled = true

[unified_alerting]
enabled = false

[news]
news_feed_enabled = false

[analytics]
reporting_enabled = false
check_for_updates = false
check_for_plugin_updates = false

[log]
level = warn

[panels]
disable_sanitize_html = true

[feature_toggles]
enable = traceqlEditor traceqlSearch publicDashboards
