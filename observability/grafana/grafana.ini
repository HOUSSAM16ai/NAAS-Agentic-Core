# =============================================================================
# Grafana — custom config for CogniForge Mission Control
# =============================================================================
# This file is mounted at /etc/grafana/grafana.ini inside the container.
# Sets the default home dashboard so anonymous viewers land on the curated
# Mission Control panel — not Grafana's generic "welcome" page.
# =============================================================================

[server]
domain = localhost
root_url = %(protocol)s://%(domain)s:%(http_port)s/

[security]
admin_user = admin
allow_embedding = true
cookie_samesite = lax

[auth.anonymous]
enabled = true
org_role = Viewer
hide_version = true

[users]
default_theme = dark
home_page = /d/cogniforge-mission-control/cogniforge-mission-control

[dashboards]
default_home_dashboard_path = /var/lib/grafana/dashboards/00-mission-control.json
min_refresh_interval = 5s

[explore]
enabled = true

[unified_alerting]
enabled = false

[news]
news_feed_enabled = false

[analytics]
reporting_enabled = false
check_for_updates = false
check_for_plugin_updates = false

[log]
level = warn

[panels]
disable_sanitize_html = true

[feature_toggles]
enable = traceqlEditor traceqlSearch publicDashboards
