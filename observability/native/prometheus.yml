# =============================================================================
# Prometheus — NATIVE-BINARY config (no Docker)
# =============================================================================
# Used when Prometheus runs as a process inside the dev container alongside
# uvicorn/Next.js, started by .devcontainer/supervisor.sh. The Docker-compose
# variant lives at observability/prometheus/prometheus.yml and is the source
# of truth for the full multi-service stack — DO NOT delete it; it's the
# target for the future path-consistency refactor (see CLAUDE.md §6.16).
#
# In the native mode there is no OTel collector, no Loki, no Tempo, and no
# Grafana sibling network. Prometheus, Grafana, and the FastAPI app all share
# one Linux network namespace (the dev container's), so we scrape over
# localhost.
# =============================================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: cogniforge-codespace
    namespace: cogniforge
    mode: native

scrape_configs:

  # ---- The FastAPI app's in-process Prometheus exposition --------------
  # Exported by app/api/routers/observability.py + app/telemetry/metrics.py.
  # Carries cogniforge_ws_chat_turn_* + standard FastAPI HTTP metrics.
  - job_name: cogniforge-fastapi
    metrics_path: /api/v1/observability/prometheus
    static_configs:
      - targets: ["localhost:8000"]
        labels:
          tier: app
          source: fastapi-direct

  # ---- Prometheus self-metrics ----------------------------------------
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
        labels:
          tier: stack

  # ---- Grafana self-metrics (its own /metrics endpoint) ---------------
  - job_name: grafana
    metrics_path: /metrics
    static_configs:
      - targets: ["localhost:3001"]
        labels:
          tier: stack

  # ── Step 4: orchestrator-service (uvicorn process on :8006) ─────────────
  # Step 4: /metrics يُصدِّر prometheus_client text format حقيقي.
  # المقاييس: cogniforge_outbox_relay_* + cogniforge_stategraph_* + startup_info
  # يبدأ تلقائياً عبر supervisor.sh عند توفر OPENROUTER_API_KEY.
  # DOWN حتى يُقلع الـ process — ليس خطأ في الـ devcontainer الافتراضي.
  - job_name: orchestrator-service
    metrics_path: /metrics
    scrape_interval: 15s
    scrape_timeout: 10s
    static_configs:
      - targets: ["localhost:8006"]
        labels:
          tier: microservice
          service: orchestrator-service
          step: "4"
    honor_labels: true

  # ── Step 5: user-service (uvicorn process on :8001) ──────────────────────
  # Step 5: /metrics يُصدِّر prometheus_client text format حقيقي.
  # المقاييس: cogniforge_user_requests_total + cogniforge_user_auth_* +
  #           cogniforge_user_db_* + cogniforge_user_startup_info
  # يبدأ تلقائياً عبر supervisor.sh عند توفر DATABASE_URL.
  # DOWN حتى يُقلع الـ process — ليس خطأ في الـ devcontainer الافتراضي.
  - job_name: user-service
    metrics_path: /metrics
    scrape_interval: 15s
    scrape_timeout: 10s
    static_configs:
      - targets: ["localhost:8001"]
        labels:
          tier: microservice
          service: user-service
          step: "5"
    honor_labels: true
