# =============================================================================
# Prometheus — NATIVE-BINARY config (no Docker)
# =============================================================================
# Used when Prometheus runs as a process inside the dev container alongside
# uvicorn/Next.js, started by .devcontainer/supervisor.sh. The Docker-compose
# variant lives at observability/prometheus/prometheus.yml and is the source
# of truth for the full multi-service stack — DO NOT delete it; it's the
# target for the future path-consistency refactor (see CLAUDE.md §6.16).
#
# In the native mode there is no OTel collector, no Loki, no Tempo, and no
# Grafana sibling network. Prometheus, Grafana, and the FastAPI app all share
# one Linux network namespace (the dev container's), so we scrape over
# localhost.
# =============================================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: cogniforge-codespace
    namespace: cogniforge
    mode: native

scrape_configs:

  # ---- The FastAPI app's in-process Prometheus exposition --------------
  # Exported by app/api/routers/observability.py + app/telemetry/metrics.py.
  # Carries cogniforge_ws_chat_turn_* + standard FastAPI HTTP metrics.
  - job_name: cogniforge-fastapi
    metrics_path: /api/v1/observability/prometheus
    static_configs:
      - targets: ["localhost:8000"]
        labels:
          tier: app
          source: fastapi-direct

  # ---- Prometheus self-metrics ----------------------------------------
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
        labels:
          tier: stack

  # ---- Grafana self-metrics (its own /metrics endpoint) ---------------
  - job_name: grafana
    metrics_path: /metrics
    static_configs:
      - targets: ["localhost:3001"]
        labels:
          tier: stack

  # ── Step 4: orchestrator-service (uvicorn process on :8006) ─────────────
  # Step 4: /metrics يُصدِّر prometheus_client text format حقيقي.
  # المقاييس: cogniforge_outbox_relay_* + cogniforge_stategraph_* + startup_info
  # يبدأ تلقائياً عبر supervisor.sh عند توفر OPENROUTER_API_KEY.
  # DOWN حتى يُقلع الـ process — ليس خطأ في الـ devcontainer الافتراضي.
  - job_name: orchestrator-service
    metrics_path: /metrics
    scrape_interval: 15s
    scrape_timeout: 10s
    static_configs:
      - targets: ["localhost:8006"]
        labels:
          tier: microservice
          service: orchestrator-service
          step: "4"
    honor_labels: true

  # ── Step 5: user-service (uvicorn process on :8001) ──────────────────────
  # Step 5: /metrics يُصدِّر prometheus_client text format حقيقي.
  # المقاييس: cogniforge_user_requests_total + cogniforge_user_auth_* +
  #           cogniforge_user_db_* + cogniforge_user_startup_info
  # يبدأ تلقائياً عبر supervisor.sh عند توفر DATABASE_URL.
  # DOWN حتى يُقلع الـ process — ليس خطأ في الـ devcontainer الافتراضي.
  - job_name: user-service
    metrics_path: /metrics
    scrape_interval: 15s
    scrape_timeout: 10s
    static_configs:
      - targets: ["localhost:8001"]
        labels:
          tier: microservice
          service: user-service
          step: "5"
    honor_labels: true

  # ── Step 6: planning-agent (uvicorn process on :8002) ────────────────────
  # Step 6: /metrics يُصدِّر prometheus_client text format حقيقي.
  # المقاييس: cogniforge_planning_requests_total + cogniforge_planning_plans_total +
  #           cogniforge_planning_dspy_* + cogniforge_planning_db_* +
  #           cogniforge_planning_startup_info{step="6"}
  # يبدأ تلقائياً عبر supervisor.sh عند توفر DATABASE_URL.
  # يعمل بخطة احتياطية عند غياب OPENROUTER_API_KEY (DSPy disabled).
  # DOWN حتى يُقلع الـ process — ليس خطأ في الـ devcontainer الافتراضي.
  - job_name: planning-agent
    metrics_path: /metrics
    scrape_interval: 15s
    scrape_timeout: 10s
    static_configs:
      - targets: ["localhost:8002"]
        labels:
          tier: microservice
          service: planning-agent
          step: "6"
    honor_labels: true

  # ── Step 7: research-agent (uvicorn process on :8007) ────────────────────
  # Step 7: /metrics يُصدِّر prometheus_client text format حقيقي.
  # المقاييس: cogniforge_research_requests_total + cogniforge_research_searches_total +
  #           cogniforge_research_tavily_calls_total + cogniforge_research_tavily_errors_total +
  #           cogniforge_research_deep_research_total + cogniforge_research_db_* +
  #           cogniforge_research_startup_info{step="7",tavily_available=...}
  # يبدأ تلقائياً عبر supervisor.sh عند توفر DATABASE_URL.
  # Tavily web search حي عند توفر TAVILY_API_KEY — اختياري، الخدمة تعمل بدونه.
  # DOWN حتى يُقلع الـ process — ليس خطأ في الـ devcontainer الافتراضي.
  - job_name: research-agent
    metrics_path: /metrics
    scrape_interval: 15s
    scrape_timeout: 10s
    static_configs:
      - targets: ["localhost:8007"]
        labels:
          tier: microservice
          service: research-agent
          step: "7"
    honor_labels: true

  # ── Step 8: reasoning-agent (uvicorn process on :8008) ───────────────────
  # Step 8: /metrics يُصدِّر prometheus_client text format حقيقي.
  # المقاييس: cogniforge_reasoning_requests_total + cogniforge_reasoning_invocations_total +
  #           cogniforge_reasoning_mcts_expansions_total + cogniforge_reasoning_mcts_errors_total +
  #           cogniforge_reasoning_llm_calls_total + cogniforge_reasoning_llm_errors_total +
  #           cogniforge_reasoning_fallback_responses_total +
  #           cogniforge_reasoning_startup_info{step="8",llm_backend=...,mcts_enabled="true"}
  # يبدأ تلقائياً عبر supervisor.sh عند توفر DATABASE_URL.
  # MCTS حي دائماً — LLM يعمل عند توفر OPENROUTER_API_KEY أو OPENAI_API_KEY.
  # DOWN حتى يُقلع الـ process — ليس خطأ في الـ devcontainer الافتراضي.
  - job_name: reasoning-agent
    metrics_path: /metrics
    scrape_interval: 15s
    scrape_timeout: 10s
    static_configs:
      - targets: ["localhost:8008"]
        labels:
          tier: microservice
          service: reasoning-agent
          step: "8"
    honor_labels: true

  # ── Step 9: Skills Pipeline metrics (via orchestrator-service :8006) ─────
  # Step 9: /compose endpoint نشط — orchestrator يستدعي planning+research+reasoning عبر HTTP.
  # المقاييس الجديدة: cogniforge_pipeline_invocations_total{mode=full|partial|fallback} +
  #                   cogniforge_pipeline_duration_seconds + cogniforge_pipeline_skill_calls_total +
  #                   cogniforge_pipeline_skill_duration_seconds + cogniforge_pipeline_errors_total +
  #                   cogniforge_pipeline_active_gauge +
  #                   cogniforge_orchestrator_startup_info{pipeline_enabled="true",step="9"}
  # يُصدَر من orchestrator-service:8006/metrics (نفس الـ job الموجود).
  # label step="9" يُضاف هنا للتمييز في Grafana.
  - job_name: skills-pipeline
    metrics_path: /metrics
    scrape_interval: 10s
    scrape_timeout: 8s
    static_configs:
      - targets: ["localhost:8006"]
        labels:
          tier: microservice
          service: skills-pipeline
          step: "9"
    honor_labels: false


  # ── Step 10: Postgres Checkpointer metrics (via orchestrator-service :8006) ─
  # Step 10: AsyncPostgresSaver ACTIVE — LangGraph state persisted to PostgreSQL.
  # المقاييس: cogniforge_checkpointer_writes_total + reads + duration + errors +
  #           cogniforge_checkpointer_active_threads + cogniforge_checkpointer_backend_info
  - job_name: postgres-checkpointer
    metrics_path: /metrics
    scrape_interval: 10s
    scrape_timeout: 8s
    static_configs:
      - targets: ["localhost:8006"]
        labels:
          tier: microservice
          service: postgres-checkpointer
          step: "10"
    honor_labels: false

  # ── Step 11: content-retrieval-skill (:8009) ─────────────────────────────
  # Step 11: Skill مستقلة لاسترجاع المحتوى التعليمي من knowledge_base/.
  # ISS-042: إصلاح Service Token + DSPy 3.x + parallel pipeline.
  # المقاييس: cogniforge_retrieval_requests_total{status,intent} +
  #           cogniforge_retrieval_duration_seconds + cogniforge_retrieval_intent_total +
  #           cogniforge_retrieval_hits_total + cogniforge_retrieval_misses_total +
  #           cogniforge_retrieval_knowledge_base_size + cogniforge_retrieval_startup_info
  - job_name: content-retrieval-skill
    metrics_path: /metrics
    scrape_interval: 10s
    scrape_timeout: 8s
    static_configs:
      - targets: ["localhost:8009"]
        labels:
          tier: microservice
          service: content-retrieval-skill
          step: "11"
    honor_labels: false

  # ── Step 12: conversation-service (:8003) ────────────────────────────────
  # Step 12: Skill مستقلة لإدارة المحادثات التعليمية — LangGraph StateGraph.
  # D-042: conversation-service يُفعَّل كـ uvicorn process على :8003.
  # يُضيف الخدمة السادسة للـ Skills Architecture.
  # المقاييس: cogniforge_conversation_requests_total +
  #           cogniforge_conversation_request_duration_seconds +
  #           cogniforge_conversation_active_connections +
  #           cogniforge_conversation_messages_total{direction,route} +
  #           cogniforge_conversation_sessions_total{route,status} +
  #           cogniforge_conversation_session_duration_seconds +
  #           cogniforge_conversation_graph_invocations_total{node,status} +
  #           cogniforge_conversation_graph_duration_seconds +
  #           cogniforge_conversation_graph_errors_total{error_type} +
  #           cogniforge_conversation_db_operations_total +
  #           cogniforge_conversation_startup_info{step="12",graph_ready,db_ready,ws_enabled}
  # يبدأ تلقائياً عبر supervisor.sh STEP 4J.
  # يعمل بدون OPENROUTER_API_KEY (deterministic fallback).
  # DOWN حتى يُقلع الـ process — ليس خطأ في الـ devcontainer الافتراضي.
  - job_name: conversation-service
    metrics_path: /metrics
    scrape_interval: 10s
    scrape_timeout: 8s
    static_configs:
      - targets: ["localhost:8003"]
        labels:
          tier: microservice
          service: conversation-service
          step: "12"
    honor_labels: false

  # ── D-183: foundations-service (:8010) ───────────────────────────────────
  # النواة الحاسوبية للأسس "first roots" — API-first deterministic compute Skill.
  # لا LLM ولا DB — محرّكات stdlib حتمية (جبر خطّي/تفاضل/إحصاء/تحسين/رسوم/لغات/تعقيد).
  # المقاييس: cogniforge_foundations_requests_total +
  #           cogniforge_foundations_request_duration_seconds +
  #           cogniforge_foundations_active_connections +
  #           cogniforge_foundations_compute_invocations_total{domain,status} +
  #           cogniforge_foundations_compute_duration_seconds{domain} +
  #           cogniforge_foundations_compute_errors_total{domain,error} +
  #           cogniforge_foundations_domain_operations_total{domain,operation} +
  #           cogniforge_foundations_startup_info{step="13",version,domains}
  # يبدأ تلقائياً عبر supervisor.sh STEP 4K. DOWN حتى يُقلع الـ process.
  - job_name: foundations-service
    metrics_path: /metrics
    scrape_interval: 10s
    scrape_timeout: 8s
    static_configs:
      - targets: ["localhost:8010"]
        labels:
          tier: microservice
          service: foundations-service
          step: "13"
    honor_labels: false
