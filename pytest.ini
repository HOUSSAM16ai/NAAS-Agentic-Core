[pytest]
asyncio_mode = auto
python_files = test_*.py
; D-105 (ISS-113): جمع صريح — بدونه pytest يجمع من جذر المستودع فيلتقط scripts/test_*.py
; (سكربتات تحقق يدوي تسمّم sys.modules بـ MagicMock على مستوى الوحدة → mock.Document
; يتسرب لكل الجلسة). scripts/ci يبقى (test_guardrails.py شرعي ونظيف)، و microservices
; يبقى (17 اختباراً حقيقياً في microservices/*/tests/ كانت تُجمع دائماً).
testpaths = tests scripts/ci microservices
markers =
    security: اختبارات تتعلق بالتحقق الأمني.
    architecture: اختبارات تتعلق بالحوكمة المعمارية.
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning
    ignore:.*relationship .* conflicts .*:sqlalchemy.exc.SAWarning
    ignore:The 'validate_default' attribute with value True was provided:pydantic.warnings.UnsupportedFieldAttributeWarning
    ignore:.*allowed_objects.*
