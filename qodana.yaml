####################################################################################################################
# WARNING: Do not store sensitive information in this file, as its contents will be included in the Qodana report. #
####################################################################################################################

version: "1.0"
linter: qodana-python

# Install the project's dependencies before analysis.
#
# Without this the linter cannot resolve a single third-party import, and every annotation
# that references one is reported as a broken type hint. Measured on f4b3b40: 4,964 problems
# total, of which 2,584 were "Invalid type hints definitions and usages" at High severity —
# noise generated by the missing environment, not by the code. A number that large is never
# read and never fixed, which is how a scan becomes decoration (D-016).
#
# requirements-ci.txt is the same set the `lint`, `guardrails` and `test-monolith` jobs
# install, so Qodana sees the tree those gates see. A failure here fails the scan on
# purpose: a silently degraded analysis is worse than a red one (§0 — no silent failure).
bootstrap: pip install --no-cache-dir -r requirements-ci.txt

profile:
  name: qodana.recommended

# Frozen snapshots and data, not live source. `docs/archive/` is explicitly append-only
# history (D-173), and reporting on it can never lead to a fix.
exclude:
  - name: All
    paths:
      - docs/archive
      - migrations_archive
      - knowledge_base
      - data

include:
  - name: CheckDependencyLicenses
