id: iss138_letter_c
issue: ISS-138
title: >-
  «ماذا نقصد بحرف C» تُجوهَل، ويُعاد على الطالب اشتقاقُه مضافاً إليه تسريب 165.

# الكارثة المُغلَقة في D-185، مُثبَّتة هنا كعقد دائم: الطالب سأل عن رمزٍ **طبعه
# المعلّم نفسه**، فتُجوهِل السؤال وأُعيدت كتلة الاشتقاق (4 · 10 · 14) مضافاً إليها
# $C_{11}^{3} = 165$ — أي أن النظام ردّ على «لم أفهم الرمز» بإعادة ما لم يُفهَم
# **زائد** تسريب نتائج جديدة كان على الطالب اشتقاقها.
#
# يُحرَس هنا لأن الاختبارات الوحدوية تفحص الدوالّ، وهذا يفحص ما يراه الطالب —
# فيبقى صالحاً مهما أُعيد تنظيم الطبقات تحته.

seed_history:
  - role: user
    content: >-
      كيس يحتوي على 4 كرات حمراء و2 بيضاء و5 خضراء. نسحب عشوائياً 3 كرات في آن واحد.
      ما احتمال الحصول على 3 كرات من نفس اللون؟
  - role: assistant
    content: >-
      عدد الحالات الملائمة: كرة حمراء $C_4^3$، كرة بيضاء مستحيلة، كرة خضراء $C_5^3$.

turns:
  # الرمز يُعرَّف، والتعريف **ليس إجابة**: مثال السجلّ محايد فلا يحمل أرقام التمرين.
  - student: "ماذا نقصد بحرف C"
    must_answer: true
    must_contain: ["التوافيق"]
    must_not_contain: ["165", "14", "56"]

  # «الحادثة C» حدثٌ لا حرف — الالتباس بينهما كان كارثياً على طالب البكالوريا.
  # لا يُشترط جواب حتمي هنا؛ المطلوب ألّا يُخطَف السؤال إلى تعريف التوافيق.
  - student: "ما هي الحادثة C"
    must_not_contain: ["التوافيق"]
