id: iss139_yaqsud_c
issue: ISS-139
title: >-
  «ماذا يقصد بالحرف C» يُجاب بالمثال وحده، و«لم أفهم» تُصفّر الموضوع إلى سؤال الألوان.

# الترانسكريبت الحيّ (BAC 2024، بعد D-185): الطالب سأل عن الرمز `C` الذي طبعه المعلّم
# نفسه، فظهر «## مثال ملموس» + مثال الكتب **بلا عنوان ولا تعريف** — أي أن الطالب لم
# يُخبَر أصلاً أن `C` تعني التوافيق. ثم قال «لم افهم» فعاد النظام إلى سؤال الألوان الأول.
#
# جذران بنيويّان:
#   ١. قوائم علامات النيّة الخمس تتفرّق ⇒ «ماذا يقصد» تُصنَّف `unknown`.
#   ٢. سُلّم التصعيد يتخطّى الرُّتبة المُسلَّمة دائماً ⇒ سؤال تعريفي مُعاد يُجاب بالمثال
#      وحده. (هذا يقع **حتى مع** تصنيف صحيح — فالطبقة ١ وحدها ما كانت لتكفي.)

# سياق التمرين كما هو على الشاشة قبل أسئلة الطالب (تمرين BAC 2024 — كيس الكرات).
seed_history:
  - role: user
    content: >-
      كيس يحتوي على 4 كرات حمراء و2 بيضاء و5 خضراء. نسحب عشوائياً 3 كرات في آن واحد.
      ما احتمال الحصول على 3 كرات من نفس اللون؟
  - role: assistant
    content: >-
      لنبدأ معاً. عدد كل السحبات الممكنة هو $C_{11}^{3}$. ما رأيك: كم لوناً يمكن أن
      تكون منه الكرات الثلاث؟

turns:
  # التمهيد: التعريف سبق أن سُلِّم في دور سابق (هذا ما يجعل السُّلّم يتخطّاه).
  - student: "ماذا نقصد بحرف C"
    must_contain: ["التوافيق"]
    must_answer: true

  # الدور الكارثي: صيغة أخرى لنفس السؤال ⇒ يجب أن يبقى تعريفاً، لا مثالاً عارياً.
  - student: "ماذا يقصد بالحرف C"
    must_answer: true
    must_contain: ["التوافيق"]
    must_not_start_with: "## مثال ملموس"
    # ممنوع تسريب أرقام التمرين عبر باب التعريف (D-113).
    must_not_contain: ["165", "14 + 10", "56"]

  # الدارجة — نفس النيّة، نفس الجواب. القوائم المتفرّقة كانت تُسقطها.
  # وسؤالٌ مُعاد يُجاب بتعريفٍ **متقدّم** لا بنسخة حرفية («صفر تكرار حرفي»).
  - student: "شنو يقصد بـ C"
    must_answer: true
    must_contain: ["التوافيق"]
    must_not_start_with: "## مثال ملموس"
    must_differ_from_previous: true

  # «لم أفهم» بعد جواب رمزي ⇒ يبقى على الرمز (D-184: البؤرة لاصقة).
  # ممنوع التصفير إلى سؤال الألوان الأول.
  #
  # و«165»/«14» ممنوعان هنا بالذات: التحقّق الحيّ E2E كشف أن قائمة تحديد موضع
  # التعثّر كانت تحمل قيم التمرين في بنودها — فسؤالٌ غرضه التشخيص كان يُسلّم
  # الطالب الجوابَ الذي يُفترض أن يشتقّه (تسريب D-113 من باب التشخيص).
  - student: "لم افهم"
    must_answer: true
    must_not_contain: ["نفس اللون", "165", "الحل الكامل", "شرحنا الحل"]
