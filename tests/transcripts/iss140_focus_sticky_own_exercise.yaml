id: iss140_focus_sticky_own_exercise
issue: ISS-140
title: >-
  «لم أفهم» على تمرينٍ كتبه الطالب بنفسه كانت تُصفِّر الموضوع إلى ردٍّ عامّ («لم تُقدِّم سؤالاً محدداً»).

# الترانسكريبت الحيّ (ISS-140 د-2): تسلسل من اتصال WS واحد —
#   (1) «كيس فيه كرات ملوّنة، نسحب 3 كرات…» ⇒ probe تشخيصي سليم.
#   (2) «لم أفهم» ⇒ «عذراً، لم تُقدِّم سؤالاً محدداً…».
#   (3) «لم أفهم» ⇒ ردّ عامّ آخر.
# أي **تصفير الموضوع** — وهو ما يحرّمه D-184 صراحةً («البؤرة لاصقة»).
#
# الجذر (D-191): المحرك الحتمي كان يعمل على التمرين المخزَّن الرسمي حصراً، فتمرينٌ
# يكتبه الطالب بنفسه لا يُنتج تركيبة ⇒ لا مادة للمعلّم ⇒ سقوط إلى LLM عامّ يجهل
# السياق. المُحلّ الآن يبحث عن تمرين الطالب في **تاريخ المحادثة** (رسائل user فقط،
# D-102) قبل أيّ سقوط — فالبؤرة تبقى على تمرينه هو.
#
# القاعدة المحروسة: حيرةٌ مجرّدة بعد تمرينٍ كتبه الطالب ⇒ تعليمٌ على تمرينه، لا تصفير.

seed_history:
  - role: user
    content: >-
      عندي كيس فيه 12 كرة: 5 حمراء و4 خضراء و3 صفراء. نسحب 3 كرات دفعة واحدة.
      ما احتمال أن تكون الكرات الثلاث من نفس اللون؟
  - role: assistant
    content: >-
      لنبدأ معاً. كم لوناً يمكن أن تكون منه الكرات الثلاث؟

turns:
  # الحيرة الأولى: يجب أن تُنتج تعليماً حتمياً، لا اعتذاراً عامّاً.
  - student: "لم أفهم"
    must_answer: true
    must_not_contain:
      - "لم تُقدِّم سؤالاً محدداً"
      - "لم تقدم سؤالاً محدداً"
      - "بيضاء"

  # الحيرة الثانية بصيغة الدارجة — نفس النيّة، ويجب أن تتقدّم لا أن تتكرّر حرفياً.
  - student: "مفهمتش"
    must_answer: true
    must_not_contain:
      - "لم تُقدِّم سؤالاً محدداً"
      - "لم تقدم سؤالاً محدداً"
      - "بيضاء"

  # وبعد الحيرة، سؤال محدّد عن تمرينه يبقى على أرقامه هو.
  - student: "كيف حسبنا 4"
    must_answer: true
    must_contain: ["4"]
    must_not_contain: ["بيضاء", "165"]
