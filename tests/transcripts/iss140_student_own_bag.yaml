id: iss140_student_own_bag
issue: ISS-140
title: >-
  تمرين يكتبه الطالب بنفسه يُشرَح بأرقام تمرينٍ مخزَّن آخر — أرقامٌ لم يذكرها تُطبَع كأنها أرقامه.

# الترانسكريبت الحيّ: الطالب كتب «كيس يحتوي 12 كرة: 5 حمراء و4 خضراء و3 صفراء»
# فجاء الردّ يشرح كيساً فيه «4 حمراء، 2 بيضاء، 5 خضراء» — كيانات تمرين بكالوريا 2024
# المخزَّن تُزيح معطياته بلا أيّ إشعار. الطالب يُعلَّم مسألةً غير مسألته.
#
# الجذر (D-191): `_load_canonical_combinations` كانت تستقبل `question` و**ترميه**،
# فتُمرِّر حرفيّةً مُثبَّتة «اعطني تمرين الاحتمالات 2024» إلى الاسترجاع ثمّ تُغذّي
# المحرّك الرمزي بنصّ التمرين الرسمي. سبع نسخ من تلك الحرفية عبر أربعة ملفّات.
# وجذرٌ ثانٍ: نصوصٌ تعليمية ثابتة تحمل تركيبة التمرين المرجعي حرفياً
# («كلها بيضاء … عدد البيضاء 2 فقط») في `semantic_property_skill` و
# `understanding_state_skill` — تسريبٌ لا يمرّ بالمُحلّ أصلاً.
#
# القاعدة المحروسة هنا: **لا يُطبَع رقمٌ ولا كيانٌ لم يذكره الطالب** حين يملك تمرينه.

seed_history:
  - role: user
    content: >-
      كيس يحتوي على 12 كرة: 5 حمراء و4 خضراء و3 صفراء. نسحب 3 كرات في آن واحد.
      ما احتمال أن تكون الكرات الثلاث من نفس اللون؟
  - role: assistant
    content: >-
      لنبدأ معاً. كم لوناً يمكن أن تكون منه الكرات الثلاث؟

turns:
  # مبدأ الضرب يُشتقّ من فضاء الطالب (12) لا من فضاء التمرين المرجعي (11).
  - student: "لماذا نضرب 12×11×10"
    must_answer: true
    must_contain: ["12"]
    must_not_contain: ["بيضاء", "165", "11×10×9"]

  # المثال الملموس يستعمل ألوان كيس الطالب — ولا لون بيضاء في كيسه أصلاً.
  - student: "اعطني مثال"
    must_answer: true
    must_not_contain: ["بيضاء", "165"]

  # «لم أفهم» كانت تُعيد تعريفاً ثابتاً يذكر «عدد البيضاء 2 فقط» — كرات لا وجود لها.
  - student: "لم أفهم"
    must_answer: true
    must_not_contain: ["بيضاء", "165"]

  # جزئية محسوبة: العدد يجب أن يكون عدد الطالب (5 حمراء) لا عدد التمرين المخزَّن (4).
  - student: "كيف حسبنا 5"
    must_answer: true
    must_contain: ["5"]
    must_not_contain: ["بيضاء", "165"]

  # الرمز يُعرَّف بلا تسريب أرقام أيّ تمرين (D-185 يبقى سارياً).
  - student: "ماذا نقصد بحرف C"
    must_answer: true
    must_contain: ["التوافيق"]
    must_not_contain: ["165", "بيضاء"]
