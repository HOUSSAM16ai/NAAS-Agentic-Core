id: iss144_first_question_only
issue: ISS-144
title: >-
  طالبٌ طلب «السؤال الأول فقط» ثلاث مرّات فلم يحصل عليه ولا مرّة — مرّةً بالتمرين كاملاً،
  ومرّةً بسؤالٍ سقراطي عن الألوان لم يطلبه.

# الترانسكريبت الحرفي من الإنتاج (`customer_messages`، المحادثة 836، 2026-08-02 01:48–01:51):
#
#   4589 user      «اعطني اول سؤال من التمرين فقط»
#   4590 assistant «## التمرين الأول … يحتوي كيس على 11 كرة …»   ← التمرين **كاملاً**
#   4591 user      «لقد طلبت السؤال الأول فقط»
#   4592 assistant «لنبدأ من فهمك أنت — … أيّ الألوان …»          ← probe لم يطلبه أحد
#
# الجذر (D-206) — أربعة أعطاب، كُشفت بالتعقّب وقت التشغيل لا بالتحليل الساكن:
#
#   1. **الأسبقيّة (L2)** — الجذر الحقيقي. `detect_question_only_request` كشفت الطلب
#      **صحيحاً** (`recognized=True n=1`)، لكنّ `_stage_policy_gate` (المرحلة الأولى)
#      بثّت probe الاحتمالات وأنهت الدور، فلم تُشغَّل `_stage_question_only` أبداً.
#      التحليل الساكن أخطأ التشخيص هنا مرّتين — انظر قاعدة D-190#2.
#   2. **الترتيبيات (L4/L6)** — `_ORDINAL_QUESTION_NUMBERS` ستّ صيغ **مُعرَّفة فقط**
#      تُطابَق بـ`lower()` التي لا تفعل شيئاً بالعربية. «اول» نكرةً ⇒ `None`.
#      وما نجح في الدور الثاني نجح بالصدفة: «الأول» التُقطت من نصّ التمرين الملصوق.
#   3. **الاقتطاع الواسع (L1)** — `_extract_numbered_question` يُرجِع البند من **كل**
#      الأجزاء مجموعةً، و`question_only_full_display` يبثّ التمرين كاملاً عند التعذّر.
#      أي أنّ الرمز يقرأ «فقط» ثمّ يفعل نقيضها.
#   4. **لا نيّة قانونية** — `classify` أعادت `computation` (د2) و`None` (د3).
#
# القاعدة المحروسة هنا: **نطاق الطالب عقد لا اقتراح** — يُخدَم أو يُسأل عنه سؤال واحد،
# ولا يُردّ عليه بأوسع ممّا طُلِب، ولا تُلحِق مرحلةٌ أخرى أجندتها.

seed_history:
  - role: user
    content: "اعطني تمرين الاحتمالات 2024"
  - role: assistant
    content: >-
      ## التمرين الأول (04 نقاط) — الاحتمالات (Exercise 1)

      يحتوي كيس على 11 كرة متماثلة لا تُفرّق باللمس: كرتان بيضاوان، أربع كرات حمراء،
      خمس كرات خضراء. نسحب عشوائيًا 3 كرات دفعة واحدة.

turns:
  # الدور الحقيقي 4589. كان يُرجِع التمرين كاملاً؛ الآن بندٌ واحد.
  # `max_chars` تحرس L10: الردّ الكارثي كان أضعاف هذا الحجم.
  - student: "اعطني اول سؤال من التمرين فقط"
    must_answer: true
    max_chars: 700
    must_contain: ["P(A)"]
    must_not_contain:
      - "كرتان بيضاوان"        # نصّ المعطيات كاملاً = الجدار الذي أغرق الطالب
      - "لنبدأ من فهمك أنت"    # probe العقل الاحتمالي — أجندة لم يطلبها
      - "P(X"                   # بند الجزء (2): أوسع من «السؤال الأول»

  # الدور الحقيقي 4591 — **شكوى** لا سؤال جديد (L3). كانت تُصفَّر إلى probe الألوان.
  - student: "لقد طلبت السؤال الأول فقط"
    must_answer: true
    max_chars: 700
    must_contain: ["P(A)"]
    must_not_contain:
      - "لنبدأ من فهمك أنت"
      - "أيّ الألوان"
      - "كرتان بيضاوان"

  # صفر انحدار على ISS-038: طلبُ الشرح لا يُختطَف إلى اقتطاع.
  # (المسار الحتمي لا يشرح؛ الشرط هنا ألّا يُسلَّم نصُّ بندٍ مقتطَع.)
  - student: "اشرح لي السؤال الأول"
    must_not_contain:
      - "يتكرّر في جزء آخر"
