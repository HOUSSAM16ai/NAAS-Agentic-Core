id: iss148_procedure_question_leak
issue: ISS-148
title: >-
  طالبٌ سأل «كيف نحسب» فتسلّم الحلّ بدل الطريقة: 4 و10 و14 ثمّ 165، ثمّ دوراً فارغاً
  يَعِد بالخطوات ولا يُعطي خطوة، ثمّ تكراراً لـ165 بصياغة أخرى.

# ═══════════════════════════════════════════════════════════════════════════════
# الترانسكريبت الحرفي من الإنتاج — `customer_messages`، المحادثة **837**،
# المُعرَّفات 4602→4615، 2026-08-02 16:50:18 → 16:52:08 UTC. مقروءاً من قاعدة
# البيانات الحيّة لا من بلاغٍ منقول:
#
#   4602 user      «اعطني تمرين الاحتمالات 2024»
#   4603 assistant التمرين كاملاً (1,036 حرفاً)
#   4604 user      «كيف نحسب احتمال حادثة ؟»
#   4605 assistant probe تشخيصي — **سليم**
#   4606 user      «لم أفهم»
#   4607 assistant «## مثال ملموس» — مقبول
#   4608 user      «كيف نحسب الحادثة A»
#   4609 assistant ‼️ «- كرة حمراء: $C_{4}^{3} = … = 4$ … كرة خضراء: $C_{5}^{3} = …»
#   4610 user      «كيف نحسب A»
#   4611 assistant ‼️ «**كل الطرق الممكنة** لسحب 3 من 11: $C_{11}^{3} = … = 165$»
#   4612 user      «كيف نحسب البسط»
#   4613 assistant ‼️ «لنُكمل معاً خطوة بخطوة حتى النهاية:\n\nالآن أمامك كل
#                     المكوّنات — ركّب الاحتمال **بنفسك** …» — ١٣٦ حرفاً، صفر خطوة
#   4614 user      «كيف حسبنا 165»
#   4615 assistant ‼️ «## فضاء العينة C(11,3) … = 165$ … أي يوجد 165 طريقة»
#
# ═══════════════════════════════════════════════════════════════════════════════
# الجذور (كلٌّ مُتحقَّق في المصدر لا مُستنتَج):
#
#   1. **الوسيط المنسيّ** — `_build_symbolic_reveal` له **٧** مواضع نداء، و**واحد**
#      فقط يُمرِّر `delivered` (`turn_engine.py:258`). فالفشل باتّجاهين متعاكسين:
#      بلا `delivered` يُعاد تفريغ كل شيء (4609/4611/4615)، ومع `delivered` كاملة
#      يُحذَف كلّ بلوك فيبقى العنوان والخاتمة وحدهما — وهو **بالحرف** الدور 4613
#      (`socratic_narrative.py:341-348`). معاملٌ ينساه ستّةٌ من سبعة ليس صمّام أمان.
#
#   2. **الحارس يقيس النثر لا الحقائق** — `_norm_for_dedup` يُقنّع كل رقم إلى `#`،
#      و`_recently_emitted` يطلب تشابهاً نثرياً ≥ 0.8 في نافذة ٦ رسائل. فصياغةٌ
#      جديدة لنفس القيمة تمرّ. لا دفتر لِما كُشِف.
#
#   3. **«كيف نحسب» ليست «اشرح لي الحلّ»** — طلبُ الطريقة يستحقّ الطريقة؛ تسليمُ
#      الناتج يقتل أثر التوليد (§0: منصّة تعليمية لا محرّك إجابات).
#
#   4. **«البسط» ليست علامة نيّة** — `_detect_subpart_question` يعرف الألوان و165
#      و14 ولا يعرف «البسط»/«المقام»، بينما `_build_naming_answer` يتفرّع على
#      `pending_focus == "denominator"`. مفردتان لنيّة واحدة (D-186/D-206·L6).
#
# القاعدة المحروسة هنا: **ما يستطيع الطالب توليده لا يُسلَّم له**، وما سُلِّم لا
# يُعاد، ووعدٌ بشرحٍ يجب أن يصل.
# ═══════════════════════════════════════════════════════════════════════════════

# دفتر الحقائق: كلٌّ من هذه السلاسل يظهر **مرّة واحدة** على امتداد العقد كلّه.
#
# لماذا الاشتقاق لا الرقم: بعد أن يرى الطالب `165` على الشاشة يصير ذكرُها مشروعاً —
# بل إن سؤاله «كيف حسبنا 165» يستلزمها. الممنوع هو **إعادة الاشتقاق نفسه** كأن شيئاً
# لم يُقَل. فالدفتر يقيس ما يُدرِّس (سطر القسمة)، لا ما يُشار إليه (الرقم).
reveal_once:
  - '\dfrac{11\times 10\times 9}'

seed_history:
  # الدور 4602/4603 — التمرين كما سلّمه النظام فعلاً (مختصَراً إلى معطياته).
  - role: user
    content: "اعطني تمرين الاحتمالات 2024"
  - role: assistant
    content: >-
      ## التمرين الأول (04 نقاط) — الاحتمالات

      يحتوي كيس على 11 كرة متماثلة لا تُفرّق باللمس: كرتان بيضاوان مرقمتان بـ 1، 3 —
      أربع كرات حمراء مرقمة بـ 0، 1، 1، 3 — خمس كرات خضراء مرقمة بـ 0، 1، 1، 3، 4.
      نسحب عشوائيًا 3 كرات دفعة واحدة. A: الحصول على 3 كرات من نفس اللون.

turns:
  # الدور الحقيقي 4604 → 4605. كان سليماً ويجب أن يبقى: سؤال تشخيصي واحد.
  - student: "كيف نحسب احتمال حادثة ؟"
    must_answer: true
    must_not_contain:
      - "165"          # فضاء العينة قبل أن يُسأل الطالب عنه
      - "= 14"         # مجموع الحالات الملائمة

  # الدور الحقيقي 4606 → 4607. «لم أفهم» = تشخيص + أدنى تلميح (D-113).
  - student: "لم أفهم"
    must_answer: true
    must_not_contain:
      - "165"
      - "= 14"

  # الدور الحقيقي 4608 → 4609. **قلب الكارثة**: طلبُ الطريقة رُدّ عليه بالناتج.
  # الطالب لم يُسأل عن 4 ولا 10 ولا 14 قطّ، فلا شيء منها كان له أن يُسلَّم.
  - student: "كيف نحسب الحادثة A"
    must_answer: true
    must_not_contain:
      - "= 14"          # مجموع الحالات الملائمة — الناتج المطلوب من الطالب
      - "4 + 10"

  # الدور الحقيقي 4610 → 4611.
  - student: "كيف نحسب A"
    must_answer: true
    must_not_contain:
      - "= 14"

  # الدور الحقيقي 4612 → 4613 — **الوعد الفارغ**: ١٣٦ حرفاً بلا خطوة واحدة.
  # `min_chars` وحدها لا تكفي (حشوٌ يجتازها)، فنمنع معها الخاتمةَ المعلّقة.
  - student: "كيف نحسب البسط"
    must_answer: true
    min_chars: 200
    must_not_contain:
      - "لنُكمل معاً خطوة بخطوة حتى النهاية"   # العنوان الذي لم يتبعه شيء

  # الدور الحقيقي 4614 → 4615 — التكرار: 165 كُشِفت في دورٍ سابق ثمّ أُعيدت.
  # يحرسه `reveal_once` أعلاه + عدم التطابق مع أي دورٍ سابق.
  - student: "كيف حسبنا 165"
    must_answer: true
    must_not_repeat_any_prior: true

  # صفر انحدار على D-113: الناتج النهائي المُركَّب لا يُسلَّم في أي دور.
  - student: "اذن ما هو احتمال A"
    must_not_contain:
      - "P(A) = \\dfrac{14}{165}"
      - "الإجابة النهائية"
