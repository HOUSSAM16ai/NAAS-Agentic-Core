id: iss149_confusion_read_as_mastery
issue: ISS-149
title: >-
  طالبٌ قال «لم أفهم؟» فتلقّى «أحسنت ✅ — يبدو أنك أمسكت الفكرة»، وسُجِّل في نموذجه
  المعرفي أنّه أتقن ما أعلن للتوّ أنّه لم يفهمه.

# ═══════════════════════════════════════════════════════════════════════════════
# الترانسكريبت كما بلّغ عنه المالك — تمرين الاحتمالات 2024، ستّة أدوار بعد التمرين:
#
#   U1 «كيف نحل السؤال الأول؟»          → probe تشخيصي عن الألوان — **سليم**
#   U2 «لم أفهم»                        → «## مثال ملموس» — مقبول
#   U3 «فهمت»                           → ‼️ «$C_{4}^{3}$ … = 4 … $C_{5}^{3}$ … = 10
#                                            … نجمعها: 4 + 10 = 14»
#   U4 «165»                            → اعتراف + «كيف تُكوّن منهما الاحتمال؟» — سليم
#   U5 «كيف نفرق بين البسط و المقام؟»   → ‼️ «## طريقة حساب البسط» وحده، ثمّ طلبُ
#                                            حساب 14 التي سُلِّمت في U3
#   U6 «لم أفهم؟»                       → ‼️‼️ «أحسنت ✅ — يبدو أنك أمسكت الفكرة.
#                                            هل نطبّقها على التمرين الآن؟»
#
# ═══════════════════════════════════════════════════════════════════════════════
# الجذور — كلٌّ مُتحقَّق بتشغيلٍ على المصدر لا مُستنتَج:
#
#   R1 · **الأسبقيّة**. `PedagogicalEscalationSkill.decide()` يفحص
#        `_has_understanding_evidence` في الفرع (1) — قبل كل شيء وبلا أيّ نظرٍ إلى
#        `payload.intent` — ويمسح **آخر ٦ رسائل طالب** لا رسالة الحاضر. والتصنيف
#        كان **سليماً**: `shared/intent` يُرجِع `confusion` لـ«لم أفهم؟». فالعطب في
#        الأسبقيّة لا في الكشف — بالحرف جذرُ ISS-144 (D-206).
#
#   R2 · **الفعل الكلامي**. المؤشّر الذي طابق هو «البسط» داخل سؤال الطالب نفسه في
#        U5. أي أنّ الطالب **سأل** عن المصطلح فحُسِب أنّه **برهنه**. بوّابة D-158
#        («السؤال ليس إجابةً») مطبَّقة على الإجابات ولم تُطبَّق على مؤشّرات الفهم.
#
#   R3 · **جودة العلامة**. `favorable_cases.evidence_markers` تحمل اسماً مفرداً
#        («البسط»)، و`simultaneous_draw` تحمل «مجموعة» — كلمةً عربية شائعة. اسمٌ
#        مفرد يُطابَق في كل ذكرٍ للمصطلح، والذكرُ ليس برهاناً.
#
#   R4 · **سؤال المقارنة يُجاب نصفه**. `_detect_part_by_name` يُطابِق النمطين معاً
#        ويُرجِع أوّلهما بترتيب الـtuple لا بالنيّة. وكاشفُ السؤال المفاهيمي أخطأه
#        مرّتين بفارقٍ صرفيّ ومسافةٍ واحدة: يحمل «الفرق» لا «نفرق»، و«البسط والمقام»
#        لا «البسط و المقام».
#
#   R5 · **ادّعاء الفهم يشتري الحلّ**. «فهمت» ليست محاولةً يُعترَف بها ولا سؤالاً
#        (D-207·L1) — ومكافأتها بالاشتقاق تُدرِّب الطالب على ادّعاء الفهم.
#
#   R6 · **القانون موجود ومرماه ناقص**. `check_confusion_never_an_answer` تفرض
#        «الحيرة ليست إجابة» على `pedagogical_policy_skill` و`socratic_evaluator_skill`
#        فقط — لا على `pedagogical_escalation_skill`، وهي التي أطلقت الكارثة. فارضٌ
#        بلا مرمى (ENGINEERING_DOCTRINE «الثمن الثاني») — نفس صنف ISS-148.
#
# القاعدة المحروسة هنا: **الحيرة المُعلَنة لا تُهنَّأ أبداً**، وذكرُ المصطلح ليس
# برهانَ فهمه، وسؤالٌ عن شيئين يُجاب عن شيئين.
# ═══════════════════════════════════════════════════════════════════════════════

# دفتر الحقائق: اشتقاق البسط يُدرَّس مرّة واحدة على امتداد العقد كلّه.
# (نقيس سطر الاشتقاق لا الرقم — بعد أن يراه الطالب يصير ذكرُه مشروعاً؛ الممنوع
#  إعادةُ تدريسه كأن شيئاً لم يُقَل. حارسُ التكرار في المحرك يُقنّع كل رقم إلى `#`
#  فهو أعمى عن القيم بنيوياً — ولهذا يقيسها العقد.)
reveal_once:
  - '\dfrac{4\times 3\times 2}'

# النموذج المعرفي المحفوظ: حيرةٌ مُعلَنة لا تُنتج «إتقاناً» أبداً.
# هذا هو الضرر الذي يبقى بعد أن يُغلق الطالب الصفحة.
final_kc_state_not:
  favorable_cases: understood

seed_history:
  - role: user
    content: "اعطني تمرين الاحتمالات 2024"
  - role: assistant
    content: >-
      ## التمرين الأول (04 نقاط) — الاحتمالات

      يحتوي كيس على 11 كرة متماثلة لا تُفرّق باللمس: كرتان بيضاوان مرقمتان بـ 1، 3 —
      أربع كرات حمراء مرقمة بـ 0، 1، 1، 3 — خمس كرات خضراء مرقمة بـ 0، 1، 1، 3، 4.
      نسحب عشوائيًا 3 كرات دفعة واحدة. A: الحصول على 3 كرات من نفس اللون.

turns:
  # U1 — كان سليماً ويجب أن يبقى: سؤال تشخيصي واحد بلا أرقام.
  - student: "كيف نحل السؤال الأول؟"
    must_answer: true
    must_not_contain:
      - "= 14"
      - "165"

  # U2 — «لم أفهم» ⇒ تشخيص/مثال، لا اشتقاق (D-113).
  - student: "لم أفهم"
    must_answer: true
    must_not_contain:
      - "= 14"
      - "4 + 10"

  # U3 — ‼️ R5: «فهمت» ادّعاءٌ لا محاولة. لا تُسلَّم الأرقام التي لم يُسأل عنها.
  - student: "فهمت"
    must_not_contain:
      - "= 14"
      - "4 + 10"
      - "نجمعها"

  # U4 — إجابة الطالب على سؤالٍ معلَّق: تُعترَف وتُقدِّم (صفر انحدار على D-155).
  - student: "165"
    must_answer: true

  # U5 — ‼️ R4: سؤالٌ عن **دورَين**؛ الجواب عن أحدهما نصفُ جواب.
  #      ولا يُطلَب من الطالب أن يُنتج ما سُلِّم له في U3.
  - student: "كيف نفرق بين البسط و المقام؟"
    must_answer: true
    must_contain:
      - "المقام"

  # U6 — ‼️‼️ قلب الكارثة: حيرةٌ مُعلَنة رُدّ عليها بتهنئةٍ على الفهم.
  - student: "لم أفهم؟"
    must_answer: true
    must_not_contain:
      - "أحسنت"
      - "أمسكت الفكرة"
