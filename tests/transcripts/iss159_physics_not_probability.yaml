id: iss159_physics_not_probability
issue: ISS-159
title: >-
  سؤال فيزياء («قانون أوم») يُختطَف إلى العقل الاحتمالي فيتلقّى الطالب قائمة تشخيص
  الاحتمالات — لأنّ حارس الموضوع لا يعمل أصلاً حين يصمت سجلّ الاسترجاع.

# ═══════════════════════════════════════════════════════════════════════════════
# البلاغ (بكلمات المالك · ISS-159): «النظام يتعامل مع كل سؤال كأنه تمرين احتمالات،
# مع أنّنا نهدف لإضافة الفيزياء وعلوم الطبيعة والرياضيات وSTEM ومليارات التمارين.»
#
# ═══════════════════════════════════════════════════════════════════════════════
# الجذر — بنيويّ لا كشفيّ، ومُتحقَّق بتشغيلٍ على المصدر:
#
#   الصيغة، حرفياً، في **ستّة** مواضع (probability_ui · exercise_context ·
#   socratic_narrative · turn_engine · escape_hatch · pedagogical_policy_skill):
#
#       _canonical = primary_canonical_topic(question)
#       if _canonical is not None and _canonical.canonical_id != "probability":
#           return None
#
#   و`CANONICAL_TOPICS` تعرف **ثلاثة مواضيع رياضية لا غير**: complex_numbers ·
#   probability · numerical_functions. صفر فيزياء، صفر كيمياء، صفر علوم.
#
#   فسؤال «اشرح لي قانون أوم» يُرجِع `None`، والشرط يسقط عند **ساقه الأولى** —
#   فلا يعمل الحارس أصلاً، ويمضي السؤال إلى العقل الاحتمالي.
#
#   ومُتحقَّق على المصدر قبل الإصلاح: `classify("اشرح لي قانون أوم") → None`،
#   وكذلك أرخميدس والتناضح الخلوي. أي أنّ مكسب D-193 (٣٧ مفهوماً عبر ثلاث مواد)
#   **لم يصل الموجِّه أبداً** — لأنّ مسار الدور لا يستورد `shared/curriculum` إطلاقاً.
#
# القاعدة المحروسة هنا (D-266): **غيابُ الموضوع من سجلّ الاسترجاع ليس إذناً
# بالاحتمالات.** إشارةُ مادةٍ موجبة تجعل السؤال أجنبياً عن الاحتمالات بالبناء —
# وهو امتدادٌ مباشر لقاعدة D-191 («السقوط إلى المرجعي يتطلّب إشارة موجبة»).
# ═══════════════════════════════════════════════════════════════════════════════

# سياق التمرين حاضرٌ عمداً: الكارثة تقع **بعد** أن يكون الطالب في محادثة احتمالات،
# فيسحبه العقلُ الاحتمالي إلى موضوعه مهما سأل. بلا هذا السياق لا يُعاد تمثيلها.
seed_history:
  - role: user
    content: "اعطني تمرين الاحتمالات 2024"
  - role: assistant
    content: >-
      ## التمرين الأول (04 نقاط) — الاحتمالات

      يحتوي كيس على 11 كرة متماثلة لا تُفرّق باللمس: كرتان بيضاوان مرقمتان بـ 1، 3 —
      أربع كرات حمراء مرقمة بـ 0، 1، 1، 3 — خمس كرات خضراء مرقمة بـ 0، 1، 1، 3، 4.
      نسحب عشوائيًا 3 كرات دفعة واحدة. A: الحصول على 3 كرات من نفس اللون.

turns:
  # U1 — ‼️ قلب الكارثة: سؤال فيزياء داخل محادثة احتمالات.
  #      الممنوع: مفردات العقل الاحتمالي وأرقام التمرين المرجعي.
  - student: "اشرح لي قانون أوم"
    must_not_contain:
      - "فضاء العينة"
      - "الحالات الملائمة"
      - "التوافيق"
      - "كرات"
      - "= 14"
      - "165"

  # U2 — فيزياء أخرى، بصياغة «مبدأ» لا «قانون» (الصنف لا الحالة).
  - student: "ما هو مبدأ أرخميدس"
    must_not_contain:
      - "فضاء العينة"
      - "الحالات الملائمة"
      - "التوافيق"
      - "165"

  # U3 — علوم الطبيعة: المادة التي معاملها ٦ في العلوم التجريبية (D-193).
  - student: "ما هو التناضح الخلوي"
    must_not_contain:
      - "فضاء العينة"
      - "الحالات الملائمة"
      - "التوافيق"
      - "165"

  # U4 — سؤال مقارنة فيزيائي. `_detect_conceptual_question` قائمتُها تحوي «الفرق»،
  #      فكان يفتح بوّابة الدخول المعرفية بلا أيّ حارس موضوع (الجذر الثالث).
  - student: "ما الفرق بين الجهد والتيار"
    must_not_contain:
      - "فضاء العينة"
      - "الحالات الملائمة"
      - "التوافيق"
      - "165"

  # U5 — الجذر الرابع: سجلّ الرموز احتماليٌّ بحت و«الرمز قبل كل شيء» (D-185) كان
  #      يُحَلّ **قبل** أيّ حارس موضوع. فمن يسأل عن الأوم يتلقّى شرح فضاء العيّنة —
  #      خطأٌ أسوأ من الصمت لأنه يُدرَّس ويُحفَظ.
  - student: "ما معنى الرمز Ω في الفيزياء"
    must_not_contain:
      - "فضاء العينة"
      - "مجموعة كل النتائج الممكنة"
      - "165"

  # U6 — صفر انحدار: بعد كل ما سبق، سؤال الاحتمالات يبقى مخدوماً.
  #      حارسٌ يُسكِت الموضوع الصحيح ليس إصلاحاً — هو كارثةٌ معكوسة.
  - student: "كيف نحسب عدد الحالات الممكنة"
    must_answer: true
